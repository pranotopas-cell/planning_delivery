<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logistik - WhatsApp Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; transition: 0.3s; }
        
        /* LANDING PAGE STYLE */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #075E54 0%, #128C7E 100%);
            color: white;
        }
        .menu-container { display: flex; gap: 30px; margin-top: 40px; }
        .box-menu {
            background: white;
            color: #333;
            width: 250px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .box-menu:hover { transform: translateY(-10px); background: #25D366; color: white; }
        .box-menu i { font-size: 3.5rem; margin-bottom: 20px; }

        /* DASHBOARD VIEW STYLE */
        .view-section { display: none; padding: 0; min-height: 100vh; background: white; }
        .nav-top { background: #212529; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .content-area { padding: 30px; }
        
        /* TABLE & BUTTONS */
        .table { border-radius: 10px; overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .table thead { background-color: #25D366; color: white; }
        .btn-kirim { background-color: #25D366; color: white; border-radius: 20px; font-weight: bold; border: none; padding: 5px 15px; }
        .btn-kirim:hover { background-color: #128C7E; color: white; }
        .status-proses { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="fw-bold">LOGISTIK DASHBOARD</h1>
        <p class="opacity-75">Silakan pilih menu operasional hari ini</p>
        <div class="menu-container">
            <div class="box-menu" onclick="bukaMenu('planning')">
                <i class="fas fa-calendar-check"></i>
                <h4>PLANNING</h4>
            </div>
            <div class="box-menu" onclick="bukaMenu('konfirmasi')">
                <i class="fab fa-whatsapp"></i>
                <h4>KONFIRMASI</h4>
            </div>
        </div>
    </div>

    <div id="section-planning" class="view-section">
        <div class="nav-top">
            <span class="fw-bold"><i class="fas fa-calendar-alt me-2"></i> DATA PLANNING</span>
            <button class="btn btn-sm btn-outline-light" onclick="kembaliKeAwal()">KEMBALI KE MENU</button>
        </div>
        <iframe src="planning.html" id="frame-planning" style="width:100%; height: calc(100vh - 65px); border:none;"></iframe>
    </div>

    <div id="section-konfirmasi" class="view-section">
        <div class="nav-top">
            <span class="fw-bold"><i class="fab fa-whatsapp me-2"></i> KIRIM KONFIRMASI WA</span>
            <button class="btn btn-sm btn-outline-light" onclick="kembaliKeAwal()">KEMBALI KE MENU</button>
        </div>
        <div class="content-area">
            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>UNIT/NOPOL</th>
                                <th>SOPIR</th>
                                <th>TUJUAN</th>
                                <th>QTY</th>
                                <th>STATUS</th>
                                <th>NO TELP CUSTOMER</th>
                                <th>AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-wa-proses">
                            </tbody>
                    </table>
                </div>
                <div id="no-data" class="text-center py-5 d-none">
                    <i class="fas fa-info-circle fa-3x text-muted mb-3"></i>
                    <p class="text-muted">Tidak ada data dengan status <b>"PROSES"</b> di planning.html</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Navigasi
        function bukaMenu(menu) {
            document.getElementById('landing-page').style.display = 'none';
            if(menu === 'planning') {
                document.getElementById('section-planning').style.display = 'block';
                // Reload iframe biar datanya segar
                document.getElementById('frame-planning').src = 'planning.html';
            } else {
                document.getElementById('section-konfirmasi').style.display = 'block';
                ambilDataPlanning();
            }
        }

        function kembaliKeAwal() {
            document.getElementById('section-planning').style.display = 'none';
            document.getElementById('section-konfirmasi').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
        }

        // Ambil data dan Filter Status "PROSES"
        async function ambilDataPlanning() {
            const container = document.getElementById('tabel-wa-proses');
            const noData = document.getElementById('no-data');
            container.innerHTML = '<tr><td colspan="7" class="text-center">Membaca Planning...</td></tr>';
            
            try {
                const response = await fetch('planning.html');
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const rows = doc.querySelectorAll('tr');
                
                let foundProses = false;
                let listHtml = '';

                // Mulai dari i=1 (lewati header tabel planning)
                for (let i = 1; i < rows.length; i++) {
                    const cell = rows[i].cells;
                    if (cell.length >= 5) {
                        const status = cell[4].innerText.trim();
                        
                        // HANYA AMBIL YANG STATUSNYA "PROSES"
                        if (status.toUpperCase() === "PROSES") {
                            foundProses = true;
                            const nopol = cell[0].innerText.trim();
                            const sopir = cell[1].innerText.trim();
                            const tujuan = cell[2].innerText.trim();
                            const qty = cell[3].innerText.trim();
                            const idInput = `telp_${i}`;

                            listHtml += `
                                <tr>
                                    <td><strong>${nopol}</strong></td>
                                    <td>${sopir}</td>
                                    <td>${tujuan}</td>
                                    <td><span class="badge bg-dark">${qty}</span></td>
                                    <td><span class="status-proses">${status}</span></td>
                                    <td>
                                        <input type="text" id="${idInput}" class="form-control form-control-sm shadow-sm" placeholder="Contoh: 0812345..." style="width: 160px">
                                    </td>
                                    <td>
                                        <button onclick="kirimWhatsApp('${nopol}', '${sopir}', '${tujuan}', '${qty}', '${idInput}')" class="btn btn-kirim btn-sm">
                                            <i class="fab fa-whatsapp me-1"></i> KIRIM
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }
                    }
                }

                if (foundProses) {
                    container.innerHTML = listHtml;
                    noData.classList.add('d-none');
                } else {
                    container.innerHTML = '';
                    noData.classList.remove('d-none');
                }

            } catch (err) {
                container.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Gagal load data. Pastikan file <b>planning.html</b> ada di folder yang sama.</td></tr>`;
            }
        }

        function kirimWhatsApp(nopol, sopir, tujuan, qty, inputId) {
            const telp = document.getElementById(inputId).value;
            if (!telp) return alert("Bang, nomor telp customer diisi dulu!");

            // Format nomor ke 62
            let nomorClean = telp.replace(/[^0-9]/g, '');
            if (nomorClean.startsWith('0')) {
                nomorClean = '62' + nomorClean.slice(1);
            }

            const pesan = `Halo kak, kami konfirmasi pengiriman hari ini (Status: PROSES):\n\n` +
                          `🚛 *Unit/Nopol:* ${nopol}\n` +
                          `👨🏻‍✈️ *Sopir:* ${sopir}\n` +
                          `📍 *Tujuan:* ${tujuan}\n` +
                          `📦 *Qty:* ${qty}\n\n` +
                          `Pesanan sedang dalam proses. Mohon ditunggu ya kak!`;

            const linkWA = `https://wa.me/${nomorClean}?text=${encodeURIComponent(pesan)}`;
            window.open(linkWA, '_blank');
        }
    </script>
</body>
</html>
