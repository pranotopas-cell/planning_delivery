<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logistik Bang Jago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        
        /* TAMPILAN MENU UTAMA */
        #main-menu {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .menu-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 300px;
            margin: 20px;
        }
        .menu-card:hover { transform: scale(1.1); background: #25D366; color: white; }
        .menu-card i { font-size: 4rem; margin-bottom: 15px; }

        /* TAMPILAN FULL SCREEN */
        .full-screen-view {
            display: none;
            width: 100vw;
            height: 100vh;
            background: white;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            overflow-y: auto;
        }
        .header-back {
            background: #212529;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        /* TABLE STYLE */
        .table-container { padding: 30px; }
        .btn-wa { background: #25D366; color: white; border: none; font-weight: bold; border-radius: 5px; }
        .btn-wa:hover { background: #128C7E; color: white; }
        .badge-proses { background: #ffc107; color: #000; padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="menu-card" onclick="openView('planning')">
            <i class="fas fa-file-invoice"></i>
            <h3>PLANNING</h3>
        </div>
        <div class="menu-card" onclick="openView('konfirmasi')">
            <i class="fab fa-whatsapp"></i>
            <h3>KONFIRMASI WA</h3>
        </div>
    </div>

    <div id="view-planning" class="full-screen-view">
        <div class="header-back">
            <span><h4><i class="fas fa-file-invoice"></i> Data Planning</h4></span>
            <button class="btn btn-outline-light btn-sm" onclick="closeView()">Kembali ke Menu Utama</button>
        </div>
        <iframe src="planning.html" style="width: 100%; height: calc(100vh - 70px); border: none;"></iframe>
    </div>

    <div id="view-konfirmasi" class="full-screen-view">
        <div class="header-back">
            <span><h4><i class="fab fa-whatsapp"></i> Konfirmasi WA (Status: PROSES)</h4></span>
            <button class="btn btn-outline-light btn-sm" onclick="closeView()">Kembali ke Menu Utama</button>
        </div>
        <div class="table-container">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>NOPOL</th>
                        <th>NAMA SOPIR</th>
                        <th>TUJUAN</th>
                        <th>QTY</th>
                        <th>STATUS</th>
                        <th>NO. TELP CUSTOMER</th>
                        <th>AKSI</th>
                    </tr>
                </thead>
                <tbody id="list-konfirmasi">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fungsi Buka View Full Screen
        function openView(type) {
            document.getElementById('main-menu').style.display = 'none';
            if (type === 'planning') {
                document.getElementById('view-planning').style.display = 'block';
            } else {
                document.getElementById('view-konfirmasi').style.display = 'block';
                ambilDataProses();
            }
        }

        // Fungsi Tutup (Kembali ke Menu Awal)
        function closeView() {
            document.getElementById('view-planning').style.display = 'none';
            document.getElementById('view-konfirmasi').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }

        // Ambil data dari planning.html yang statusnya "PROSES"
        async function ambilDataProses() {
            const tableBody = document.getElementById('list-konfirmasi');
            tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Sedang memproses data...</td></tr>';

            try {
                const response = await fetch('planning.html');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const rows = doc.querySelectorAll('tr');

                let listHtml = '';
                let count = 0;

                for (let i = 1; i < rows.length; i++) {
                    const cells = rows[i].cells;
                    if (cells.length >= 5) {
                        const status = cells[4].innerText.trim().toUpperCase();

                        // FILTER HANYA STATUS "PROSES"
                        if (status === "PROSES") {
                            count++;
                            const nopol = cells[0].innerText.trim();
                            const sopir = cells[1].innerText.trim();
                            const tujuan = cells[2].innerText.trim();
                            const qty = cells[3].innerText.trim();

                            listHtml += `
                                <tr>
                                    <td><b>${nopol}</b></td>
                                    <td>${sopir}</td>
                                    <td>${tujuan}</td>
                                    <td><span class="badge bg-primary">${qty}</span></td>
                                    <td><span class="badge-proses">${status}</span></td>
                                    <td>
                                        <input type="text" id="telp_${i}" class="form-control form-control-sm" placeholder="0812xxxx" style="width: 150px;">
                                    </td>
                                    <td>
                                        <button onclick="gasWA('${nopol}','${sopir}','${tujuan}','${qty}','telp_${i}')" class="btn btn-wa btn-sm px-3">
                                            KIRIM WA
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }
                    }
                }

                if (count === 0) {
                    tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Tidak ada data dengan status <b>PROSES</b> hari ini.</td></tr>';
                } else {
                    tableBody.innerHTML = listHtml;
                }

            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Gagal mengambil file planning.html. Pastikan file ada di folder yang sama.</td></tr>';
            }
        }

        // Fungsi Kirim WhatsApp
        function gasWA(nopol, sopir, tujuan, qty, inputId) {
            const noHp = document.getElementById(inputId).value;
            if (!noHp) return alert("Nomor Telp Belum Diisi!");

            let formattedHp = noHp.replace(/[^0-9]/g, '');
            if (formattedHp.startsWith('0')) formattedHp = '62' + formattedHp.slice(1);

            const pesan = `Halo kak, kami informasikan status pengiriman hari ini sedang dalam *PROSES*:\n\n` +
                          `🚛 *Unit:* ${nopol}\n` +
                          `👨🏻‍✈️ *Sopir:* ${sopir}\n` +
                          `📍 *Tujuan:* ${tujuan}\n` +
                          `📦 *Qty:* ${qty}\n\n` +
                          `Mohon standby di lokasi ya. Terima kasih.`;

            window.open(`https://wa.me/${formattedHp}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
