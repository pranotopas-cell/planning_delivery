<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logistik Supabase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        #landing-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 100%); color: white; }
        .box-menu { background: white; color: #333; width: 260px; padding: 40px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .box-menu:hover { transform: translateY(-10px); background: #25D366; color: white; }
        .view-section { display: none; min-height: 100vh; background: white; }
        .nav-header { background: #212529; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .btn-wa { background: #25D366; color: white; border: none; font-weight: bold; padding: 8px 15px; border-radius: 8px; }
        .status-proses { background: #007bff; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="mb-4">LOGISTIK SUPABASE DASHBOARD</h1>
        <div class="d-flex gap-4">
            <div class="box-menu" onclick="bukaMenu('planning')">
                <i class="fas fa-table fa-3x mb-3 text-primary"></i>
                <h4>PLANNING</h4>
            </div>
            <div class="box-menu" onclick="bukaMenu('konfirmasi')">
                <i class="fab fa-whatsapp fa-3x mb-3 text-success"></i>
                <h4>KONFIRMASI</h4>
            </div>
        </div>
    </div>

    <div id="section-planning" class="view-section">
        <div class="nav-header">
            <span><i class="fas fa-file-alt"></i> DATA PLANNING</span>
            <button class="btn btn-sm btn-danger" onclick="home()">KEMBALI</button>
        </div>
        <iframe src="planning.html" style="width: 100%; height: calc(100vh - 65px); border: none;"></iframe>
    </div>

    <div id="section-konfirmasi" class="view-section">
        <div class="nav-header">
            <span><i class="fab fa-whatsapp"></i> KONFIRMASI WA (LIVE SUPABASE)</span>
            <button class="btn btn-sm btn-danger" onclick="home()">KEMBALI</button>
        </div>
        <div class="p-4">
            <div class="card shadow-sm border-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>NOPOL</th>
                                <th>SOPIR</th>
                                <th>TUJUAN</th>
                                <th>QTY</th>
                                <th>STATUS</th>
                                <th>NO TELP CUSTOMER</th>
                                <th>AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-supabase">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // KONEKSI SUPABASE
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function bukaMenu(id) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('section-' + id).style.display = 'block';
            if(id === 'konfirmasi') ambilDataSupabase();
        }

        function home() {
            document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
            document.getElementById('landing-page').style.display = 'flex';
        }

        async function ambilDataSupabase() {
            const tbody = document.getElementById('tabel-supabase');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5">Menghubungkan ke Database...</td></tr>';

            // AMBIL DATA DARI TABEL (Ganti 'planning' dengan nama tabel Abang di Supabase)
            const { data, error } = await _supabase
                .from('planning') 
                .select('*')
                .eq('status', 'PROSES'); // Filter otomatis status PROSES

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error: ${error.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center p-5">Tidak ada data dengan status PROSES.</td></tr>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                html += `
                    <tr>
                        <td><b>${item.nopol || '-'}</b></td>
                        <td>${item.sopir || '-'}</td>
                        <td>${item.tujuan || '-'}</td>
                        <td><span class="badge bg-secondary">${item.qty || '0'}</span></td>
                        <td><span class="status-proses">PROSES</span></td>
                        <td>
                            <input type="text" id="telp_${index}" class="form-control form-control-sm" placeholder="08..." style="width:160px">
                        </td>
                        <td>
                            <button class="btn-wa btn-sm" onclick="kirimWA('${item.nopol}','${item.sopir}','${item.tujuan}','${item.qty}','telp_${index}')">
                                <i class="fab fa-whatsapp"></i> KIRIM
                            </button>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }

        function kirimWA(nopol, sopir, tujuan, qty, inputId) {
            const hp = document.getElementById(inputId).value;
            if (!hp) return alert("Nomor WA belum diisi!");

            let cleanHp = hp.replace(/[^0-9]/g, '');
            if (cleanHp.startsWith('0')) cleanHp = '62' + cleanHp.slice(1);

            const pesan = `Halo kak, konfirmasi pengiriman status *PROSES*:\n\n🚛 *Unit:* ${nopol}\n👨🏻‍✈️ *Sopir:* ${sopir}\n📍 *Tujuan:* ${tujuan}\n📦 *Qty:* ${qty}\n\nMohon ditunggu ya!`;
            window.open(`https://wa.me/${cleanHp}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
