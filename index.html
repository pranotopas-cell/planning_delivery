<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistik Dashboard Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --wa-green: #25D366; --wa-dark: #075E54; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        
        /* LANDING PAGE */
        #landing-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, var(--wa-dark) 0%, #128C7E 100%); color: white; }
        .box-menu { background: white; color: #333; width: 260px; padding: 40px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border:none; }
        .box-menu:hover { transform: translateY(-10px); background: var(--wa-green); color: white; }
        
        /* SECTIONS */
        .view-section { display: none; min-height: 100vh; background: white; }
        .nav-header { background: #212529; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        
        /* TABLE & UI */
        .table { border-radius: 12px; overflow: hidden; }
        .status-badge { background: #007bff; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .btn-wa { background-color: var(--wa-green); color: white; border: none; padding: 8px 16px; border-radius: 50px; font-weight: bold; transition: 0.3s; font-size: 0.85rem; }
        .btn-wa:hover { background-color: #128C7E; transform: scale(1.05); color: white; }
        
        /* INPUTS */
        .input-group-sm .form-control, .input-group-sm .form-select { border-radius: 8px; border: 1px solid #ced4da; }
        .sopir-tag { font-size: 0.85rem; color: #555; display: block; }
        .sopir-telp { font-size: 0.75rem; color: var(--wa-green); font-weight: bold; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="mb-4 text-center fw-bold text-uppercase" style="letter-spacing: 2px;">Logistik Dashboard</h1>
        <div class="d-flex gap-4">
            <div class="box-menu" onclick="bukaMenu('planning')">
                <i class="fas fa-file-invoice fa-3x mb-3 text-primary"></i>
                <h4 class="fw-bold">PLANNING</h4>
            </div>
            <div class="box-menu" onclick="bukaMenu('konfirmasi')">
                <i class="fab fa-whatsapp fa-3x mb-3 text-success"></i>
                <h4 class="fw-bold">KONFIRMASI</h4>
            </div>
        </div>
    </div>

    <div id="section-planning" class="view-section">
        <div class="nav-header shadow-sm">
            <h5 class="m-0 fw-bold"><i class="fas fa-table me-2"></i> DATA PLANNING</h5>
            <button class="btn btn-sm btn-danger px-3 rounded-pill" onclick="home()">KEMBALI</button>
        </div>
        <iframe src="planning.html" style="width:100%; height:calc(100vh - 55px); border:none;"></iframe>
    </div>

    <div id="section-konfirmasi" class="view-section">
        <div class="nav-header shadow-sm">
            <h5 class="m-0 fw-bold"><i class="fab fa-whatsapp me-2"></i> KONFIRMASI PENGIRIMAN</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary px-3 rounded-pill" onclick="ambilData()"><i class="fas fa-sync-alt me-1"></i> REFRESH</button>
                <button class="btn btn-sm btn-danger px-3 rounded-pill" onclick="home()">KEMBALI</button>
            </div>
        </div>
        <div class="p-4">
            <div class="card shadow-sm border-0" style="border-radius: 15px;">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">UNIT / NOPOL</th>
                                <th>TRANSPORTIR</th>
                                <th>SOPIR</th>
                                <th>TUJUAN</th>
                                <th>QTY</th>
                                <th>STATUS</th>
                                <th style="width: 220px;">NO TELP CUSTOMER</th>
                                <th class="text-center">AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-supabase"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        const NAMA_TABEL = 'data_pengiriman'; 

        const databaseSopir = {
            "WIYANTO": "087765543",
            "AGUS": "08123456789"
        };

        function bukaMenu(id) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('section-' + id).style.display = 'block';
            if(id === 'konfirmasi') ambilData();
        }

        function home() { location.reload(); }

        async function ambilData() {
            const tbody = document.getElementById('tabel-supabase');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center p-5"><div class="spinner-border text-success"></div><br><span class="mt-2 d-block text-muted">Sinkronisasi Data QTY...</span></td></tr>';

            const { data, error } = await _supabase
                .from(NAMA_TABEL)
                .select('*')
                .ilike('status', '%PROSES%');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger p-5">Gagal memuat: ${error.message}</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((row, index) => {
                const namaSopir = (row.sopir || row.Sopir || row.driver || '').toUpperCase();
                const telpSopir = databaseSopir[namaSopir] || '-';
                
                // --- UPDATE MAPPING SESUAI PERMINTAAN ---
                const nopol = row.nopol || row.Nopol || row.unit || '-';
                const tujuan = row.tujuan || row.Tujuan || row.lokasi || '-';
                const qty = row.jumlah_keluar || row.qty || '0'; // Prioritas ambil dari jumlah_keluar
                const transportirAwal = row.transportir || row.Transportir || 'PILIH TRANSPORTIR';

                html += `
                    <tr>
                        <td class="ps-4"><b>${nopol}</b></td>
                        <td>
                            <select class="form-select form-select-sm" style="width: 180px; font-size: 0.75rem;">
                                <option value="${transportirAwal}" selected>${transportirAwal}</option>
                                <option value="PT.KHATULISTIWA SINAR ENERGI">PT.KHATULISTIWA SINAR ENERGI</option>
                                <option value="PT.INVESTAMA KALIMANTAN ENERGI">PT.INVESTAMA KALIMANTAN ENERGI</option>
                                <option value="PT.INDO DHARMA ENERGI">PT.INDO DHARMA ENERGI</option>
                                <option value="PT.BERKAH SARANA MAKMUR BERSAMA">PT.BERKAH SARANA MAKMUR BERSAMA</option>
                                <option value="PT.TELADAN BERKAH SEJAHTERA">PT.TELADAN BERKAH SEJAHTERA</option>
                            </select>
                        </td>
                        <td>
                            <span class="sopir-tag fw-bold">${namaSopir}</span>
                            <span class="sopir-telp"><i class="fas fa-phone-alt" style="font-size:10px"></i> ${telpSopir}</span>
                        </td>
                        <td><span class="fw-bold text-dark">${tujuan}</span></td>
                        <td><span class="badge bg-warning text-dark border fw-bold" style="font-size: 0.85rem;">${qty}</span></td>
                        <td><span class="status-badge">PROSES</span></td>
                        <td>
                            <input type="text" id="telp_${index}" class="form-control form-control-sm" placeholder="Input No. Telp..." list="list_cust">
                            <datalist id="list_cust">
                                <option value="08123456789">Customer A</option>
                                <option value="08771234567">Customer B</option>
                            </datalist>
                        </td>
                        <td class="text-center">
                            <button onclick="kirimWA('${nopol}', '${namaSopir}', '${tujuan}', '${qty}', 'telp_${index}')" class="btn-wa">
                                <i class="fab fa-whatsapp me-1"></i> KIRIM WA
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html || '<tr><td colspan="8" class="text-center p-5 text-muted">Tidak ada data status PROSES.</td></tr>';
        }

        function kirimWA(nopol, sopir, tujuan, qty, inputId) {
            const hp = document.getElementById(inputId).value;
            if (!hp) return alert("Bang, isi nomor customer dulu!");

            let num = hp.replace(/[^0-9]/g, '');
            if (num.startsWith('0')) num = '62' + num.slice(1);

            const teks = `Halo kak, kami konfirmasikan pengiriman hari ini (Status: PROSES):\n\n` +
                         `🚛 *Unit:* ${nopol}\n` +
                         `👨🏻‍✈️ *Sopir:* ${sopir}\n` +
                         `📍 *Tujuan:* ${tujuan}\n` +
                         `📦 *Qty:* ${qty}\n\n` +
                         `Pesanan sedang dalam perjalanan. Mohon standby di lokasi ya!`;
            
            window.open(`https://wa.me/${num}?text=${encodeURIComponent(teks)}`, '_blank');
        }
    </script>
</body>
</html>
