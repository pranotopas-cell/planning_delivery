<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Konfirmasi WA - Logistik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        #landing-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 100%); color: white; }
        .box-menu { background: white; color: #333; width: 260px; padding: 40px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .box-menu:hover { transform: translateY(-10px); background: #25D366; color: white; }
        .nav-header { background: #212529; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .view-section { display: none; min-height: 100vh; }
        .status-proses { background: #007bff; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.75rem; }
        .btn-wa { background: #25D366; color: white; border: none; font-weight: bold; padding: 8px 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="mb-4">LOGISTIK DASHBOARD</h1>
        <div class="d-flex gap-4">
            <div class="box-menu" onclick="bukaMenu('planning')">
                <i class="fas fa-table fa-3x mb-3 text-primary"></i>
                <h4>PLANNING</h4>
            </div>
            <div class="box-menu" onclick="bukaMenu('konfirmasi')">
                <i class="fab fa-whatsapp fa-3x mb-3 text-success"></i>
                <h4>KONFIRMASI</h4>
            </div>
        </div>
    </div>

    <div id="section-planning" class="view-section">
        <div class="nav-header">
            <span><i class="fas fa-file-alt me-2"></i> DATA PLANNING ASLI</span>
            <button class="btn btn-sm btn-danger" onclick="home()">KEMBALI</button>
        </div>
        <iframe src="planning.html" style="width: 100%; height: calc(100vh - 65px); border: none;"></iframe>
    </div>

    <div id="section-konfirmasi" class="view-section">
        <div class="nav-header">
            <span><i class="fab fa-whatsapp me-2"></i> KIRIM WA (STATUS: PROSES)</span>
            <button class="btn btn-sm btn-danger" onclick="home()">KEMBALI</button>
        </div>
        <div class="p-4">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>NOPOL</th>
                                <th>SOPIR</th>
                                <th>TUJUAN</th>
                                <th>QTY</th>
                                <th>STATUS</th>
                                <th>NO TELP</th>
                                <th>AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-data">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <iframe id="loader-frame" src="planning.html" style="display:none;" onload="prosesData()"></iframe>

    <script>
        function bukaMenu(id) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('section-' + id).style.display = 'block';
            if(id === 'konfirmasi') prosesData();
        }

        function home() { location.reload(); }

        function prosesData() {
            const frame = document.getElementById('loader-frame');
            const tbody = document.getElementById('tabel-data');
            
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                const rows = doc.querySelectorAll('tr');
                let html = '';

                rows.forEach((row, i) => {
                    const cells = row.cells;
                    
                    // Berdasarkan Screenshot:
                    // Biasanya kolom status ada di sebelah kanan
                    // Kita cari cell yang punya teks "PROSES"
                    let statusCell = Array.from(cells).find(c => c.innerText.includes('PROSES'));

                    if (statusCell) {
                        // Ambil data berdasarkan posisi relatif dari tombol PROSES di screenshot
                        // Catatan: Indeks cell mungkin perlu sedikit penyesuaian tergantung jumlah kolom kosong
                        const nopolSopirCell = cells[cells.length - 3]; // Kolom Kendaraan
                        const qtyCell = cells[cells.length - 2];         // Kolom Qty
                        const tujuanCell = cells[cells.length - 4];      // Kolom Tujuan

                        const nopol = nopolSopirCell ? nopolSopirCell.innerText.split('\n')[0].trim() : '-';
                        const sopir = nopolSopirCell ? nopolSopirCell.innerText.split('\n')[1].trim() : '-';
                        const tujuan = tujuanCell ? tujuanCell.innerText.trim() : '-';
                        const qty = qtyCell ? qtyCell.innerText.trim() : '-';

                        html += `
                            <tr>
                                <td><b>${nopol}</b></td>
                                <td>${sopir}</td>
                                <td>${tujuan}</td>
                                <td><span class="badge bg-secondary">${qty}</span></td>
                                <td><span class="status-proses">PROSES</span></td>
                                <td><input type="text" id="hp_${i}" class="form-control form-control-sm" placeholder="08..." style="width:140px"></td>
                                <td>
                                    <button class="btn-wa btn-sm" onclick="kirimWA('${nopol}','${sopir}','${tujuan}','${qty}','hp_${i}')">
                                        <i class="fab fa-whatsapp"></i> KIRIM
                                    </button>
                                </td>
                            </tr>`;
                    }
                });

                tbody.innerHTML = html || '<tr><td colspan="7" class="text-center p-4">Tidak ada data PROSES ditemukan</td></tr>';
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger p-4">Gagal akses planning.html. Pastikan file satu folder.</td></tr>';
            }
        }

        function kirimWA(nopol, sopir, tujuan, qty, idInput) {
            const hp = document.getElementById(idInput).value;
            if(!hp) return alert("Isi nomor HP!");
            
            let cleanHp = hp.replace(/[^0-9]/g, '');
            if(cleanHp.startsWith('0')) cleanHp = '62' + cleanHp.slice(1);

            const pesan = `Halo kak, pengiriman Anda dalam status *PROSES*:\n\n🚛 *Unit:* ${nopol}\n👨🏻‍✈️ *Sopir:* ${sopir}\n📍 *Tujuan:* ${tujuan}\n📦 *Qty:* ${qty}\n\nMohon ditunggu ya!`;
            window.open(`https://wa.me/${cleanHp}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
