<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Logistik - Konfirmasi WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        #landing-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #075E54 0%, #128C7E 100%); color: white; }
        .box-menu { background: white; color: #333; width: 280px; padding: 40px; border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .box-menu:hover { transform: translateY(-10px); background: #25D366; color: white; }
        .box-menu i { font-size: 3.5rem; margin-bottom: 20px; }
        
        .view-section { display: none; min-height: 100vh; }
        .nav-header { background: #212529; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .table-area { padding: 30px; }
        .status-proses { background: #fff3cd; color: #856404; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; border: 1px solid #ffeeba; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 6px 15px; border-radius: 8px; font-weight: bold; }
        .btn-wa:hover { background: #128C7E; color: white; }
    </style>
</head>
<body>

    <div id="landing-page">
        <h1 class="mb-4">DASHBOARD PENGIRIMAN</h1>
        <div class="d-flex gap-4">
            <div class="box-menu" onclick="showSection('planning')">
                <i class="fas fa-list-alt text-primary"></i>
                <h4>PLANNING</h4>
            </div>
            <div class="box-menu" onclick="showSection('konfirmasi')">
                <i class="fab fa-whatsapp text-success"></i>
                <h4>KONFIRMASI</h4>
            </div>
        </div>
    </div>

    <div id="section-planning" class="view-section">
        <div class="nav-header">
            <span><i class="fas fa-file-alt"></i> DATA PLANNING ASLI</span>
            <button class="btn btn-sm btn-outline-light" onclick="goHome()">KEMBALI</button>
        </div>
        <iframe id="frame-planning" src="planning.html" style="width: 100%; height: calc(100vh - 60px); border: none;"></iframe>
    </div>

    <div id="section-konfirmasi" class="view-section">
        <div class="nav-header">
            <span><i class="fab fa-whatsapp"></i> KONFIRMASI WA (STATUS: PROSES)</span>
            <button class="btn btn-sm btn-outline-light" onclick="goHome()">KEMBALI</button>
        </div>
        <div class="table-area">
            <div class="card shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>NOPOL</th>
                                <th>SOPIR</th>
                                <th>TUJUAN</th>
                                <th>QTY</th>
                                <th>STATUS</th>
                                <th>NO TELP</th>
                                <th>AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-proses">
                            </tbody>
                    </table>
                </div>
                <div id="loader" class="text-center py-5">
                    <div class="spinner-border text-success mb-2"></div>
                    <p>Mencari data status PROSES...</p>
                </div>
                <div id="pesan-kosong" class="text-center py-5 d-none">
                    <h5>Tidak ada data dengan status <b>PROSES</b>.</h5>
                </div>
            </div>
        </div>
    </div>

    <iframe id="data-loader" src="planning.html" style="display:none;" onload="ekstrakData()"></iframe>

    <script>
        function showSection(id) {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('section-' + id).style.display = 'block';
            if(id === 'konfirmasi') ekstrakData();
        }

        function goHome() {
            location.reload(); // Refresh untuk reset tampilan
        }

        function ekstrakData() {
            const iframe = document.getElementById('data-loader');
            const tbody = document.getElementById('tabel-proses');
            const loader = document.getElementById('loader');
            const pesanKosong = document.getElementById('pesan-kosong');

            try {
                // Ambil dokumen di dalam iframe
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const rows = doc.querySelectorAll('tr');
                let htmlData = '';
                let adaProses = false;

                rows.forEach((row, index) => {
                    const cells = row.cells;
                    if (cells.length >= 5) {
                        const status = cells[4].innerText.trim().toUpperCase();

                        // Filter hanya yang mengandung kata PROSES
                        if (status.includes("PROSES")) {
                            adaProses = true;
                            const nopol = cells[0].innerText.trim();
                            const sopir = cells[1].innerText.trim();
                            const tujuan = cells[2].innerText.trim();
                            const qty = cells[3].innerText.trim();

                            htmlData += `
                                <tr>
                                    <td><b>${nopol}</b></td>
                                    <td>${sopir}</td>
                                    <td>${tujuan}</td>
                                    <td>${qty}</td>
                                    <td><span class="status-proses">${status}</span></td>
                                    <td><input type="text" id="telp_${index}" class="form-control form-control-sm" placeholder="0812..." style="width:150px"></td>
                                    <td>
                                        <button class="btn-wa btn-sm" onclick="kirimWA('${nopol}','${sopir}','${tujuan}','${qty}','telp_${index}')">
                                            <i class="fab fa-whatsapp"></i> KIRIM
                                        </button>
                                    </td>
                                </tr>`;
                        }
                    }
                });

                loader.classList.add('d-none');
                if (adaProses) {
                    tbody.innerHTML = htmlData;
                    pesanKosong.classList.add('d-none');
                } else {
                    tbody.innerHTML = '';
                    pesanKosong.classList.remove('d-none');
                }
            } catch (e) {
                console.error("Gagal baca iframe:", e);
                // Jika masih gagal karena CORS, pesan muncul
                loader.innerHTML = "<p class='text-danger'>Izin akses file ditolak browser. <br> Coba buka lewat folder dan pastikan nama filenya <b>planning.html</b></p>";
            }
        }

        function kirimWA(nopol, sopir, tujuan, qty, inputId) {
            const telp = document.getElementById(inputId).value;
            if (!telp) return alert("Masukkan nomor telp!");

            let cleanTelp = telp.replace(/[^0-9]/g, '');
            if (cleanTelp.startsWith('0')) cleanTelp = '62' + cleanTelp.slice(1);

            const pesan = `Halo kak, pengiriman Anda statusnya saat ini *PROSES*:\n\n` +
                          `🚛 Nopol: ${nopol}\n👨🏻‍✈️ Sopir: ${sopir}\n📍 Tujuan: ${tujuan}\n📦 Qty: ${qty}\n\nMohon ditunggu!`;

            window.open(`https://wa.me/${cleanTelp}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
