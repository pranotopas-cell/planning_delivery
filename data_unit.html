<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Masa Berlaku Unit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
        }

        /* --- CONTAINER & HEADER --- */
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 4px;
            font-size: 20px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 12px;
        }

        /* --- NAV BUTTONS --- */
        .top-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-home {
            background-color: #95a5a6;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
        }
        .btn-home:hover {
            background-color: #7f8c8d;
        }
        .btn-save {
            background-color: #2ecc71;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        .btn-save:hover {
            background-color: #27ae60;
        }

        /* --- TABLE STYLES --- */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12px;
            table-layout: fixed;
        }
        th {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 8px 6px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 4px 5px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        tr:hover {
            background-color: #f8fafc;
        }

        /* --- INPUT STYLES --- */
        .cell-inline-wrapper {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 4px;
        }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 4px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            color: #475569;
            outline: none;
            height: 28px;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        /* --- STORAGE ACTION BUTTONS --- */
        .mini-file-actions {
            display: flex;
            gap: 2px;
        }
        .btn-mini-file {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            font-size: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
            cursor: pointer;
            background-color: #f8fafc;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-mini-file:hover {
            background-color: #e2e8f0;
        }
        .btn-mini-upload { background-color: #f1f5f9; }
        .btn-mini-change { background-color: #fef3c7; border-color: #f59e0b; }
        .btn-mini-view { background-color: #e0f2fe; border-color: #38bdf8; }

        /* --- FOOTER BUTTONS --- */
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .btn-add {
            background-color: #e67e22;
            color: white;
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-add:hover {
            background-color: #d35400;
        }
        .btn-cek {
            background-color: #3498db;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }
        .btn-cek:hover {
            background-color: #2980b9;
        }

        /* --- VALIDATION STATUS --- */
        .status-danger {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
            font-weight: bold;
        }
        .status-success {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <div>
            <h2>MONITORING LEGALITAS UNIT</h2>
            <p class="subtitle">Sistem otomatis mendeteksi batas waktu dokumen kritis (≤ 15 Hari) dengan Cloud Storage.</p>
        </div>
        <div class="top-buttons">
            <a href="index.html" class="btn-home">🏠Home</a>
            <button class="btn-save" onclick="simpanKeSupabase()">💾Save</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="tabelUnit">
            <thead>
                <tr>
                    <th style="width: 12%;">Nopol</th>
                    <th style="width: 12%;">Sopir</th>
                    <th style="width: 15%;">No SIM</th>
                    <th style="width: 15%;">Masa Berlaku KIR</th>
                    <th style="width: 15%;">Masa Pajak STNK</th>
                    <th style="width: 15%;">Masa Surat Tera</th>
                    <th style="width: 16%;">Masa Berlaku KPS</th>
                </tr>
            </thead>
            <tbody id="bodyTabel">
            </tbody>
        </table>
    </div>

    <div class="bottom-actions">
        <button class="btn-add" onclick="tambahBaris()">➕ Tambah Baris Unit</button>
        <button class="btn-cek" onclick="periksaMasaBerlaku()">Periksa Sisa Masa Berlaku</button>
    </div>
</div>

<script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
    let _supabase = null;
    const BUCKET_NAME = 'dokumen_unit';

    window.onload = function() {
        try {
            const supabaseTarget = window.supabase || (window.supabaseJS ? window.supabaseJS : null);
            if (supabaseTarget) {
                _supabase = supabaseTarget.createClient(SUPABASE_URL, SUPABASE_KEY);
                muatDataDariSupabase();
            } else {
                console.error("Library Supabase gagal dimuat dari CDN.");
                tambahBaris();
            }
        } catch (e) {
            console.error("Gagal melakukan inisialisasi klien Supabase:", e);
            tambahBaris();
        }
    };

    // --- MENARIK DATA DARI SUPABASE ---
    async function muatDataDariSupabase() {
        if (!_supabase) return;
        try {
            const { data, error } = await _supabase
                .from('unit_data')
                .select('*')
                .order('nopol', { ascending: true });

            if (error) throw error;

            const tbody = document.getElementById('bodyTabel');
            tbody.innerHTML = ""; 

            if (data && data.length > 0) {
                data.forEach(unit => {
                    tambahBarisDenganData(unit);
                });
            } else {
                tambahBaris();
            }
        } catch (err) {
            console.error("Detail Error Tarik Data:", err);
            alert("❌ Gagal memuat data dari Supabase.");
            if(document.getElementById('bodyTabel').children.length === 0) {
                tambahBaris();
            }
        }
    }

    function tambahBaris() {
        tambahBarisDenganData({
            nopol: '', sopir: '', no_sim: '', 
            masa_kir: '', masa_stnk: '', masa_tera: '', masa_kps: '',
            url_sim: '', url_kir: '', url_stnk: '', url_tera: '', url_kps: ''
        });
    }

    // --- MEMBUAT BARIS DENGAN DATA ---
    function tambahBarisDenganData(unit) {
        const tbody = document.getElementById('bodyTabel');
        const barisBaru = document.createElement('tr');
        
        const bersihkanTanggal = (tgl) => {
            if (!tgl) return '';
            return tgl.split(' ')[0].substring(0, 10);
        };

        const pasangTombolMini = (jenis, urlField) => {
            const urlAda = !!urlField;
            return `
                <div class="mini-file-actions" data-url="${urlField || ''}">
                    ${urlAda ? `
                        <a href="${urlField}" target="_blank" class="btn-mini-file btn-mini-view" title="Lihat Berkas">👁️</a>
                        <button type="button" class="btn-mini-file btn-mini-change" title="Ganti File" onclick="pemicuPilihFile(this)">🔄</button>
                    ` : `
                        <button type="button" class="btn-mini-file btn-mini-upload" title="Upload File" onclick="pemicuPilihFile(this)">📤</button>
                    `}
                    <input type="file" accept="image/jpeg,image/jpg,application/pdf" style="display:none;" onchange="prosesUploadFile(this, '${jenis}')">
                </div>
            `;
        };
        
        barisBaru.innerHTML = `
            <td><input type="text" class="nopol" placeholder="B 1234 ABC" value="${unit.nopol || ''}"></td>
            <td><input type="text" class="sopir" placeholder="Nama Sopir" value="${unit.sopir || ''}"></td>
            <td>
                <div class="cell-inline-wrapper">
                    <input type="text" class="no-sim" placeholder="No. SIM" value="${unit.no_sim || ''}">
                    ${pasangTombolMini('sim', unit.url_sim)}
                </div>
            </td>
            <td>
                <div class="cell-inline-wrapper">
                    <input type="date" class="tgl-cek masa-kir" value="${bersihkanTanggal(unit.masa_kir)}">
                    ${pasangTombolMini('kir', unit.url_kir)}
                </div>
            </td>
            <td>
                <div class="cell-inline-wrapper">
                    <input type="date" class="tgl-cek masa-stnk" value="${bersihkanTanggal(unit.masa_stnk)}">
                    ${pasangTombolMini('stnk', unit.url_stnk)}
                </div>
            </td>
            <td>
                <div class="cell-inline-wrapper">
                    <input type="date" class="tgl-cek masa-tera" value="${bersihkanTanggal(unit.masa_tera)}">
                    ${pasangTombolMini('tera', unit.url_tera)}
                </div>
            </td>
            <td>
                <div class="cell-inline-wrapper">
                    <input type="date" class="tgl-cek masa-kps" value="${bersihkanTanggal(unit.masa_kps)}">
                    ${pasangTombolMini('kps', unit.url_kps)}
                </div>
            </td>
        `;
        
        tbody.appendChild(barisBaru);
    }

    function pemicuPilihFile(tombol) {
        tombol.parentElement.querySelector('input[type="file"]').click();
    }

    // --- PROSES UPLOAD FILE KE STORAGE BUCKET ---
    async function prosesUploadFile(inputElement, jenisDokumen) {
        if (!_supabase) return alert("Database belum terkoneksi!");
        
        const file = inputElement.files[0];
        if (!file) return;

        const tipeValid = ['image/jpeg', 'image/jpg', 'application/pdf'];
        if (!tipeValid.includes(file.type)) {
            alert("Format berkas salah! Hanya menerima JPG atau PDF.");
            inputElement.value = '';
            return;
        }

        const baris = inputElement.closest('tr');
        const nopol = baris.querySelector('.nopol').value.trim();

        if (!nopol) {
            alert("Isi kolom Nopol unit terlebih dahulu sebelum unggah berkas!");
            inputElement.value = '';
            return;
        }

        const wadahAksi = inputElement.parentElement;
        const tombolAktif = wadahAksi.querySelector('button');
        
        if(tombolAktif) {
            tombolAktif.innerText = "⏳";
            tombolAktif.disabled = true;
        }

        const ekstensi = file.name.split('.').pop();
        const namaFileBersih = nopol.replace(/\s+/g, '_');
        const pathFile = `${namaFileBersih}_${jenisDokumen}_${Date.now()}.${ekstensi}`;

        try {
            const { data, error } = await _supabase.storage
                .from(BUCKET_NAME)
                .upload(pathFile, file, { cacheControl: '3600', upsert: true });

            if (error) throw error;

            const { data: publicUrlData } = _supabase.storage
                .from(BUCKET_NAME)
                .getPublicUrl(pathFile);

            const urlDokumen = publicUrlData.publicUrl;
            wadahAksi.setAttribute('data-url', urlDokumen);
            
            wadahAksi.innerHTML = `
                <a href="${urlDokumen}" target="_blank" class="btn-mini-file btn-mini-view" title="Lihat Berkas">👁️</a>
                <button type="button" class="btn-mini-file btn-mini-change" title="Ganti File" onclick="pemicuPilihFile(this)">🔄</button>
                <input type="file" accept="image/jpeg,image/jpg,application/pdf" style="display:none;" onchange="prosesUploadFile(this, '${jenisDokumen}')">
            `;

            alert(`🎉 Berhasil upload berkas ${jenisDokumen.toUpperCase()}! Klik 'Save' agar tersimpan di database.`);

        } catch (err) {
            console.error(err);
            alert("❌ Gagal mengirim file berkas.");
            muatDataDariSupabase();
        }
    }

    // --- CEK MASA BERLAKU ---
    function periksaMasaBerlaku() {
        const hariIni = new Date();
        hariIni.setHours(0,0,0,0);
        
        const inputsTanggal = document.querySelectorAll('.tgl-cek');
        let adaPeringatan = false;
        let pesanPeringatan = "🚨 PERINGATAN MASA BERLAKU (≤ 15 HARI):\n====================================\n\n";

        inputsTanggal.forEach(input => {
            if (!input.value) return; 

            const tanggalTarget = new Date(input.value);
            tanggalTarget.setHours(0,0,0,0);
            
            const selisihWaktu = tanggalTarget - hariIni;
            const selisihHari = Math.ceil(selisihWaktu / (1000 * 60 * 60 * 24));

            const baris = input.closest('tr');
            const nopol = baris.querySelector('.nopol').value.trim() || "Nopol Kosong";
            
            const indeksKolom = input.closest('td').cellIndex;
            const namaKolom = baris.closest('table').querySelectorAll('th')[indeksKolom].innerText;

            input.classList.remove('status-danger', 'status-success');

            if (selisihHari <= 15) {
                input.classList.add('status-danger');
                adaPeringatan = true;

                if (selisihHari < 0) {
                    pesanPeringatan += `🔴 Unit [${nopol}] ➔ MASA ${namaKolom} TELAH HABIS (${Math.abs(selisihHari)} hari yang lalu)\n\n`;
                } else if (selisihHari === 0) {
                    pesanPeringatan += `🔴 Unit [${nopol}] ➔ MASA ${namaKolom} HABIS HARI INI!\n\n`;
                } else {
                    pesanPeringatan += `⚠️ Unit [${nopol}] ➔ MASA ${namaKolom} KURANG ${selisihHari} HARI LAGI!\n\n`;
                }
            } else {
                input.classList.add('status-success');
            }
        });

        if (adaPeringatan) {
            alert(pesanPeringatan);
        } else {
            alert("✅ Aman jaya, Bang! Tidak ada dokumen unit yang kritis/habis dalam waktu 15 hari ke depan.");
        }
    }

    // --- FUNGSI SIMPAN KE SUPABASE (SUDAH DIPERBAIKI SANGAT AKURAT) ---
    async function simpanKeSupabase() {
        if (!_supabase) {
            alert("Koneksi ke database belum siap, silakan muat ulang halaman.");
            return;
        }

        const barisTabel = document.querySelectorAll('#bodyTabel tr');
        let dataSapiens = [];

        barisTabel.forEach(baris => {
            const nopol = baris.querySelector('.nopol').value.trim();
            const sopir = baris.querySelector('.sopir').value.trim();
            const noSim = baris.querySelector('.no-sim').value.trim();
            const masaKir = baris.querySelector('.masa-kir').value;
            const masaStnk = baris.querySelector('.masa-stnk').value;
            const masaTera = baris.querySelector('.masa-tera').value;
            const masaKps = baris.querySelector('.masa-kps').value;

            // Perbaikan pencarian data-url: langsung temukan class mini-file-actions di elemen pembungkus input terkait
            const dapatkanUrl = (inputSelector) => {
                const inputElement = baris.querySelector(inputSelector);
                if (!inputElement) return null;
                const tdAsal = inputElement.closest('td');
                const wadahAksi = tdAsal.querySelector('.mini-file-actions');
                return wadahAksi ? (wadahAksi.getAttribute('data-url') || null) : null;
            };

            const urlSim = dapatkanUrl('.no-sim');
            const urlKir = dapatkanUrl('.masa-kir');
            const urlStnk = dapatkanUrl('.masa-stnk');
            const urlTera = dapatkanUrl('.masa-tera');
            const urlKps = dapatkanUrl('.masa-kps');

            if (nopol) {
                dataSapiens.push({
                    nopol: nopol,
                    sopir: sopir ? sopir : null,
                    no_sim: noSim ? noSim : null,
                    masa_kir: masaKir ? masaKir : null,
                    masa_stnk: masaStnk ? masaStnk : null,
                    masa_tera: masaTera ? masaTera : null,
                    masa_kps: masaKps ? masaKps : null,
                    url_sim: urlSim,
                    url_kir: urlKir,
                    url_stnk: urlStnk,
                    url_tera: urlTera,
                    url_kps: urlKps
                });
            }
        });

        if (dataSapiens.length === 0) {
            alert("Mohon isi minimal kolom Nopol sebelum menyimpan data.");
            return;
        }

        try {
            // Proses Upsert ke tabel Supabase
            const { data, error } = await _supabase
                .from('unit_data')
                .upsert(dataSapiens, { onConflict: 'nopol' });

            if (error) throw error;

            alert("🚀 Sukses! Data & berkas berhasil diperbarui ke Supabase.");
            await muatDataDariSupabase();
            
        } catch (err) {
            console.error("Detail Error Simpan Data:", err);
            // Menampilkan pesan error spesifik dari Postgres Supabase agar mudah didebug
            alert(`❌ Gagal menyimpan data ke Supabase.\nPesan: ${err.message || err.details}`);
        }
    }
</script>
</body>
</html>
