<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Masa Berlaku Unit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
        }

        /* --- CONTAINER & HEADER --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 25px;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        /* --- NAV BUTTONS (RIGHT TOP) --- */
        .top-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-home {
            background-color: #95a5a6;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
        }
        .btn-home:hover {
            background-color: #7f8c8d;
        }
        .btn-save {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 4px rgba(46, 204, 113, 0.2);
        }
        .btn-save:hover {
            background-color: #27ae60;
        }

        /* --- TABLE STYLES --- */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 14px 12px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        tr:hover {
            background-color: #f8fafc;
        }

        /* --- INPUT STYLES --- */
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            color: #475569;
            transition: all 0.3s ease;
            outline: none;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        /* --- FOOTER UTILITY BUTTONS --- */
        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .btn-add {
            background-color: #e67e22;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #d35400;
        }
        .btn-cek {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease;
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }
        .btn-cek:hover {
            background-color: #2980b9;
        }

        /* --- VALIDATION STATUS STYLES --- */
        .status-danger {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
            font-weight: bold;
        }
        .status-success {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <div>
            <h2>MONITORING LEGALITAS UNIT </h2>
            <p class="subtitle">Sistem otomatis mendeteksi batas waktu dokumen kritis (≤ 15 Hari).</p>
        </div>
        <div class="top-buttons">
            <a href="index.html" class="btn-home">🏠Home</a>
            <button class="btn-save" onclick="simpanKeSupabase()">💾Save</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="tabelUnit">
            <thead>
                <tr>
                    <th style="width: 14%;">Nopol</th>
                    <th style="width: 14%;">Sopir</th>
                    <th style="width: 14%;">No SIM</th>
                    <th>Masa Berlaku KIR</th>
                    <th>Masa Pajak STNK</th>
                    <th>Masa Surat Tera</th>
                    <th>Masa Berlaku KPS</th>
                </tr>
            </thead>
            <tbody id="bodyTabel">
            </tbody>
        </table>
    </div>

    <div class="bottom-actions">
        <button class="btn-add" onclick="tambahBaris()">➕ Tambah Baris Unit</button>
        <button class="btn-cek" onclick="periksaMasaBerlaku()">Periksa Sisa Masa Berlaku</button>
    </div>
</div>

<script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
    let _supabase = null;

    // Perbaikan inisialisasi: Menggunakan global target supabaseJS bawaan CDN v2 secara aman
    window.onload = function() {
        try {
            const supabaseTarget = window.supabase || (window.supabaseJS ? window.supabaseJS : null);
            if (supabaseTarget) {
                _supabase = supabaseTarget.createClient(SUPABASE_URL, SUPABASE_KEY);
                muatDataDariSupabase();
            } else {
                console.error("Library Supabase gagal dimuat dari CDN.");
                tambahBaris();
            }
        } catch (e) {
            console.error("Gagal melakukan inisialisasi klien Supabase:", e);
            tambahBaris();
        }
    };

    // --- FUNGSI UTAMA: MENARIK DATA DARI SUPABASE ---
    async function muatDataDariSupabase() {
        if (!_supabase) return;
        
        try {
            const { data, error } = await _supabase
                .from('unit_data')
                .select('*')
                .order('nopol', { ascending: true });

            if (error) throw error;

            console.log("Data mentah dari Supabase:", data);

            const tbody = document.getElementById('bodyTabel');
            tbody.innerHTML = ""; 

            if (data && data.length > 0) {
                data.forEach(unit => {
                    tambahBarisDenganData(unit);
                });
            } else {
                tambahBaris();
            }
        } catch (err) {
            console.error("Detail Error Tarik Data:", err);
            alert("❌ Gagal memuat data dari Supabase.");
            if(document.getElementById('bodyTabel').children.length === 0) {
                tambahBaris();
            }
        }
    }

    // --- FUNGSI TAMBAH BARIS KOSONG ---
    function tambahBaris() {
        tambahBarisDenganData({
            nopol: '', sopir: '', no_sim: '', 
            masa_kir: '', masa_stnk: '', masa_tera: '', masa_kps: ''
        });
    }

    // --- FUNGSI BANTUAN: MEMBUAT BARIS DENGAN DATA ---
    function tambahBarisDenganData(unit) {
        const tbody = document.getElementById('bodyTabel');
        const barisBaru = document.createElement('tr');
        
        // Memotong jam/menit jika field di database bertipe timestamp
        const bersihkanTanggal = (tgl) => {
            if (!tgl) return '';
            return tgl.split(' ')[0].substring(0, 10);
        };
        
        barisBaru.innerHTML = `
            <td><input type="text" class="nopol" placeholder="B 1234 ABC" value="${unit.nopol || ''}"></td>
            <td><input type="text" class="sopir" placeholder="Nama Sopir" value="${unit.sopir || ''}"></td>
            <td><input type="text" class="no-sim" placeholder="No. SIM" value="${unit.no_sim || ''}"></td>
            <td><input type="date" class="tgl-cek masa-kir" value="${bersihkanTanggal(unit.masa_kir)}"></td>
            <td><input type="date" class="tgl-cek masa-stnk" value="${bersihkanTanggal(unit.masa_stnk)}"></td>
            <td><input type="date" class="tgl-cek masa-tera" value="${bersihkanTanggal(unit.masa_tera)}"></td>
            <td><input type="date" class="tgl-cek masa-kps" value="${bersihkanTanggal(unit.masa_kps)}"></td>
        `;
        
        tbody.appendChild(barisBaru);
    }

    // --- FUNGSI CEK MASA BERLAKU ---
    function periksaMasaBerlaku() {
        const hariIni = new Date();
        hariIni.setHours(0,0,0,0);
        
        const inputsTanggal = document.querySelectorAll('.tgl-cek');
        let adaPeringatan = false;
        let pesanPeringatan = "🚨 PERINGATAN MASA BERLAKU (≤ 15 HARI):\n====================================\n\n";

        inputsTanggal.forEach(input => {
            if (!input.value) return; 

            const tanggalTarget = new Date(input.value);
            tanggalTarget.setHours(0,0,0,0);
            
            const selisihWaktu = tanggalTarget - hariIni;
            const selisihHari = Math.ceil(selisihWaktu / (1000 * 60 * 60 * 24));

            const baris = input.closest('tr');
            const nopol = baris.querySelector('.nopol').value.trim() || "Nopol Kosong";
            const indeksKolom = input.parentElement.cellIndex;
            const namaKolom = baris.closest('table').querySelectorAll('th')[indeksKolom].innerText;

            input.classList.remove('status-danger', 'status-success');

            if (selisihHari <= 15) {
                input.classList.add('status-danger');
                adaPeringatan = true;

                if (selisihHari < 0) {
                    pesanPeringatan += `🔴 Unit [${nopol}] ➔ MASA ${namaKolom} TELAH HABIS (${Math.abs(selisihHari)} hari yang lalu)\n\n`;
                } else if (selisihHari === 0) {
                    pesanPeringatan += `🔴 Unit [${nopol}] ➔ MASA ${namaKolom} HABIS HARI INI!\n\n`;
                } else {
                    pesanPeringatan += `⚠️ Unit [${nopol}] ➔ MASA ${namaKolom} KURANG ${selisihHari} HARI LAGI!\n\n`;
                }
            } else {
                input.classList.add('status-success');
            }
        });

        if (adaPeringatan) {
            alert(pesanPeringatan);
        } else {
            alert("✅ Aman jaya, Bang! Tidak ada dokumen unit yang kritis/habis dalam waktu 15 hari ke depan.");
        }
    }

    // --- FUNGSI SIMPAN KE SUPABASE ---
    async function simpanKeSupabase() {
        if (!_supabase) {
            alert("Koneksi ke database belum siap, silakan muat ulang halaman.");
            return;
        }

        const barisTabel = document.querySelectorAll('#bodyTabel tr');
        let dataSapiens = [];

        barisTabel.forEach(baris => {
            const nopol = baris.querySelector('.nopol').value.trim();
            const sopir = baris.querySelector('.sopir').value.trim();
            const noSim = baris.querySelector('.no-sim').value.trim();
            const masaKir = baris.querySelector('.masa-kir').value;
            const masaStnk = baris.querySelector('.masa-stnk').value;
            const masaTera = baris.querySelector('.masa-tera').value;
            const masaKps = baris.querySelector('.masa-kps').value;

            if (nopol) {
                dataSapiens.push({
                    nopol: nopol,
                    sopir: sopir ? sopir : null,
                    no_sim: noSim ? noSim : null,
                    masa_kir: masaKir ? masaKir : null,
                    masa_stnk: masaStnk ? masaStnk : null,
                    masa_tera: masaTera ? masaTera : null,
                    masa_kps: masaKps ? masaKps : null
                });
            }
        });

        if (dataSapiens.length === 0) {
            alert("Mohon isi minimal kolom Nopol sebelum menyimpan data.");
            return;
        }

        try {
            const { data, error } = await _supabase
                .from('unit_data')
                .upsert(dataSapiens, { onConflict: 'nopol' });

            if (error) throw error;

            alert("🚀 Sukses! Data berhasil diperbarui ke Supabase.");
            await muatDataDariSupabase();
            
        } catch (err) {
            console.error("Detail Error Simpan Data:", err);
            alert("❌ Gagal menyimpan data ke Supabase.");
        }
    }
</script>
</body>
</html>
