    <script type="module">

    // 2. CONFIG FIREBASE FIRESTORE
    const firebaseConfig = {

        authDomain: "ikaen-tracking.firebaseapp.com",
        projectId: "ikaen-tracking",
        storageBucket: "ikaen-tracking.firebasestorage.app",
        messagingSenderId: "390072449388",
        appId: "1:390072449388:web:78b880e0abd8793b69db49"
    };

    const app = initializeApp(firebaseConfig);

    // CACHE MASTER UNIT (NOPOL -> NO RANGKA)
    let masterUnitCache = {};

    // FUNGSI MEMATANGCAN CACHE MASTER UNIT TERHUBUNG NOPOL & NO RANGKA
    async function fetchMasterUnits() {
        try {
            const snap = await getDocs(collection(dbFirestore, "master_unit"));
            snap.forEach((doc) => {
                const data = doc.data();
                const nopolKey = (data.nopol || doc.id || "").toString().trim().replace(/\s+/g, '').toUpperCase();
                const noRangka = data.no_rangka || data.norangka || data.vin || data.rangka || '-';
                if (nopolKey) {
                    masterUnitCache[nopolKey] = noRangka;
                }
            });
        } catch (e) {
            console.error("Gagal sinkronisasi master_unit: ", e);
        }
    }

    // LISTENER SINKRONISASI REALTIME MASTER UNIT
    function listenMasterUnits() {
        onSnapshot(collection(dbFirestore, "master_unit"), (snapshot) => {
            snapshot.forEach((doc) => {
                const data = doc.data();
                const nopolKey = (data.nopol || doc.id || "").toString().trim().replace(/\s+/g, '').toUpperCase();
                const noRangka = data.no_rangka || data.norangka || data.vin || data.rangka || '-';
                if (nopolKey) {
                    masterUnitCache[nopolKey] = noRangka;
                }
            });
        });
    }

    // SETUP MAPS UTAMA
    const savedLat = localStorage.getItem('map_lat') || -2.5489;
    const savedLon = localStorage.getItem('map_lon') || 118.0149;
    const savedZoom = localStorage.getItem('map_zoom') || 5;

    const map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false,
        rotate: true, 
        touchRotate: true, 
        shiftKeyRotate: true,
        bearing: 0 
    }).setView([savedLat, savedLon], savedZoom);

    const centerControl = map._controlCorners;
    centerControl.topcenter = L.DomUtil.create('div', 'leaflet-top leaflet-center', map._controlContainer);
    new L.Control.Zoom({ position: 'topcenter' }).addTo(map);

    const baseLayers = {
        'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
        'satelit': L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'),
        'terrain': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png')
    };
    
    baseLayers.osm.addTo(map);

    window.changeLayer = function(type) {
        Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
        if (baseLayers[type]) baseLayers[type].addTo(map);
    }

    map.on('moveend zoomend rotateend', () => {
        const center = map.getCenter();
        localStorage.setItem('map_lat', center.lat);
        localStorage.setItem('map_lon', center.lng);
        localStorage.setItem('map_zoom', map.getZoom());
    });

    let markers = { units: {}, pois: {} };
    let routeLayer = null; 
    let userMarker = null;
    let searchMarker = null;

    let watchPositionId = null;

    // FUNGSI TEXT-TO-SPEECH SUARA BAHASA INDONESIA
    function speakIndonesian(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Stop suara sebelumnya jika ada
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.95; // Kecepatan suara natural
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const idVoice = voices.find(voice => voice.lang.includes('id') || voice.lang.includes('ID'));
            if (idVoice) utterance.voice = idVoice;

            window.speechSynthesis.speak(utterance);
        }
    }

    // Preload Voices untuk browser desktop & mobile
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    }

    const poiIcons = {
        black: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
        blue: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
        red: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',

    window.locateUser = function() {
        if (!navigator.geolocation) return alert("GPS tidak didukung");
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude, lon = pos.coords.longitude;
            userCoords = [lat, lon];
            if (userMarker) userMarker.setLatLng(userCoords);
            else {
                userMarker = L.marker(userCoords, { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png', iconSize: [25, 41], iconAnchor: [12, 41] }) }).addTo(map);
            }
            map.flyTo(userCoords, 15);
        }, () => alert("Aktifkan GPS HP Anda"));
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const lat1Rad = lat1 * Math.PI / 180;
        const lat2Rad = lat2 * Math.PI / 180;
        const y = Math.sin(dLon) * Math.cos(lat2Rad);
        const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
        const brng = Math.atan2(y, x) * 180 / Math.PI;
        return (brng + 360) % 360;
    }

    // HELPER FORMAT TANGGAL DAN JAM LENGKAP WIB
    function formatDateTimeWIB(rawField) {
        if (!rawField) return "-";
        const dateObj = rawField.toDate ? rawField.toDate() : new Date(rawField);
        if (isNaN(dateObj.getTime())) return "-";
        
        const timeStr = dateObj.toLocaleTimeString('id-ID', {
            timeZone: 'Asia/Jakarta',
            hour: '2-digit',
            minute: '2-digit'
        });

        const dateStr = dateObj.toLocaleDateString('id-ID', {
            timeZone: 'Asia/Jakarta',
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });

        return `${timeStr} WIB, ${dateStr}`;
    }

    function initTrackingRealtime() {
        const q = query(collection(dbFirestore, "tracking_unit"), where("status", "==", "ON_JOB"));
        
        onSnapshot(q, (snapshot) => {
            const selectUnit = document.getElementById('select-unit');
            const currentVal = selectUnit.value;
            
            selectUnit.innerHTML = '<option value="">Cari Unit...</option>';
            const activeNopols = [];

            snapshot.forEach((doc) => {
                const u = doc.data();
                const sopir = doc.id; 
                const nopol = u.nopol || sopir;
                activeNopols.push(nopol);

                const lat = parseFloat(u.lat);
                const lon = parseFloat(u.lon);
                if (isNaN(lat) || isNaN(lon)) return;

                // Update Option Dropdown
                const opt = document.createElement('option');
                opt.value = `${lat},${lon}`;
                opt.textContent = `${nopol} - ${sopir}`;
                selectUnit.appendChild(opt);

                // 1. FORMAT WAKTU LAST GPS (WIB & TANGGAL)
                const waktuWIB = formatDateTimeWIB(u.last_update || u.updated_at || u.timestamp);

                // 2. FORMAT WAKTU ON JOB (WIB & TANGGAL)
                const waktuOnJobWIB = formatDateTimeWIB(u.jam_on_job || u.start_job || u.login_active || u.on_job_at);

                // 3. LOGIKA OTOMATIS CARI NO RANGKA BERDASARKAN NOPOL DARI MASTER UNIT
                const cleanNopolKey = nopol.toString().trim().replace(/\s+/g, '').toUpperCase();
                let noRangka = u.no_rangka || u.norangka || u.vin || masterUnitCache[cleanNopolKey] || '-';

                // POPUP DESIGN DENGAN DAFTAR NOPOL, NO RANGKA OTOMATIS, JAM DAN TANGGAL ON JOB
                const popupContent = `
                    <div style="font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #2c3e50; min-width: 195px; padding: 3px;">
                        <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f2f6; padding-bottom: 5px; margin-bottom: 6px;">
                            <span style="font-size: 13px; font-weight: 800; color: #1e90ff; letter-spacing: 0.5px;">🚚 ${nopol}</span>
                            <span style="font-size: 9px; background-color: #2ecc71; color: white; padding: 2px 6px; border-radius: 10px; font-weight: bold; transform: scale(0.95);">ON JOB</span>
                        </div>
                        <div style="font-size: 11px; line-height: 1.5; margin-bottom: 6px;">
                            <div style="margin-bottom: 2px;"><span style="color: #7f8c8d;">Sopir:</span> <strong style="color: #2c3e50;">${sopir}</strong></div>
                            <div style="margin-bottom: 2px;"><span style="color: #7f8c8d;">No. Rangka:</span> <strong style="color: #e67e22;">${noRangka}</strong></div>
                            <div><span style="color: #7f8c8d;">Tujuan:</span> <strong style="color: #2c3e50;">${u.tujuan || '-'}</strong></div>
                        </div>
                        <div style="border-top: 1px dashed #e8ecf1; padding-top: 6px; margin-top: 4px; display: flex; flex-direction: column; gap: 3px;">
                            <div style="font-size: 9px; display: flex; justify-content: space-between;">
                                <span style="color: #95a5a6;">Last GPS:</span>
                                <span style="font-weight: 600; color: #e74c3c;">${waktuWIB}</span>
                            </div>
                            <div style="font-size: 9px; display: flex; justify-content: space-between;">
                                <span style="color: #95a5a6;">Jam ON Job:</span>
                                <span style="font-weight: 600; color: #2ecc71;">${waktuOnJobWIB}</span>
                            </div>
                        </div>
                    </div>
                `;

                if (markers.units[nopol]) {
                    // UPDATE MARKER EXIST
                    const currentLatLng = markers.units[nopol].getLatLng();
                    
                    let bearing = u.bearing || 0;
                    if (currentLatLng.lat !== lat || currentLatLng.lng !== lon) {
                        bearing = calculateBearing(currentLatLng.lat, currentLatLng.lng, lat, lon);
                    }

                    if (typeof markers.units[nopol].slideTo === "function") {
                        markers.units[nopol].slideTo([lat, lon], {
                            duration: 2000,
                            keepAtCenter: false
                        });
                    } else {
                        markers.units[nopol].setLatLng([lat, lon]);
                    }

                    requestAnimationFrame(() => {
                        const markerElement = markers.units[nopol].getElement();
                        if (markerElement) {
                            const svgElement = markerElement.querySelector('svg');
                            if (svgElement) {
                                svgElement.style.transform = `rotate(${bearing}deg)`;
                            }
                        }
                    });
                    
                    markers.units[nopol].getPopup().setContent(popupContent);
                } else {
                    // INI MARKER BARU
                    const initialIcon = L.divIcon({
                        html: `
                            <div class="truck-icon-container" style="width:32px; height:32px; display:flex; justify-content:center; align-items:center;">
                                <svg viewBox="0 0 24 24" style="width:100%; height:100%; fill:#1e90ff; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3)); transform: rotate(${u.bearing || 0}deg); transition: transform 0.4s ease-out;">
                                    <path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/>
                                </svg>
                            </div>
                        `,
                        className: '',
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    markers.units[nopol] = L.marker([lat, lon], { icon: initialIcon })
                        .addTo(map)
                        .bindPopup(popupContent, { 
                            offset: [0, -8],
                            closeButton: false,
                            maxWidth: 240,
                            minWidth: 195
                        });

                    markers.units[nopol].on('mouseover', function (e) {
                        this.openPopup();
                    });
                }
            });

            // Hapus unit yang tidak lagi status ON_JOB
            Object.keys(markers.units).forEach(nopol => {
                if (!activeNopols.includes(nopol)) {
                    map.removeLayer(markers.units[nopol]);
                    delete markers.units[nopol];
                }
            });

            selectUnit.value = currentVal;
        }, (error) => {
            console.error("Firebase error tracking: ", error);
        });
    }

    async function loadPOIs() {
        const { data, error } = await _supabase.from('poi_lokasi').select('*');
        if (error) return;
        const list = document.getElementById('poi-list');
        const selectNav = document.getElementById('select-dest');
        const selectDist = document.getElementById('select-dist-poi');
        
        Object.keys(markers.pois).forEach(id => { map.removeLayer(markers.pois[id]); });
        markers.pois = {};

        list.innerHTML = ""; 
        selectNav.innerHTML = '<option value="">Pilih Tujuan...</option>';
        selectDist.innerHTML = '<option value="">Pilih Lokasi POI...</option>';
        
        data?.forEach(p => {
            const div = document.createElement('div');
            div.style = "padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; cursor:pointer;";
            div.innerHTML = `
                <span onclick="focusLoc(${p.lat}, ${p.lon})" style="flex:1; font-weight:500;">📍 ${p.nama}</span>
                <button class="btn-delete-poi" onclick="deletePOI(${p.id}, event)"><i class="fa-solid fa-trash"></i></button>
            `;
            list.appendChild(div);

            const opt = document.createElement('option');
            opt.value = `${p.lat},${p.lon}`; 
            opt.dataset.nama = p.nama;
            opt.textContent = p.nama;
            selectNav.appendChild(opt.cloneNode(true));
            selectDist.appendChild(opt);

            markers.pois[p.id] = L.marker([p.lat, p.lon], { 
                icon: L.icon({ 
                    iconUrl: poiIcons[p.simbol] || poiIcons.black, 
                    iconSize: [18, 28], 
                    iconAnchor: [9, 28] 
                }) 
            })
            .addTo(map)
            .bindTooltip(p.nama, { 
                className: 'poi-label', 
                direction: 'top', 
                offset: [0, -28], 
                permanent: true, 
                opacity: 1 
            });
        });
    }

    window.deletePOI = async function(id, event) {
        event.stopPropagation();
        if (confirm("Apakah Anda yakin ingin menghapus lokasi ini?")) {
            const { error } = await _supabase.from('poi_lokasi').delete().eq('id', id);
            if (error) { alert("Gagal menghapus lokasi"); } else { loadPOIs(); }
        }
    }

    window.searchLocation = async function() {
        const queryStr = document.getElementById('search-input').value;
        if (!queryStr) return alert("Masukkan kata kunci pencarian!");
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryStr)}&limit=1`);
            const data = await response.json();
            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                const displayName = data[0].display_name;
                
                if (searchMarker) {
                    searchMarker.setLatLng([lat, lon]).setPopupContent(displayName);
                } else {
                    searchMarker = L.marker([lat, lon], {
                        icon: L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41]
                        })
                    }).addTo(map).bindPopup(displayName);
                }
                map.flyTo([lat, lon], 14);
                searchMarker.openPopup();
                toggleRightMenu();
            } else {
                alert("Tempat tidak ditemukan, coba kata kunci lain.");
            }
        } catch (err) {
            console.error(err);
            alert("Gagal melakukan pencarian tempat");
        }
    }

    window.calculateRoadDistance = async function(coords) {
        const resDiv = document.getElementById('dist-res');
        if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
        if (!coords) { resDiv.innerHTML = "Jarak: -<br>Waktu: -"; return; }
        if (!userCoords) {
            alert("Aktifkan posisi GPS Anda terlebih dahulu!");
            document.getElementById('select-dist-poi').value = "";
            return;
        }
        const [poiLat, poiLon] = coords.split(',');
        const [userLat, userLon] = userCoords;
        resDiv.innerText = "Menghitung...";
        try {
            const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${poiLon},${poiLat}?overview=full&geometries=geojson`;
            const response = await fetch(url);
            const result = await response.json();
            if (result.code === 'Ok') {
                const data = result.routes[0];
                const roadDistance = (data.distance / 1000).toFixed(2); 
                const durationSec = data.duration * 1.3;
                const hours = Math.floor(durationSec / 3600);
                const minutes = Math.floor((durationSec % 3600) / 60);
                let timeStr = hours > 0 ? `${hours} jam ${minutes} mnt` : `${minutes} mnt`;
                resDiv.innerHTML = `Jarak: ${roadDistance} KM<br>Waktu: ±${timeStr}`;
                routeLayer = L.geoJSON(data.geometry, {
                    style: { color: '#3498db', weight: 5, opacity: 0.7 }
                }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
            } else { resDiv.innerText = "Rute tidak ditemukan"; }
        } catch (err) {
            console.error(err);
            resDiv.innerText = "Gagal memuat rute";
        }
    }

    window.focusUnit = function(coords) { if (coords) { const c = coords.split(','); map.flyTo([c[0], c[1]], 16); toggleRightMenu(); } }
    window.focusLoc = function(lat, lon) { map.flyTo([lat, lon], 16); togglePOI(); }
    window.fitAllUnits = function() { const all = Object.values(markers.units); if (all.length) map.fitBounds(L.featureGroup(all).getBounds(), {padding:[20,20]}); }
    
    // SISTEM NAVIGASI SMART & AUTO-REROUTE IN-APP DENGAN PANDUAN SUARA BAHASA INDONESIA
    window.openNav = function() {
        const selectElem = document.getElementById('select-dest');
        const coords = selectElem.value;
        if (!coords) return alert("Pilih tujuan!");
        if (!userCoords) return alert("Aktifkan posisi GPS Anda terlebih dahulu!");

        const selectedOption = selectElem.options[selectElem.selectedIndex];
        const destName = selectedOption.dataset.nama || selectedOption.text || 'tujuan Anda';

        const [destLat, destLon] = coords.split(',').map(Number);

        // Bersihkan navigasi & pemantau GPS lama jika aktif
        if (routingControl) map.removeControl(routingControl);
        if (watchPositionId) navigator.geolocation.clearWatch(watchPositionId);

        // Suara Bahasa Indonesia Memulai Navigasi
        speakIndonesian(`Navigasi dimulai. Memandu rute menuju ${destName}. Hati-hati di jalan.`);

        // Inisialisasi Leaflet Routing Machine
        routingControl = L.Routing.control({
            waypoints: [
                L.latLng(userCoords[0], userCoords[1]),
                L.latLng(destLat, destLon)
            ],
            routeWhileDragging: false,
            autoRoute: true,
            addWaypoints: false,
            draggableWaypoints: false,
            fitSelectedRoutes: true,
            showAlternatives: true,
            lineOptions: {
                styles: [{ color: '#2ecc71', weight: 6, opacity: 0.85 }]
            },
            router: L.Routing.osrmv1({
                serviceUrl: 'https://router.project-osrm.org/route/v1'
            })
        }).addTo(map);

        document.getElementById('btn-stop-nav').style.display = 'flex';
        toggleRightMenu();

        // Fitur Live Tracking GPS + Auto Rerouting
        if (navigator.geolocation) {
            watchPositionId = navigator.geolocation.watchPosition((pos) => {
                const newLat = pos.coords.latitude;
                const newLon = pos.coords.longitude;
                userCoords = [newLat, newLon];

                if (userMarker) userMarker.setLatLng(userCoords);

                // Update posisi asal waypoint secara otomatis (Auto-Reroute bila menyimpang dari rute)
                if (routingControl) {
                    routingControl.spliceWaypoints(0, 1, L.latLng(newLat, newLon));
                }
            }, (err) => console.log("Gagal memantau GPS:", err), {
                enableHighAccuracy: true,
                maximumAge: 3000,
                timeout: 5000
            });
        }
    }

    // FUNGSI MENGHENTIKAN NAVIGASI DENGAN SUARA
    window.stopNav = function() {
        if (routingControl) {
            map.removeControl(routingControl);
            routingControl = null;
        }
        if (watchPositionId) {
            navigator.geolocation.clearWatch(watchPositionId);
            watchPositionId = null;
        }
        document.getElementById('btn-stop-nav').style.display = 'none';
        speakIndonesian("Navigasi dihentikan.");
    }

    window.startAddPOIMode = function() {
        isAddMode = true;
        document.getElementById('poi-btn').classList.add('active-mode');
        togglePOI();
        alert("Modus Tambah Tempat Aktif!\nSilakan sentuh atau klik langsung pada titik peta.");
    }

    map.on('click', async (e) => {
        if (!isAddMode) return;
        const nama = prompt("Masukkan Nama Lokasi Baru:");
        if (nama && nama.trim() !== "") {
            const { error } = await _supabase.from('poi_lokasi').insert([
                { 
                    nama: nama.trim(), 
                    lat: e.latlng.lat, 
                    lon: e.latlng.lng, 
                    simbol: 'black'
                }
            ]);
            
            if (error) {
                console.error("Detail Error Supabase:", error);
                alert("Gagal menyimpan ke database: " + error.message);
            } else {
                alert("Lokasi baru berhasil disimpan!");
                loadPOIs();
            }
        }
        isAddMode = false;
        document.getElementById('poi-btn').classList.remove('active-mode');
    });

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
        }, () => { console.log("Izin lokasi awal ditolak."); });
    }

    // INISIALISASI UTAMA
    async function initApp() {
        await fetchMasterUnits();
        listenMasterUnits();
        loadPOIs(); 
        initTrackingRealtime();
    }

    initApp();
</script>
