<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKING SYSTEM - LIVE MAP</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        .side-menu {
            position: absolute; top: 15px; left: 15px;
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }

        .float-item {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn { width: 45px; height: 45px; font-size: 18px; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #2ecc71; }
        .nav-btn:active { transform: scale(0.9); }
        .active-mode { border: 1px solid #e74c3c; color: #e74c3c; animation: blink-red 1s infinite; }
        @keyframes blink-red { 50% { border-color: transparent; } }

        #poi-panel {
            position: absolute; top: 0; left: 65px;
            width: 250px; background: white; border-radius: 12px;
            padding: 15px; display: none; max-height: 80vh; overflow-y: auto;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); color: #333;
        }
        .poi-item { 
            padding: 10px; border-bottom: 1px solid #eee; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .btn-add-poi { 
            width: 100%; background: #2ecc71; color: white; border: none; 
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px;
        }

        .unit-label { 
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid #2ecc71; 
            border-radius: 4px;
            padding: 2px 6px;
            font-weight: bold; 
            color: #2ecc71; 
            font-size: 12px; 
            white-space: nowrap;
        }

        .leaflet-top.leaflet-left { top: 180px; left: 7px; }
    </style>
</head>
<body>

    <div class="side-menu">
        <button class="float-item nav-btn" onclick="location.reload()" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
        <button class="float-item nav-btn" onclick="fitAllUnits()" title="Lihat Semua Unit"><i class="fa-solid fa-expand"></i></button>
        <button class="float-item nav-btn" onclick="togglePOI()" id="poi-btn" title="Daftar Lokasi"><i class="fa-solid fa-map-location-dot"></i></button>
        
        <div id="poi-panel">
            <button class="btn-add-poi" onclick="startAddPOIMode()"><i class="fa-solid fa-plus"></i> Tambah Lokasi</button>
            <div id="poi-list"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = { units: {}, pois: {} };
        let isAddMode = false;

        async function fetchUnits() {
            // Hanya ambil unit dengan status ON_JOB dari database
            const { data, error } = await _supabase.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            
            if (error) return;

            const activeNopols = data?.map(u => u.nopol) || [];
            
            // Hapus marker yang sudah tidak aktif di database
            Object.keys(markers.units).forEach(nopol => {
                if (!activeNopols.includes(nopol)) {
                    map.removeLayer(markers.units[nopol]);
                    delete markers.units[nopol];
                }
            });

            data?.forEach(u => {
                const lat = parseFloat(u.lat);
                const lon = parseFloat(u.lon);
                
                if (markers.units[u.nopol]) {
                    markers.units[u.nopol].setLatLng([lat, lon]);
                } else {
                    markers.units[u.nopol] = L.marker([lat, lon], {
                        icon: L.icon({ 
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', 
                            iconSize: [25, 41], 
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34]
                        })
                    }).addTo(map).bindPopup(`<b>${u.nopol}</b><br>Sopir: ${u.sopir}<br>Tujuan: ${u.tujuan}`);
                    
                    markers.units[u.nopol].bindTooltip(u.nopol, { 
                        permanent: true, 
                        direction: 'top', 
                        className: 'unit-label', 
                        offset: [0, -40] 
                    });
                }
            });
        }

        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function startAddPOIMode() {
            isAddMode = true;
            document.getElementById('poi-btn').classList.add('active-mode');
            togglePOI();
            alert("MODE TAMBAH LOKASI: Klik pada peta untuk menyimpan titik POI.");
        }

        map.on('click', async function(e) {
            if (!isAddMode) return;
            const nama = prompt("Nama Lokasi:");
            if (nama) {
                const { error } = await _supabase.from('poi_lokasi').insert([{ 
                    nama: nama, lat: e.latlng.lat, lon: e.latlng.lng 
                }]);
                if (!error) {
                    alert("Lokasi Tersimpan!");
                    loadPOIs();
                }
            }
            isAddMode = false;
            document.getElementById('poi-btn').classList.remove('active-mode');
        });

        async function loadPOIs() {
            const { data } = await _supabase.from('poi_lokasi').select('*');
            const list = document.getElementById('poi-list');
            list.innerHTML = "";
            data?.forEach(p => {
                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon], {
                        icon: L.icon({ 
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png', 
                            iconSize: [18, 30],
                            iconAnchor: [9, 30]
                        })
                    }).addTo(map).bindPopup(`<b>${p.nama}</b>`);
                }
                const div = document.createElement('div');
                div.className = 'poi-item';
                div.innerHTML = `
                    <span onclick="focusLoc(${p.lat}, ${p.lon})" style="cursor:pointer">📍 ${p.nama}</span>
                    <i class="fa-solid fa-trash" style="color:#ff5252; cursor:pointer;" onclick="deletePOI(${p.id})"></i>
                `;
                list.appendChild(div);
            });
        }

        async function deletePOI(id) {
            if (!confirm("Hapus lokasi?")) return;
            await _supabase.from('poi_lokasi').delete().eq('id', id);
            if (markers.pois[id]) map.removeLayer(markers.pois[id]);
            loadPOIs();
        }

        function focusLoc(lat, lon) { map.flyTo([lat, lon], 16); togglePOI(); }

        function fitAllUnits() {
            const allMarkers = Object.values(markers.units);
            if (allMarkers.length > 0) {
                const group = new L.featureGroup(allMarkers);
                map.fitBounds(group.getBounds(), { padding: [50, 50] });
            } else {
                alert("Tidak ada unit yang sedang ambil job.");
            }
        }

        loadPOIs();
        fetchUnits();
        setInterval(fetchUnits, 10000);

        _supabase.channel('tracking-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tracking_unit' }, () => {
            fetchUnits();
        })
        .subscribe();
    </script>
</body>
</html>
