<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LOGISTICS DASHBOARD - TRACKING SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0f1d;
            --header-bg: #050811;
            --text-gold: #e5c07b;
            --text-white: #d1d5db;
            --border-color: #1e293b;
            --color-tunggu: #ff5252;
            --color-proses: #66bb6a;
            --color-delivered: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg-main); 
            color: var(--text-white); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        .header {
            background: var(--header-bg); padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--text-gold);
        }

        .main-content { flex: 1; overflow-y: auto; padding-bottom: 50px; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th {
            background: rgba(5, 8, 17, 0.9); color: var(--text-gold);
            padding: 12px 8px; font-size: 11px; text-transform: uppercase;
            position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border-color);
        }

        td { padding: 12px 8px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .nopol-box { 
            background: #e2e8f0; color: #1e293b; padding: 3px 6px; 
            border-radius: 4px; font-weight: 800; font-size: 11px; display: inline-block;
        }

        /* Status & Button Style */
        .st-proses { color: var(--color-proses); font-weight: 900; animation: blink 1.5s infinite; }
        .st-delivered { 
            color: var(--color-delivered); font-weight: 900; 
            white-space: pre-line; font-size: 10px; text-align: right; display: block;
        }
        
        .btn-job {
            padding: 6px 12px; border-radius: 4px; font-size: 10px;
            font-weight: 800; cursor: pointer; border: none; text-transform: uppercase;
        }
        .btn-ambil { background: #2e7d32; color: white; }
        .btn-finish { background: #0288d1; color: white; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .footer {
            position: fixed; bottom: 0; width: 100%; background: #000;
            color: #fff; height: 30px; line-height: 30px; font-size: 11px;
            border-top: 1px solid var(--text-gold);
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; color:var(--text-gold); letter-spacing:1px;">LOGISTICS TRACKING</h2>
            <div id="displayDate" style="font-size:12px;">MEMUAT...</div>
        </div>
        <div style="text-align:right;">
            <div id="clock" style="font-size:18px; font-weight:bold;">00:00:00</div>
            <div style="font-size:10px; color:#66bb6a;">● GPS SERVER CONNECTED</div>
        </div>
    </div>

    <div class="main-content">
        <table>
            <thead>
                <tr>
                    <th style="width: 40%; text-align: left;">UNIT / TUJUAN</th>
                    <th style="width: 15%; text-align: center;">QTY</th>
                    <th style="width: 45%; text-align: right;">STATUS & AKSI</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="footer">
        <marquee>SISTEM MONITORING LOGISTIK REAL-TIME • PASTIKAN GPS AKTIF SAAT MEMULAI TUGAS • DRIVE SAFELY</marquee>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let watchId = null;

        function getWIB() {
            return new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jakarta"}));
        }

        async function loadDashboard() {
            const isoToday = getWIB().toISOString().split('T')[0];
            document.getElementById('displayDate').innerText = getWIB().toLocaleDateString('id-ID', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }).toUpperCase();

            const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', isoToday).order('status', { ascending: true });
            
            if (!error) renderData(data);
        }

        function renderData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const statusRaw = (row.status || "").toUpperCase();
                let statusContent = "";

                if (statusRaw.includes("PROSES")) {
                    statusContent = `
                        <span class="st-proses">PROSES</span>
                        <button class="btn-job btn-finish" onclick="finishJob('${row.nopol}', '${row.id}')">DONE</button>
                    `;
                } else if (statusRaw.includes("DELIVERED")) {
                    statusContent = `<span class="st-delivered">${statusRaw}</span>`;
                } else {
                    statusContent = `
                        <span style="color:#ff5252; font-weight:bold; font-size:10px;">TERJADWAL</span>
                        <button class="btn-job btn-ambil" onclick="takeJob('${row.nopol}', '${row.id}', '${row.sopir}', '${row.delivery_to}')">AMBIL</button>
                    `;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="nopol-box">${row.nopol || '-'}</div> <span style="font-weight:bold;">${row.sopir || ''}</span>
                        <div style="font-size:11px; color:#7fb4ca; margin-top:4px;">KE: ${row.delivery_to || '-'}</div>
                    </td>
                    <td style="text-align:center; font-size:16px; font-weight:bold;">${row.jumlah_keluar || 0}</td>
                    <td style="text-align:right;">${statusContent}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function takeJob(nopol, rowId, sopir, tujuan) {
            if (!confirm(`Mulai perjalanan unit ${nopol}?`)) return;
            
            await _supabase.from('data_pengiriman').update({ status: 'PROSES' }).eq('id', rowId);
            
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition(async (pos) => {
                    await _supabase.from('tracking_unit').upsert({
                        nopol: nopol, lat: pos.coords.latitude, lon: pos.coords.longitude,
                        sopir: sopir, tujuan: tujuan, status: 'ON_JOB', last_update: new Date().toISOString()
                    }, { onConflict: 'nopol' });
                }, null, { enableHighAccuracy: true });
            }
            loadDashboard();
        }

        async function finishJob(nopol, rowId) {
            if (!confirm("Tandai Selesai & Simpan Lokasi?")) return;
            
            if (watchId) navigator.geolocation.clearWatch(watchId);

            // 1. Ambil data terakhir untuk koordinat POI
            const { data: unitData } = await _supabase.from('tracking_unit').select('*').eq('nopol', nopol).single();

            if (unitData) {
                // 2. Simpan lokasi tujuan ke daftar POI permanen
                await _supabase.from('poi_lokasi').insert([{ 
                    nama: unitData.tujuan, lat: unitData.lat, lon: unitData.lon 
                }]);
            }

            // 3. Format Waktu DELIVERED (Hari, Tanggal, Jam)
            const skrg = getWIB();
            const fmtWaktu = skrg.toLocaleDateString('id-ID', { 
                weekday: 'long', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
            }).replace('.', ':');

            // 4. Update data_pengiriman & tracking_unit
            await _supabase.from('data_pengiriman').update({ status: `DELIVERED\n(${fmtWaktu})` }).eq('id', rowId);
            await _supabase.from('tracking_unit').update({ status: 'SUCCESS' }).eq('nopol', nopol);

            alert("Job Berhasil Diselesaikan!");
            loadDashboard();
        }

        setInterval(() => { document.getElementById('clock').innerText = getWIB().toLocaleTimeString('id-ID'); }, 1000);
        loadDashboard();
        _supabase.channel('live').on('postgres_changes', { event: '*', schema: 'public', table: 'data_pengiriman' }, loadDashboard).subscribe();
    </script>
</body>
</html>
