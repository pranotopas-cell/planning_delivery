<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKING SYSTEM - LIVE MAP</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; }
        
        .ui-box { position: absolute; z-index: 1000; background: white; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        
        /* Header Info */
        .info-header { top: 15px; left: 15px; padding: 10px 18px; display: flex; align-items: center; gap: 12px; border-left: 5px solid #3498db; }
        .status-dot { height: 12px; width: 12px; background-color: #3498db; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }
        .working { border-left-color: #2ecc71 !important; }
        .working .status-dot { background-color: #2ecc71; }

        /* Controls */
        .map-controls { top: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { background: white; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 20px; color: #333; transition: 0.3s; }
        .control-btn:hover { background: #f0f0f0; transform: scale(1.05); }

        /* POI Panel */
        #poi-panel { top: 75px; right: 15px; width: 280px; padding: 15px; display: none; max-height: 70vh; overflow-y: auto; }
        .poi-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .poi-item:hover { background: #f9f9f9; }
        .btn-add-poi { width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }

        /* Label Unit */
        .unit-label { background: none; border: none; box-shadow: none; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; font-size: 12px; }
    </style>
</head>
<body>

    <div id="status-box" class="ui-box info-header">
        <span class="status-dot"></span> 
        <span id="status-text" style="font-size: 14px; font-weight: 700; color: #333;">MEMANTAU LALU LINTAS...</span>
    </div>

    <div class="map-controls">
        <a href="jadwal1.html" class="control-btn" title="Buka Jadwal"><i class="fa-solid fa-calendar-list"></i></a>
        <button class="control-btn" onclick="goToHome()" title="Lokasi Saya"><i class="fa-solid fa-location-crosshairs"></i></button>
        <button class="control-btn" onclick="togglePOI()" title="Menu POI"><i class="fa-solid fa-map-location-dot"></i></button>
    </div>

    <div id="poi-panel" class="ui-box">
        <button class="btn-add-poi" onclick="addPOICurrent()"><i class="fa-solid fa-plus"></i> Tandai Lokasi Saya</button>
        <div style="font-size: 12px; font-weight: bold; color: #888; margin: 10px 0;">DAFTAR LOKASI TERSIMPAN:</div>
        <div id="poi-list"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = { units: {}, pois: {} };
        let currentPos = null;
        let myGhostMarker = null;

        // 1. Inisialisasi GPS (Selalu Jalan)
        function initGPS() {
            navigator.geolocation.watchPosition((pos) => {
                currentPos = [pos.coords.latitude, pos.coords.longitude];
                
                // Marker Biru (Lokasi HP ini)
                if (!myGhostMarker) {
                    myGhostMarker = L.circleMarker(currentPos, { radius: 7, color: '#3498db', weight: 3, fillOpacity: 0.8 }).addTo(map);
                } else {
                    myGhostMarker.setLatLng(currentPos);
                }
            }, null, { enableHighAccuracy: true });
        }

        // 2. Render Unit dari Database
        function renderUnit(unit) {
            const icon = L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
            });

            const content = `
                <div style="font-family: sans-serif; font-size: 12px;">
                    <b style="color:#2ecc71;">${unit.nopol}</b><br>
                    <b>Sopir:</b> ${unit.sopir || '-'}<br>
                    <b>Tujuan:</b> ${unit.tujuan || '-'}<br>
                    <hr style="margin:5px 0">
                    <small>Update: ${new Date(unit.last_update).toLocaleTimeString()}</small>
                </div>
            `;

            if (markers.units[unit.nopol]) {
                markers.units[unit.nopol].setLatLng([unit.lat, unit.lon]).setPopupContent(content);
            } else {
                markers.units[unit.nopol] = L.marker([unit.lat, unit.lon], { icon: icon }).addTo(map).bindPopup(content);
                // Label Nopol di atas marker
                markers.units[unit.nopol].bindTooltip(unit.nopol, { permanent: true, direction: 'top', className: 'unit-label', offset: [0, -40] });
            }
        }

        // 3. Load & Realtime Units
        async function fetchLiveUnits() {
            const { data } = await _supabase.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            if (data) {
                data.forEach(u => renderUnit(u));
                // Update status header
                document.getElementById('status-box').classList.add('working');
                document.getElementById('status-text').innerText = "SYSTEM LIVE: " + data.length + " UNIT AKTIF";
            }
        }

        // 4. Manajemen POI (Tanda Lokasi)
        async function addPOICurrent() {
            if (!currentPos) return alert("Menunggu GPS...");
            const nama = prompt("Nama Lokasi (Gudang, Rest Area, dll):");
            if (!nama) return;

            const { error } = await _supabase.from('poi_lokasi').insert([{ 
                nama: nama, lat: currentPos[0], lon: currentPos[1] 
            }]);
            if (!error) loadPOIs();
        }

        async function loadPOIs() {
            const { data } = await _supabase.from('poi_lokasi').select('*');
            const list = document.getElementById('poi-list');
            list.innerHTML = "";
            
            data?.forEach(p => {
                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon], {
                        icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png', iconSize: [20, 32] })
                    }).addTo(map).bindPopup(`<b>${p.nama}</b>`);
                }

                const div = document.createElement('div');
                div.className = 'poi-item';
                div.innerHTML = `
                    <span onclick="focusPOI(${p.lat}, ${p.lon})">📍 ${p.nama}</span>
                    <i class="fa-solid fa-trash" style="color:#e74c3c" onclick="deletePOI(${p.id})"></i>
                `;
                list.appendChild(div);
            });
        }

        async function deletePOI(id) {
            if (!confirm("Hapus tanda ini?")) return;
            await _supabase.from('poi_lokasi').delete().eq('id', id);
            if (markers.pois[id]) map.removeLayer(markers.pois[id]);
            loadPOIs();
        }

        // --- UTILS ---
        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        function focusPOI(lat, lon) { map.flyTo([lat, lon], 16); }
        function goToHome() { if (currentPos) map.flyTo(currentPos, 17); }

        // --- LISTENERS ---
        initGPS();
        loadPOIs();
        fetchLiveUnits();

        // Pantau perubahan database secara realtime
        _supabase.channel('tracking-live')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'tracking_unit' }, () => fetchLiveUnits())
            .subscribe();

        setInterval(fetchLiveUnits, 10000); // Backup sync tiap 10 detik
    </script>
</body>
</html>
