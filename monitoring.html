<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACKING UNIT - ADVANCED SYSTEM</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100%; background: #242f3e; }
        
        /* Floating UI */
        .ui-box { position: absolute; z-index: 1000; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .info-header { top: 15px; left: 55px; padding: 8px 15px; display: flex; align-items: center; gap: 10px; border-left: 5px solid #3498db; }
        
        .map-controls { top: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { background: white; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 18px; }

        /* Panel Bottom */
        .bottom-panel { bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; padding: 15px; }
        
        /* List Styling */
        .list-container { max-height: 200px; overflow-y: auto; margin-top: 10px; font-size: 13px; }
        .item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-small { padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; }
        .btn-green { background: #2ecc71; color: white; }
        .btn-red { background: #e74c3c; color: white; }
        
        /* POI Sidebar */
        #poi-panel { top: 80px; left: 15px; width: 250px; padding: 10px; display: none; }

        .status-dot { height: 10px; width: 10px; background-color: #3498db; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }
        .working { border-left-color: #2ecc71 !important; }
    </style>
</head>
<body>

    <!-- Header Status -->
    <div id="status-box" class="ui-box info-header">
        <span class="status-dot"></span> 
        <span id="conn-text" style="font-size: 13px; font-weight: 600;">Mode Pantau</span>
    </div>

    <!-- Controls -->
    <div class="map-controls">
        <button class="control-btn" onclick="goToHome()" title="Lokasi Saya"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="control-btn" onclick="togglePOI()" title="Daftar POI"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="control-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
    </div>

    <!-- POI Sidebar -->
    <div id="poi-panel" class="ui-box">
        <h4 style="margin: 0 0 10px 0;">📍 Lokasi Ditandai</h4>
        <div id="poi-list" class="list-container">
            <small style="color:#888">Klik di peta untuk tambah tanda</small>
        </div>
    </div>

    <!-- Bottom Job Panel -->
    <div id="job-panel" class="ui-box bottom-panel">
        <div id="job-selector">
            <h4 style="margin:0 0 10px 0;">Pilih Jadwal Pengiriman</h4>
            <div id="list-pengiriman" class="list-container"> Memuat jadwal... </div>
        </div>
        
        <div id="job-active" style="display: none;">
            <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                <div>
                    <b id="active-nopol" style="font-size: 16px;"></b><br>
                    <span id="active-sopir" style="font-size: 14px; color: #555;"></span><br>
                    <small id="active-tujuan" style="color: #2ecc71; font-weight:bold;"></small>
                </div>
                <button class="btn-small btn-red" onclick="stopJob()">Selesai</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map = L.map('map', { zoomControl: false }).setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = { units: {}, pois: {} }; 
        let currentPos = null;
        let activeData = null; // Menyimpan data job yang diambil
        let myGhostMarker = null;

        // --- FUNGSI CORE GPS ---
        function initGPS() {
            navigator.geolocation.watchPosition((pos) => {
                const { latitude, longitude } = pos.coords;
                currentPos = [latitude, longitude];

                if (!activeData) {
                    if (!myGhostMarker) {
                        myGhostMarker = L.circleMarker(currentPos, { radius: 8, color: '#3498db' }).addTo(map);
                    } else { myGhostMarker.setLatLng(currentPos); }
                } else {
                    if (myGhostMarker) { map.removeLayer(myGhostMarker); myGhostMarker = null; }
                    updateLocationInDB(latitude, longitude);
                    renderUnitMarker({ ...activeData, lat: latitude, lon: longitude });
                }
            }, null, { enableHighAccuracy: true });
        }

        // --- MANAJEMEN JOB (SUPABASE) ---
        async function loadJadwal() {
            const { data, error } = await _client.from('data_pengiriman').select('*').order('id', {ascending: false});
            const container = document.getElementById('list-pengiriman');
            container.innerHTML = "";
            
            if (data) {
                data.forEach(j => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerHTML = `
                        <div><b>${j.nopol}</b><br><small>${j.tujuan}</small></div>
                        <button class="btn-small btn-green" onclick='startJob(${JSON.stringify(j)})'>Ambil</button>
                    `;
                    container.appendChild(div);
                });
            } else { container.innerHTML = "Tidak ada jadwal."; }
        }

        async function startJob(data) {
            activeData = data;
            document.getElementById('job-selector').style.display = 'none';
            document.getElementById('job-active').style.display = 'block';
            document.getElementById('active-nopol').innerText = data.nopol;
            document.getElementById('active-sopir').innerText = data.sopir;
            document.getElementById('active-tujuan').innerText = "📍 " + data.tujuan;
            document.getElementById('status-box').classList.add('working');
            document.getElementById('conn-text').innerText = "Job Aktif: " + data.nopol;
            
            if(currentPos) updateLocationInDB(currentPos[0], currentPos[1]);
        }

        async function updateLocationInDB(lat, lon) {
            if (!activeData) return;
            await _client.from('tracking_unit').upsert({
                nopol: activeData.nopol,
                sopir: activeData.sopir,
                tujuan: activeData.tujuan,
                lat: lat.toString(),
                lon: lon.toString(),
                status: 'ON_JOB',
                last_update: new Date().toISOString()
            }, { onConflict: 'nopol' });
        }

        async function stopJob() {
            if (confirm("Selesaikan pengiriman?")) {
                await _client.from('tracking_unit').update({ status: 'OFF' }).eq('nopol', activeData.nopol);
                location.reload();
            }
        }

        // --- MANAJEMEN POI (LOKASI TANDA) ---
        map.on('click', function(e) {
            const name = prompt("Nama Lokasi / POI:");
            if (name) {
                savePOI(name, e.latlng.lat, e.latlng.lng);
            }
        });

        async function savePOI(name, lat, lon) {
            const { data, error } = await _client.from('poi_lokasi').insert([{ nama: name, lat, lon }]);
            loadPOIs();
        }

        async function loadPOIs() {
            const { data } = await _client.from('poi_lokasi').select('*');
            const list = document.getElementById('poi-list');
            list.innerHTML = "";
            
            data?.forEach(p => {
                // Marker di peta
                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.nama);
                }
                // List di sidebar
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span>${p.nama}</span>
                    <button class="btn-small btn-red" onclick="deletePOI(${p.id})">Hapus</button>
                `;
                div.onclick = () => map.flyTo([p.lat, p.lon], 15);
                list.appendChild(div);
            });
        }

        async function deletePOI(id) {
            await _client.from('poi_lokasi').delete().eq('id', id);
            if (markers.pois[id]) { map.removeLayer(markers.pois[id]); delete markers.pois[id]; }
            loadPOIs();
        }

        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        // --- RENDER UNIT LAIN ---
        function renderUnitMarker(unit) {
            if (markers.units[unit.nopol]) {
                markers.units[unit.nopol].setLatLng([unit.lat, unit.lon]);
            } else {
                markers.units[unit.nopol] = L.marker([unit.lat, unit.lon], {
                    icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41]})
                }).addTo(map).bindPopup(unit.nopol);
            }
        }

        async function fetchOtherUnits() {
            const { data } = await _client.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            data?.forEach(u => { if(u.nopol !== activeData?.nopol) renderUnitMarker(u); });
        }

        function goToHome() { if (currentPos) map.flyTo(currentPos, 16); }

        // Inisialisasi
        initGPS();
        loadJadwal();
        loadPOIs();
        setInterval(fetchOtherUnits, 10000);
        setInterval(() => { if(activeData && currentPos) updateLocationInDB(currentPos[0], currentPos[1]) }, 5000);
    </script>
</body>
</html>
