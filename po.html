<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PURCHASE ORDER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; padding: 10px; color: #334155; }
        
        .header-banner { 
            background-color: #0f172a; color: white; padding: 12px; text-align: center; 
            font-weight: bold; font-size: 16px; border-radius: 6px; margin-bottom: 8px; 
            letter-spacing: 1px;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; }
        
        /* Header Warna Soft Emerald */
        th { background-color: #ecfdf5; border: 1px solid #e2e8f0; padding: 6px 2px; font-size: 9px; text-transform: uppercase; color: #065f46; }
        
        /* Header Warna Soft Amber (Kanan) */
        th.bg-del { background-color: #fffbeb; color: #92400e; border: 1px solid #e2e8f0; }
        
        td { border: 1px solid #e2e8f0; padding: 2px; font-size: 11px; vertical-align: middle; height: 28px; }
        
        input { width: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 11px; height: 100%; color: #1e293b; }
        input:focus { background-color: #f1f5f9; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Footer Soft Blue */
        .bg-footer { background-color: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }
        
        /* Perampingan Tombol Aksi */
        .btn-action { 
            cursor: pointer; width: 16px; height: 16px; display: inline-flex; 
            align-items: center; justify-content: center; border-radius: 50%; 
            font-size: 12px; transition: 0.2s; border: 1px solid #cbd5e1; background: white;
        }
        .btn-add { color: #10b981; }
        .btn-add:hover { background: #10b981; color: white; }
        .btn-rem { color: #ef4444; }
        .btn-rem:hover { background: #ef4444; color: white; }
        
        .action-container { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; z-index: 100; }
        
        .btn-ui { padding: 5px 12px; font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 5px; transition: 0.2s; border: none; }
        .btn-save { background-color: #10b981; color: white; }
        .btn-save:hover { background-color: #059669; }
        .btn-print { background-color: #64748b; color: white; }
        .btn-home { background-color: #f1f5f9; color: #475569; text-decoration: none; border: 1px solid #e2e8f0; }

        .carry-over { background-color: #fdfaf2; }
        .pdf-hide-col { width: 40px !important; text-align: center; }
    </style>
</head>
<body id="content-to-print">

    <div class="action-container">
        <a href="index.html" class="btn-ui btn-home">HOME</a>
        <button class="btn-ui btn-save" onclick="saveData()">SAVE CLOUD</button>
        <button class="btn-ui btn-print" onclick="printPDF()">DOWNLOAD PDF</button>
    </div>

    <div class="header-banner">MONITORING PURCHASE ORDER</div>
    
    <div class="flex gap-2">
        <!-- TABEL KIRI (SUPPLIER) -->
        <div class="w-[32%] shadow-sm rounded-lg overflow-hidden border border-slate-200">
            <div class="bg-white p-2 font-bold text-[10px] border-b border-slate-200 text-center text-emerald-700">INBOUND (SUPPLIER)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide pdf-hide-col">+/-</th>
                        <th style="width: 25px;">NO</th>
                        <th>PO</th>
                        <th style="width: 65px;">TGL PO</th>
                        <th style="width: 90px;">NO PO</th>
                        <th>TUJUAN</th>
                        <th style="width: 40px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
            </table>
        </div>

        <!-- TABEL KANAN (CUSTOMER) -->
        <div class="w-[68%] shadow-sm rounded-lg overflow-hidden border border-slate-200">
            <div id="title-cust" class="bg-white p-2 font-bold text-[10px] border-b border-slate-200 text-right pr-4 italic text-slate-500">
                 Periode: <span id="current-period" class="text-sky-600"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide pdf-hide-col">+/-</th>
                        <th style="width: 20px;">NO</th>
                        <th>DELIVERY_TO</th>
                        <th style="width: 65px;">PO_DATE</th>
                        <th>NUMBER</th>
                        <th style="width: 40px;">JML</th>
                        <th class="bg-del" style="width: 110px;">SUB_CUST</th>
                        <th class="bg-del" style="width: 40px;">OUT</th>
                        <th class="bg-del">SUPPLIER</th>
                        <th class="bg-del" style="width: 65px;">TGL_KIRIM</th>
                        <th class="bg-del" style="width: 40px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
            </table>
        </div>
    </div>

    <table class="mt-2 rounded-lg overflow-hidden border border-slate-200 shadow-sm">
        <tr class="bg-footer text-center text-[10px]">
            <td style="width: 25%; color: #059669;">SISA STOK SUPPLIER: <span id="total-supp-qty" class="text-sm">0</span></td>
            <td style="width: 25%; color: #0284c7;">TOTAL TARGET CUST: <span id="total-cust-qty" class="text-sm">0</span></td>
            <td style="width: 25%; color: #d97706;">TOTAL REALISASI (OUT): <span id="total-del" class="text-sm">0</span></td>
            <td style="width: 25%; color: #dc2626;">TOTAL SISA CUST: <span id="total-sisa" class="text-sm">0</span></td>
        </tr>
    </table>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = JSON.parse(localStorage.getItem('monitoring_supp')) || [{ po: '', tgl: '', nopo: '', tujuan: '', qtyOrig: 0 }];
        let dataCust = JSON.parse(localStorage.getItem('monitoring_cust')) || [{ name: '', tgl: '', nopo: '', qty: 0, cust_extra: '', del: 0, supp: '', tglKirim: '' }];

        async function fetchSuppFromSupabase() {
            try {
                const { data, error } = await _supabase.from('purchase_orders').select('*').order('id', { ascending: true });
                if (error) throw error;
                if (data && data.length > 0) {
                    dataSupp = data.map(item => ({
                        po: item.po_code || '',
                        tgl: reformatDateToDisplay(item.tgl_po),
                        nopo: item.no_po || '',
                        tujuan: item.tujuan || '',
                        qtyOrig: item.qty || 0
                    }));
                    renderSupp();
                    calculate();
                }
            } catch (e) { console.error(e); }
        }

        async function autoFetchSupabaseData() {
            try {
                const now = new Date();
                const firstDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
                const lastDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${new Date(now.getFullYear(), now.getMonth()+1, 0).getDate()}`;
                document.getElementById('current-period').innerText = `${firstDay} s/d ${lastDay}`;

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', firstDay).lte('tanggal', lastDay);
                if (error) throw error;
                if (data) {
                    let manualEntries = dataCust.filter(item => (item.name !== '' || parseFloat(item.qty) > 0));
                    let incomingMap = new Map();
                    data.forEach(row => {
                        let supplierName = (row.supplier || '').toUpperCase();
                        if (supplierName.includes('PETRO') || supplierName.includes('PAN')) return;
                        if (supplierName.includes('LANGSIRAN OCEAN')) supplierName = 'OCEAN';
                        else if (supplierName.includes('LANGSIRAN SSS')) supplierName = 'SSS';
                        else if (supplierName.includes('LANGSIRAN')) supplierName = supplierName.replace('LANGSIRAN ', '');
                        
                        const tglKirimFormatted = formatDate(row.tanggal);
                        const uniqueKey = `${row.id}-${row.no_po}-${tglKirimFormatted}-${row.jumlah_keluar}`;
                        incomingMap.set(uniqueKey, {
                            name: '', tgl: '', nopo: row.no_po || '', qty: 0, 
                            cust_extra: row.delivery_to || '', del: parseFloat(row.jumlah_keluar) || 0, 
                            supp: supplierName, tglKirim: tglKirimFormatted
                        });
                    });
                    dataCust = [...manualEntries, ...Array.from(incomingMap.values())];
                    renderCust();
                }
            } catch (e) { console.error(e); }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }

        function reformatDateToDisplay(dateStr) {
            if(!dateStr) return '';
            const parts = dateStr.split('-');
            return (parts.length === 3) ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr;
        }

        function renderSupp() {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            dataSupp.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pdf-hide text-center">
                        <span class="btn-action btn-add" onclick="addSupp(${index})">+</span>
                        <span class="btn-action btn-rem" onclick="remSupp(${index})">-</span>
                    </td>
                    <td class="text-center text-slate-400 font-bold">${index + 1}</td>
                    <td><input type="text" value="${item.po}" oninput="dataSupp[${index}].po=this.value"></td>
                    <td><input type="text" value="${item.tgl}" oninput="dataSupp[${index}].tgl=this.value" placeholder="DD/MM/YY"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="text" value="${item.tujuan}" oninput="dataSupp[${index}].tujuan=this.value; calculate();"></td>
                    <td><input type="number" id="qty-supp-input-${index}" value="${item.qtyOrig}" oninput="dataSupp[${index}].qtyOrig=this.value; calculate();" class="font-bold text-emerald-600"></td>
                `;
                body.appendChild(tr);
            });
        }

        function renderCust() {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            dataCust.forEach((item, index) => {
                const tr = document.createElement('tr');
                let sisa = (parseFloat(item.qty) || 0) - (parseFloat(item.del) || 0);
                if(sisa > 0 && item.nopo) tr.classList.add('carry-over');

                tr.innerHTML = `
                    <td class="pdf-hide text-center">
                        <span class="btn-action btn-add" onclick="addCust(${index})">+</span>
                        <span class="btn-action btn-rem" onclick="remCust(${index})">-</span>
                    </td>
                    <td class="text-center text-slate-400 font-bold">${index + 1}</td>
                    <td><input type="text" value="${item.name || ''}" oninput="dataCust[${index}].name=this.value"></td>
                    <td><input type="text" value="${item.tgl || ''}" oninput="dataCust[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo || ''}" oninput="dataCust[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="number" value="${item.qty || 0}" oninput="dataCust[${index}].qty=this.value; calculate();"></td>
                    <td style="background:#fffcf5"><input type="text" value="${item.cust_extra || ''}" oninput="dataCust[${index}].cust_extra=this.value"></td>
                    <td><input type="number" value="${item.del || 0}" oninput="dataCust[${index}].del=this.value; calculate();"></td>
                    <td><input type="text" value="${item.supp || ''}" oninput="dataCust[${index}].supp=this.value; calculate();"></td>
                    <td><input type="text" value="${item.tglKirim || ''}" oninput="dataCust[${index}].tglKirim=this.value"></td>
                    <td class="text-center font-bold ${sisa < 0 ? 'text-red-500' : 'text-slate-500'}">${sisa}</td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function calculate() {
            let delPool = {}; 
            dataCust.forEach(c => {
                if(c.supp) {
                    let sName = c.supp.trim().toUpperCase();
                    delPool[sName] = (delPool[sName] || 0) + (parseFloat(c.del) || 0);
                }
            });

            let totalSisaSupp = 0;
            let tempPool = {...delPool};

            dataSupp.forEach((s, i) => {
                let sTujuan = s.tujuan ? s.tujuan.trim().toUpperCase() : "";
                let qtyOrig = parseFloat(s.qtyOrig) || 0;
                let sisaDisplay = qtyOrig;

                if (sTujuan && tempPool[sTujuan] !== undefined) {
                    if (tempPool[sTujuan] >= qtyOrig) { 
                        sisaDisplay = 0; tempPool[sTujuan] -= qtyOrig; 
                    } else { 
                        sisaDisplay = qtyOrig - tempPool[sTujuan]; tempPool[sTujuan] = 0; 
                    }
                }
                
                let el = document.getElementById(`qty-supp-input-${i}`);
                if (el && document.activeElement !== el) el.value = sisaDisplay;
                totalSisaSupp += sisaDisplay;
            });

            let totalTargetCust = 0, totalRealisasiOut = 0;
            dataCust.forEach(item => {
                totalTargetCust += (parseFloat(item.qty) || 0);
                totalRealisasiOut += (parseFloat(item.del) || 0);
            });

            document.getElementById('total-supp-qty').innerText = totalSisaSupp;
            document.getElementById('total-cust-qty').innerText = totalTargetCust;
            document.getElementById('total-del').innerText = totalRealisasiOut;
            document.getElementById('total-sisa').innerText = totalTargetCust - totalRealisasiOut;
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {po:'', tgl:'', nopo:'', tujuan:'', qtyOrig:0}); renderSupp(); calculate(); }
        function remSupp(i) { if(dataSupp.length > 1) { dataSupp.splice(i,1); renderSupp(); calculate(); } }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0, cust_extra: '', del:0, supp:'', tglKirim:''}); renderCust(); }
        function remCust(i) { if(dataCust.length > 1) { dataCust.splice(i,1); renderCust(); calculate(); } }

        async function saveData() {
            localStorage.setItem('monitoring_supp', JSON.stringify(dataSupp));
            localStorage.setItem('monitoring_cust', JSON.stringify(dataCust));
            try {
                const itemsToSave = dataSupp.map((item, index) => {
                    let formattedDate = null;
                    if (item.tgl) {
                        const parts = item.tgl.split('/');
                        if (parts.length === 3) formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                    }
                    return {
                        id: index + 1, po_code: item.po || '', tgl_po: formattedDate,
                        no_po: item.nopo || '', tujuan: item.tujuan || '', qty: parseInt(item.qtyOrig) || 0
                    };
                });
                const { error } = await _supabase.from('purchase_orders').upsert(itemsToSave);
                if (error) throw error;
                alert("Data berhasil disinkronkan ke Cloud!");
            } catch (err) { alert("Gagal Cloud: " + err.message); }
        }

        function printPDF() {
            const element = document.getElementById('content-to-print');
            const actionContainer = document.querySelector('.action-container');
            const editBtn = document.querySelectorAll('.pdf-hide');
            
            actionContainer.style.display = 'none';
            editBtn.forEach(el => el.style.display = 'none');

            const opt = {
                margin: 5, filename: 'Monitoring_PO_Clean.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                actionContainer.style.display = 'flex';
                editBtn.forEach(el => el.style.display = '');
            });
        }

        window.onload = async () => { 
            renderSupp(); renderCust(); 
            await fetchSuppFromSupabase(); 
            await autoFetchSupabaseData(); 
            setInterval(autoFetchSupabaseData, 30000); 
        };
    </script>
</body>
</html>
