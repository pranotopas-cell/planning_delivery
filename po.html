<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PURCHASE ORDER - 3 COLUMNS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; padding: 10px; color: #1e293b; }
        
        .header-banner { 
            background-color: #0f172a; color: white; padding: 10px; text-align: center; 
            font-weight: bold; font-size: 14px; border-radius: 6px; margin-bottom: 8px; 
            border-bottom: 3px solid #10b981;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; }
        th { background-color: #f8fafc; border: 1px solid #cbd5e1; padding: 4px 2px; font-size: 8px; text-transform: uppercase; color: #475569; }
        td { border: 1px solid #cbd5e1; padding: 1px; font-size: 9px; height: 24px; }
        
        input { width: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 9px; color: #000; }
        input:focus { background-color: #f1f5f9; }
        
        /* Hilangkan Spinner Input Number */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .btn-action { cursor: pointer; font-weight: bold; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border: none; background: none; }
        .btn-add { color: #10b981; font-size: 14px; }
        .btn-rem { color: #ef4444; font-size: 14px; }
        
        .action-container { position: fixed; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 100; }
        .btn-ui { padding: 5px 10px; font-size: 9px; font-weight: bold; border-radius: 4px; cursor: pointer; border: none; }
        .btn-save { background-color: #10b981; color: white; }
        .btn-print { background-color: #64748b; color: white; }

        .col-header { padding: 4px; font-bold; text-[9px]; text-white; text-center; font-weight: bold; }
        
        @media print { .action-container, .pdf-hide { display: none !important; } }
    </style>
</head>
<body>

    <div class="action-container">
        <button class="btn-ui btn-save" onclick="saveData()">SAVE CLOUD</button>
        <button class="btn-ui btn-print" onclick="window.print()">PRINT</button>
    </div>

    <div class="header-banner">MONITORING SYSTEM - PO & DELIVERY</div>
    
    <div class="flex gap-2">
        <!-- 1. INBOUND (SUPPLIER PO) -->
        <div class="w-[30%] shadow-sm border border-slate-300 rounded overflow-hidden">
            <div class="col-header bg-emerald-700 text-white p-1 text-center text-[10px]">1. INBOUND (SUPPLIER)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 20px;">+</th>
                        <th style="width: 20px;">NO</th>
                        <th style="width: 30px;">PT</th>
                        <th>NO PO</th>
                        <th style="width: 40px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-inbound"></tbody>
            </table>
        </div>

        <!-- 2. PESANAN (CUSTOMER CONTRACT) -->
        <div class="w-[35%] shadow-sm border border-slate-300 rounded overflow-hidden">
            <div class="col-header bg-sky-700 text-white p-1 text-center text-[10px]">2. PESANAN (CUSTOMER)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 20px;">+</th>
                        <th style="width: 20px;">NO</th>
                        <th>CUSTOMER</th>
                        <th style="width: 45px;">QTY</th>
                        <th style="width: 45px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-pesanan"></tbody>
            </table>
        </div>

        <!-- 3. OUTBOUND (REAL DELIVERY) -->
        <div class="w-[35%] shadow-sm border border-slate-300 rounded overflow-hidden">
            <div class="col-header bg-slate-800 text-white p-1 text-center text-[10px]">3. OUTBOUND (DELIVERY)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 20px;">+</th>
                        <th style="width: 20px;">NO</th>
                        <th>TUJUAN</th>
                        <th style="width: 40px;">OUT</th>
                        <th>SUPP</th>
                    </tr>
                </thead>
                <tbody id="body-outbound"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataInbound = [{ pt: '', nopo: '', qty: 0 }];
        let dataPesanan = [{ cust: '', qty: 0 }];
        let dataOutbound = [];

        // --- RENDER FUNCTIONS ---
        function renderInbound() {
            const body = document.getElementById('body-inbound');
            body.innerHTML = '';
            dataInbound.forEach((item, index) => {
                body.innerHTML += `
                    <tr>
                        <td class="pdf-hide"><button class="btn-action btn-add" onclick="addRow('inbound', ${index})">+</button></td>
                        <td class="text-center bg-slate-50">${index + 1}</td>
                        <td><input type="text" value="${item.pt}" oninput="dataInbound[${index}].pt=this.value"></td>
                        <td><input type="text" value="${item.nopo}" oninput="dataInbound[${index}].nopo=this.value"></td>
                        <td><input type="number" value="${item.qty}" class="font-bold text-emerald-700"></td>
                    </tr>`;
            });
        }

        function renderPesanan() {
            const body = document.getElementById('body-pesanan');
            body.innerHTML = '';
            dataPesanan.forEach((item, index) => {
                body.innerHTML += `
                    <tr>
                        <td class="pdf-hide"><button class="btn-action btn-rem" onclick="remRow('pesanan', ${index})">-</button></td>
                        <td class="text-center bg-slate-50">${index + 1}</td>
                        <td><input type="text" value="${item.cust}" oninput="dataPesanan[${index}].cust=this.value"></td>
                        <td><input type="number" value="${item.qty}" oninput="dataPesanan[${index}].qty=this.value"></td>
                        <td class="text-center font-bold">0</td>
                    </tr>`;
            });
        }

        function renderOutbound() {
            const body = document.getElementById('body-outbound');
            body.innerHTML = '';
            dataOutbound.forEach((item, index) => {
                body.innerHTML += `
                    <tr class="${item.isAuto ? 'bg-orange-50' : ''}">
                        <td class="pdf-hide"><button class="btn-action btn-rem" onclick="remRow('outbound', ${index})">-</button></td>
                        <td class="text-center bg-slate-50">${index + 1}</td>
                        <td><input type="text" value="${item.tujuan}"></td>
                        <td><input type="number" value="${item.out}" class="font-bold"></td>
                        <td><input type="text" value="${item.supp}"></td>
                    </tr>`;
            });
        }

        // --- ROW ACTIONS ---
        function addRow(type, i) {
            if(type === 'inbound') dataInbound.splice(i+1, 0, {pt:'', nopo:'', qty:0});
            refreshAll();
        }
        function remRow(type, i) {
            if(type === 'pesanan') dataPesanan.splice(i, 1);
            if(type === 'outbound') dataOutbound.splice(i, 1);
            refreshAll();
        }

        function refreshAll() {
            renderInbound(); renderPesanan(); renderOutbound();
        }

        // --- DATA FETCHING ---
        async function fetchData() {
            // Fetch Inbound (PO Supplier)
            const { data: poData } = await _supabase.from('purchase_orders').select('*');
            if(poData) dataInbound = poData.map(i => ({ pt: i.po_code, nopo: i.no_po, qty: i.qty }));

            // Fetch Outbound (Delivery)
            const now = new Date();
            const firstDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const { data: delData } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', firstDay);
            
            if(delData) {
                dataOutbound = delData.map(i => ({
                    tujuan: i.delivery_to,
                    out: i.jumlah_keluar,
                    supp: i.supplier,
                    isAuto: true
                }));
            }
            refreshAll();
        }

        async function saveData() {
            alert("Fitur simpan sedang disinkronkan...");
        }

        window.onload = () => { fetchData(); };
    </script>
</body>
</html>
