<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring PO Logistics V4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; padding: 10px; position: relative; }
        .header-banner { background-color: #1d3557; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid #000; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background-color: #92d050; border: 1px solid #000; padding: 5px; font-size: 10px; text-transform: uppercase; }
        td { border: 1px solid #000; padding: 2px; font-size: 11px; vertical-align: middle; height: 30px; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        input { width: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 11px; height: 100%; }
        input:focus { background-color: #fff9c4; }
        
        .bg-del { background-color: #e69138; }
        .bg-footer { background-color: #d9e1f2; font-weight: bold; }
        .btn-action { cursor: pointer; font-weight: bold; width: 20px; height: 20px; border: 1px solid #000; background: #eee; display: inline-block; line-height: 18px; border-radius: 3px; }
        
        .button-group {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
            z-index: 100;
        }
        .btn-nav { padding: 4px 8px; border: 1px solid #000; font-size: 10px; font-weight: bold; cursor: pointer; color: white; }
        .btn-save { background-color: #28a745; }
        .btn-save:hover { background-color: #218838; }
        .btn-pdf { background-color: #dc3545; }
        .btn-pdf:hover { background-color: #c82333; }
        .btn-home { background-color: #6c757d; }
        .btn-home:hover { background-color: #5a6268; }

        @media print {
            .button-group, .btn-action { display: none !important; }
        }
    </style>
</head>
<body id="content-to-export">

    <div class="button-group">
        <button class="btn-nav btn-home" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn-nav btn-pdf" onclick="downloadPDF()">DOWNLOAD PDF</button>
        <button class="btn-nav btn-save" onclick="saveData()">SAVE DATA</button>
    </div>

    <div class="header-banner">MONITORING PURCHASE ORDER</div>
    
    <div class="flex gap-0 border border-black bg-white">
        <!-- TABEL KIRI (SUPPLIER) -->
        <div class="w-[40%] border-r border-black">
            <div class="bg-white p-1 font-bold text-xs border-b border-black">PURCHASE ORDER KE SUPPLIER</div>
            <table id="table-supp">
                <thead>
                    <tr>
                        <th style="width: 50px;">+/-</th>
                        <th style="width: 30px;">NO</th>
                        <th>PO</th>
                        <th>TGL PO</th>
                        <th style="width: 120px;">NO PO</th>
                        <th>TUJUAN</th>
                        <th>QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
            </table>
        </div>

        <!-- TABEL KANAN (CUSTOMER) -->
        <div class="w-[60%]">
            <div class="bg-white p-1 font-bold text-xs border-b border-black text-right pr-4">PURCHASE ORDER CUSTOMER</div>
            <table id="table-cust">
                <thead>
                    <tr>
                        <th style="width: 50px;">+/-</th>
                        <th style="width: 30px;">NO</th>
                        <th>CUSTOMER</th>
                        <th>TGL PO</th>
                        <th style="width: 120px;">NO PO</th>
                        <th>QTY</th>
                        <th class="bg-del">DELIVERY</th>
                        <th class="bg-del">SUPP</th>
                        <th class="bg-del">TGL KIRIM</th>
                        <th class="bg-del">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
            </table>
        </div>
    </div>

    <table class="mt-0">
        <tr class="bg-footer text-center">
            <td style="width: 30%;">TOTAL SUPPLIER: <span id="total-supp-qty">0</span></td>
            <td style="width: 30%;">TOTAL CUSTOMER: <span id="total-cust-qty">0</span></td>
            <td style="width: 20%;">TOTAL DELIVERI: <span id="total-del">0</span></td>
            <td style="width: 20%;">TOTAL SISA: <span id="total-sisa">0</span></td>
        </tr>
    </table>

    <script>
        let dataSupp = JSON.parse(localStorage.getItem('monitoring_supp')) || [{ po: '', tgl: '', nopo: '', tujuan: '', qtyOrig: 0 }];
        let dataCust = JSON.parse(localStorage.getItem('monitoring_cust')) || [{ name: '', tgl: '', nopo: '', qty: 0, del: 0, supp: '', tglKirim: '' }];

        function formatInputDate(el, index, key, isSupp) {
            let val = el.value.replace(/\D/g, '');
            if (val.length >= 4) {
                let d = val.substring(0, 2);
                let m = val.substring(2, 4);
                let y = val.substring(4, 8) || "2026";
                el.value = `${d}/${m}/${y}`;
                if(isSupp) dataSupp[index][key] = el.value; else dataCust[index][key] = el.value;
            }
        }

        function renderSupp() {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            dataSupp.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">
                        <span class="btn-action" onclick="addSupp(${index})">+</span>
                        <span class="btn-action" onclick="remSupp(${index})">-</span>
                    </td>
                    <td class="text-center">${index + 1}</td>
                    <td><input type="text" value="${item.po}" oninput="dataSupp[${index}].po=this.value"></td>
                    <td><input type="text" placeholder="ddmmyy" value="${item.tgl}" onblur="formatInputDate(this, ${index}, 'tgl', true)" oninput="dataSupp[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="text" value="${item.tujuan}" oninput="dataSupp[${index}].tujuan=this.value; calculate();"></td>
                    <td><input type="number" id="qty-supp-input-${index}" value="${item.qtyOrig || ''}" oninput="dataSupp[${index}].qtyOrig=this.value; calculate();" class="font-bold text-blue-700"></td>
                `;
                body.appendChild(tr);
            });
        }

        function renderCust() {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            dataCust.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">
                        <span class="btn-action" onclick="addCust(${index})">+</span>
                        <span class="btn-action" onclick="remCust(${index})">-</span>
                    </td>
                    <td class="text-center">${index + 1}</td>
                    <td><input type="text" value="${item.name || ''}" oninput="dataCust[${index}].name=this.value"></td>
                    <td><input type="text" placeholder="ddmmyy" value="${item.tgl || ''}" onblur="formatInputDate(this, ${index}, 'tgl', false)" oninput="dataCust[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo || ''}" oninput="dataCust[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="number" value="${item.qty || ''}" oninput="dataCust[${index}].qty=this.value; calculate();"></td>
                    <td class="text-center font-bold text-orange-600" id="del-cust-${index}">0</td>
                    <td><input type="text" value="${item.supp || ''}" oninput="dataCust[${index}].supp=this.value; calculate();"></td>
                    <td><input type="text" placeholder="ddmmyy" value="${item.tglKirim || ''}" onblur="formatInputDate(this, ${index}, 'tglKirim', false)" oninput="dataCust[${index}].tglKirim=this.value"></td>
                    <td class="text-center font-bold" id="sisa-cust-${index}">0</td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function calculate() {
            // Tarik total jumlah_keluar tanpa filter No PO
            const dataPengiriman = JSON.parse(localStorage.getItem('data_pengiriman')) || [];
            const totalDeliveryGlobal = dataPengiriman.reduce((sum, p) => sum + (parseFloat(p.jumlah_keluar) || 0), 0);
            
            let totalC = 0;
            let totalD = 0;

            // Update Tabel Customer
            dataCust.forEach((item, i) => {
                let qty = parseFloat(item.qty) || 0;
                
                // Distribusi delivery: Disini kita tampilkan total delivery global pada baris pertama saja 
                // atau sesuaikan dengan kebutuhan visual Anda. 
                // Namun berdasarkan permintaan "abaikan no po", kita asumsikan delivery per baris 
                // adalah hasil dari input manual atau total dari pengiriman.
                
                // Jika ingin delivery otomatis mengisi total global ke semua baris (tidak disarankan jika baris banyak):
                // item.del = totalDeliveryGlobal; 

                // Kalkulasi sisa sederhana per baris
                let d = parseFloat(item.del) || 0;
                let sisa = qty - d;

                const elDel = document.getElementById(`del-cust-${i}`);
                const elSisa = document.getElementById(`sisa-cust-${i}`);
                
                if (elDel) elDel.innerText = d;
                if (elSisa) elSisa.innerText = sisa;

                totalC += qty;
                totalD += d;
            });

            // Update Tabel Supplier
            let delPool = {}; 
            dataCust.forEach(c => {
                if(c.supp) {
                    let sName = c.supp.trim().toUpperCase();
                    delPool[sName] = (delPool[sName] || 0) + (parseFloat(c.del) || 0);
                }
            });

            let totalS = 0;
            let tempPool = {...delPool};
            dataSupp.forEach((s, i) => {
                let sTujuan = s.tujuan ? s.tujuan.trim().toUpperCase() : "";
                let qtyOrig = parseFloat(s.qtyOrig) || 0;
                let finalQty = qtyOrig;

                if (sTujuan && tempPool[sTujuan] > 0) {
                    if (tempPool[sTujuan] >= qtyOrig) {
                        finalQty = 0;
                        tempPool[sTujuan] -= qtyOrig;
                    } else {
                        finalQty = qtyOrig - tempPool[sTujuan];
                        tempPool[sTujuan] = 0;
                    }
                }
                totalS += finalQty;
                let el = document.getElementById(`qty-supp-input-${i}`);
                if (el && document.activeElement !== el) el.value = finalQty;
            });

            // Footer
            document.getElementById('total-supp-qty').innerText = totalS;
            document.getElementById('total-cust-qty').innerText = totalC;
            document.getElementById('total-del').innerText = totalD;
            document.getElementById('total-sisa').innerText = totalC - totalD;
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {po:'', tgl:'', nopo:'', tujuan:'', qtyOrig:0}); renderSupp(); calculate(); }
        function remSupp(i) { if(dataSupp.length > 1) { dataSupp.splice(i,1); renderSupp(); calculate(); } }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0, del:0, supp:'', tglKirim:''}); renderCust(); }
        function remCust(i) { if(dataCust.length > 1) { dataCust.splice(i,1); renderCust(); } }
        
        function saveData() { 
            localStorage.setItem('monitoring_supp', JSON.stringify(dataSupp)); 
            localStorage.setItem('monitoring_cust', JSON.stringify(dataCust)); 
            alert("Data Berhasil Disimpan!"); 
        }

        function downloadPDF() {
            const element = document.getElementById('content-to-export');
            const opt = {
                margin: 5,
                filename: 'Monitoring_PO_Logistics.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = () => { renderSupp(); renderCust(); };
    </script>
</body>
</html>
