<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PURCHASE ORDER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern Corporate Gold Palette */
        :root {
            --primary-dark: #1e293b;
            --gold-soft: #c5a059;
            --gold-light: #f1e4c3;
            --gold-accent: #b8860b;
            --bg-body: #fdfdfb;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-body); padding: 10px; color: #334155; }
        
        .header-banner { 
            background: linear-gradient(90deg, #1e293b 0%, #c5a059 100%); 
            color: white; 
            padding: 12px; 
            text-align: center; 
            font-weight: 700; 
            font-size: 18px; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            border-bottom: 4px solid var(--gold-accent); 
            text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; border: 1px solid #e2e8f0; border-radius: 4px; overflow: hidden; }
        
        th { 
            background-color: #1e293b; 
            color: var(--gold-light); 
            border: 1px solid #334155; 
            padding: 8px 2px; 
            font-size: 9px; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }

        td { border: 1px solid #e2e8f0; padding: 0; font-size: 10px; height: 30px; vertical-align: middle; }
        
        input { 
            width: 100%; border: none; background: transparent; text-align: center; 
            outline: none; font-size: 10px; height: 100%; color: #1e293b; font-weight: 500; 
            transition: all 0.2s;
        }
        
        input:focus { background-color: rgba(197, 160, 89, 0.05); box-shadow: inset 0 0 4px var(--gold-soft); }

        .bg-footer-dark { background-color: #1e293b; color: var(--gold-light); font-weight: bold; text-align: center; }
        
        .section-label { font-weight: 800; font-size: 11px; margin-bottom: 6px; border-left: 4px solid var(--gold-soft); padding-left: 8px; }
        .text-red-label { color: #92400e; } /* Muted earthy red/gold */
        .text-blue-label { color: #1e40af; }
        
        .btn-action { cursor: pointer; font-size: 14px; font-weight: bold; color: var(--gold-accent); border: none; background: none; width: 100%; height: 100%; }
        .btn-action:hover { background-color: var(--gold-light); }

        .action-container { position: fixed; top: 15px; right: 20px; display: flex; gap: 8px; z-index: 100; }
        
        .btn-ui { 
            padding: 6px 14px; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 4px; 
            background: white; border: 1px solid #cbd5e1; transition: all 0.2s; color: #475569;
        }
        .btn-ui:hover { border-color: var(--gold-soft); color: var(--gold-accent); }
        
        .btn-save { background: var(--gold-soft) !important; color: white !important; border: none !important; }
        .btn-save:hover { background: var(--gold-accent) !important; }

        @media print { .action-container, .pdf-hide { display: none !important; } }
    </style>
</head>
<body>

    <div class="action-container">
        <a href="index.html" class="btn-ui" style="display: inline-block; text-decoration: none; line-height: 1.5;">HOME</a>
        <button class="btn-ui" onclick="location.reload()">REFRESH</button>
        <button class="btn-ui btn-save" onclick="saveData()">SAVE CLOUD</button>
        <button class="btn-ui" onclick="window.print()">PRINT</button>
    </div>

    <div class="header-banner"> MONITORING PURCHASE ORDER </div>
    
    <div class="flex gap-4 items-start">
        <!-- KOLOM 1: INBOUND SUPPLIER -->
        <div class="w-[30%]">
            <div class="section-label text-red-label">INBOUND SUPPLIER ( PO KE SUPPLIER)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 25px;">±</th>
                        <th style="width: 45px;">PT</th>
                        <th style="width: 85px;">TGL PO</th>
                        <th>NOMOR PO</th>
                        <th style="width: 60px;">INU</th>
                        <th style="width: 35px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td colspan="5" class="text-right pr-2">JUMLAH</td>
                        <td id="total-supp-qty">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- KOLOM 2: PURCHASE ORDER -->
        <div class="w-[30%]">
            <div class="section-label text-blue-label">PURCHASE ORDER DARI CUSTOMER</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 25px;">±</th>
                        <th>CUSTOMER</th>
                        <th style="width: 85px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 35px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td colspan="4" class="text-right pr-2">JUMLAH</td>
                        <td id="total-cust-qty">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- KOLOM 3: OUTBOUND -->
        <div class="w-[40%]">
            <div class="section-label text-blue-label flex justify-between">
                <span>OUT BOUND ( PENGIRIMAN )</span>
                <span id="current-period" style="font-size: 9px; font-weight: normal; color: #64748b;"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 155px;">TUJUAN (AUTO)</th>
                        <th style="width: 35px;">OUT</th>
                        <th>SUPPLIER</th>
                        <th style="width: 75px;">TGL KIRIM</th>
                    </tr>
                </thead>
                <tbody id="body-out"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td id="total-del">0</td>
                        <td colspan="3"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [{ pt: '', tgl: '', nopo: '', inu: '', qtyOrig: 0 }];
        let dataCust = [{ name: '', tgl: '', nopo: '', qty: 0 }];
        let dataOut = [];

        function formatDateInput(e, type, index, field) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 4) {
                let day = val.substring(0, 2);
                let month = val.substring(2, 4);
                let year = val.length >= 8 ? val.substring(4, 8) : new Date().getFullYear();
                let formatted = `${day}/${month}/${year}`;
                e.target.value = formatted;
                if(type === 'supp') dataSupp[index][field] = formatted;
                else dataCust[index][field] = formatted;
            }
        }

        async function fetchSuppFromCloud() {
            try {
                const { data } = await _supabase.from('purchase_orders').select('*').order('id', { ascending: true });
                if (data && data.length > 0) {
                    dataSupp = data.map(i => ({
                        pt: i.po_code || '',
                        tgl: i.tgl_po ? i.tgl_po.split('-').reverse().join('/') : '',
                        nopo: i.no_po || '',
                        inu: i.tujuan || '',
                        qtyOrig: parseFloat(i.qty) || 0
                    }));
                    renderAll();
                }
            } catch (e) { console.error("Error Fetch Supp:", e); }
        }

        async function fetchOutbound() {
            const now = new Date();
            const firstDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${new Date(now.getFullYear(), now.getMonth()+1, 0).getDate()}`;
            document.getElementById('current-period').innerText = `periode :${firstDay} s/d ${lastDay}`;

            try {
                const { data } = await _supabase.from('data_pengiriman')
                    .select('*')
                    .gte('tanggal', firstDay)
                    .lte('tanggal', lastDay)
                    .not('supplier', 'ilike', '%petro%')
                    .not('supplier', 'ilike', '%pan%')
                    .not('supplier', 'ilike', '%transport%');

                if (data) {
                    dataOut = data.map(row => ({
                        tujuan: row.delivery_to || '',
                        out: parseFloat(row.jumlah_keluar) || 0,
                        supp: row.supplier || '',
                        tgl: row.tanggal ? row.tanggal.split('-').reverse().join('/') : ''
                    }));
                    renderAll();
                }
            } catch (e) { console.error("Error Fetch Outbound:", e); }
        }

        async function saveData() {
            try {
                const mapSave = dataSupp.map((s, idx) => ({
                    id: idx + 1, 
                    po_code: s.pt, 
                    tgl_po: s.tgl ? s.tgl.split('/').reverse().join('-') : null,
                    no_po: s.nopo, 
                    tujuan: s.inu, 
                    qty: parseFloat(s.qtyOrig) || 0
                }));
                const { error } = await _supabase.from('purchase_orders').upsert(mapSave);
                if (error) throw error;
                alert("Data Berhasil Disimpan ke Cloud!");
            } catch (err) { alert("Gagal Simpan ke Cloud"); }
        }

        function renderAll() {
            const maxRows = Math.max(dataOut.length, 12, dataSupp.length, dataCust.length);
            renderSupp(maxRows);
            renderCust(maxRows);
            renderOut(maxRows);
            calculate();
        }

        function renderSupp(max) {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataSupp[i] || { pt: '', tgl: '', nopo: '', inu: '', qtyOrig: 0 };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pdf-hide text-center"><button class="btn-action" onclick="addSupp(${i})">±</button></td>
                    <td><input type="text" value="${item.pt}" oninput="dataSupp[${i}].pt=this.value"></td>
                    <td><input type="text" placeholder="dd/mm/yyyy" value="${item.tgl}" onkeyup="formatDateInput(event, 'supp', ${i}, 'tgl')" oninput="dataSupp[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${i}].nopo=this.value"></td>
                    <td><input type="text" value="${item.inu}" oninput="dataSupp[${i}].inu=this.value; calculate();"></td>
                    <td><input type="text" id="sisa-supp-${i}" value="${item.qtyOrig}" readonly class="font-bold"></td>
                `;
                body.appendChild(tr);
            }
        }

        function renderCust(max) {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataCust[i] || { name: '', tgl: '', nopo: '', qty: 0 };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pdf-hide text-center"><button class="btn-action" onclick="addCust(${i})">±</button></td>
                    <td><input type="text" value="${item.name}" oninput="dataCust[${i}].name=this.value"></td>
                    <td><input type="text" placeholder="dd/mm/yyyy" value="${item.tgl}" onkeyup="formatDateInput(event, 'cust', ${i}, 'tgl')" oninput="dataCust[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataCust[${i}].nopo=this.value"></td>
                    <td><input type="number" value="${item.qty}" oninput="dataCust[${i}].qty=this.value; calculate();"></td>
                `;
                body.appendChild(tr);
            }
        }

        function renderOut(max) {
            const body = document.getElementById('body-out');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataOut[i] || { tujuan: '', out: '', supp: '', tgl: '' };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${item.tujuan}" readonly style="text-align: left; padding-left: 5px;"></td>
                    <td><input type="text" value="${item.out}" readonly></td>
                    <td><input type="text" value="${item.supp}" readonly></td>
                    <td><input type="text" value="${item.tgl}" readonly style="font-size: 9px;"></td>
                `;
                body.appendChild(tr);
            }
        }

        function calculate() {
            let poolOut = {};
            dataOut.forEach(o => {
                let key = (o.supp || "").toUpperCase().trim();
                poolOut[key] = (poolOut[key] || 0) + (parseFloat(o.out) || 0);
            });

            let totalSuppSisa = 0;

            dataSupp.forEach((s, i) => {
                let inuVal = (s.inu || "").toUpperCase().trim();
                let currentSisa = parseFloat(s.qtyOrig) || 0;

                if (inuVal) {
                    for (let suppName in poolOut) {
                        if (suppName.includes(inuVal) && poolOut[suppName] > 0) {
                            if (poolOut[suppName] >= currentSisa) {
                                poolOut[suppName] -= currentSisa;
                                currentSisa = 0;
                            } else {
                                currentSisa -= poolOut[suppName];
                                poolOut[suppName] = 0;
                            }
                        }
                    }
                }

                const el = document.getElementById(`sisa-supp-${i}`);
                if (el) el.value = currentSisa.toLocaleString('id-ID'); 
                totalSuppSisa += currentSisa;
            });

            document.getElementById('total-supp-qty').innerText = totalSuppSisa.toLocaleString('id-ID');
            document.getElementById('total-cust-qty').innerText = dataCust.reduce((acc, curr) => acc + (parseFloat(curr.qty) || 0), 0).toLocaleString('id-ID');
            document.getElementById('total-del').innerText = dataOut.reduce((acc, curr) => acc + (parseFloat(curr.out) || 0), 0).toLocaleString('id-ID');
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {pt:'', tgl:'', nopo:'', inu:'', qtyOrig:0}); renderAll(); }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0}); renderAll(); }

        window.onload = async () => {
            await fetchSuppFromCloud();
            await fetchOutbound();
            setInterval(fetchOutbound, 60000); 
        };
    </script>
</body>
</html>
