<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring PO Logistics V4 - Full Integration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f4f6; padding: 10px; position: relative; }
        .header-banner { background-color: #1d3557; color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 18px; border: 1px solid #000; margin-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background-color: #92d050; border: 1px solid #000; padding: 5px; font-size: 10px; text-transform: uppercase; }
        td { border: 1px solid #000; padding: 2px; font-size: 11px; vertical-align: middle; height: 30px; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        input { width: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 11px; height: 100%; }
        input:focus { background-color: #fff9c4; }
        .bg-del { background-color: #e69138; }
        .bg-footer { background-color: #d9e1f2; font-weight: bold; }
        .btn-action { cursor: pointer; font-weight: bold; width: 20px; height: 20px; border: 1px solid #000; background: #eee; display: inline-block; line-height: 18px; border-radius: 3px; text-align: center; }
        .btn-save { position: absolute; top: 15px; right: 15px; background-color: #28a745; color: white; padding: 4px 8px; border: 1px solid #000; font-size: 10px; font-weight: bold; cursor: pointer; z-index: 100; }
        .carry-over { background-color: #fff3e0; font-style: italic; }
    </style>
</head>
<body>

    <button class="btn-save" onclick="saveData()"> SAVE DATA TO CLOUD</button>
    <div class="header-banner">MONITORING PURCHASE ORDER</div>
    
    <div class="flex gap-0 border border-black bg-white">
        <!-- TABEL KIRI (SUPPLIER) -->
        <div class="w-[35%] border-r border-black">
            <div class="bg-white p-1 font-bold text-xs border-b border-black text-center">PURCHASE ORDER KE SUPPLIER</div>
            <table id="table-supp">
                <thead>
                    <tr>
                        <th style="width: 45px;">+/-</th>
                        <th style="width: 25px;">NO</th>
                        <th>PO</th>
                        <th>TGL PO</th>
                        <th style="width: 100px;">NO PO</th>
                        <th>TUJUAN</th>
                        <th>QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
            </table>
        </div>

        <!-- TABEL KANAN (CUSTOMER) -->
        <div class="w-[65%]">
            <div id="title-cust" class="bg-white p-1 font-bold text-xs border-b border-black text-right pr-4 italic text-gray-500">LIVE DATA SUPABASE (BULAN BERJALAN)</div>
            <table id="table-cust">
                <thead>
                    <tr>
                        <th style="width: 45px;">+/-</th>
                        <th style="width: 25px;">NO</th>
                        <th>DELIVERY_TO</th>
                        <th>TGL PO</th>
                        <th style="width: 100px;">NO PO</th>
                        <th>QTY_PO</th>
                        <th class="bg-del">SUPABASE_CUST</th>
                        <th class="bg-del">JUMLAH_KELUAR</th>
                        <th class="bg-del">SUPPLIER</th>
                        <th class="bg-del">TGL_KIRIM</th>
                        <th class="bg-del">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
            </table>
        </div>
    </div>

    <table class="mt-0">
        <tr class="bg-footer text-center">
            <td style="width: 25%;">TOTAL SUPPLIER: <span id="total-supp-qty">0</span></td>
            <td style="width: 25%;">TOTAL CUSTOMER: <span id="total-cust-qty">0</span></td>
            <td style="width: 25%;">TOTAL DELIVERI: <span id="total-del">0</span></td>
            <td style="width: 25%;">TOTAL SISA: <span id="total-sisa">0</span></td>
        </tr>
    </table>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = JSON.parse(localStorage.getItem('monitoring_supp')) || [{ po: '', tgl: '', nopo: '', tujuan: '', qtyOrig: 0 }];
        let dataCust = JSON.parse(localStorage.getItem('monitoring_cust')) || [{ name: '', tgl: '', nopo: '', qty: 0, cust_extra: '', del: 0, supp: '', tglKirim: '' }];

        async function autoFetchSupabaseData() {
            try {
                // LOGIKA PEMBATASAN TANGGAL: Tanggal 1 sampai Akhir Bulan Ini
                const now = new Date();
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59).toISOString();

                const { data, error } = await _supabase
                    .from('data_pengiriman')
                    .select('*')
                    .gte('tanggal', firstDay)
                    .lte('tanggal', lastDay);

                if (error) throw error;

                if (data) {
                    data.forEach(row => {
                        const tglKirimFormatted = formatDate(row.tanggal);
                        
                        const isExist = dataCust.some(c => 
                            c.nopo === row.no_po && 
                            c.tglKirim === tglKirimFormatted && 
                            c.del === (row.jumlah_keluar || 0)
                        );

                        if (!isExist) {
                            dataCust.push({
                                name: '', 
                                tgl: '', 
                                nopo: row.no_po || '',
                                qty: 0, 
                                cust_extra: row.delivery_to || '', 
                                del: row.jumlah_keluar || 0,
                                supp: row.supplier || '',
                                tglKirim: tglKirimFormatted
                            });
                        }
                    });
                    renderCust();
                }
            } catch (e) {
                console.error("Gagal sinkronisasi data:", e.message);
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }

        function renderSupp() {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            dataSupp.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">
                        <span class="btn-action" onclick="addSupp(${index})">+</span>
                        <span class="btn-action" onclick="remSupp(${index})">-</span>
                    </td>
                    <td class="text-center">${index + 1}</td>
                    <td><input type="text" value="${item.po}" oninput="dataSupp[${index}].po=this.value"></td>
                    <td><input type="text" value="${item.tgl}" oninput="dataSupp[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="text" value="${item.tujuan}" oninput="dataSupp[${index}].tujuan=this.value; calculate();"></td>
                    <td><input type="number" id="qty-supp-input-${index}" value="${item.qtyOrig}" oninput="dataSupp[${index}].qtyOrig=this.value; calculate();" class="font-bold text-blue-700"></td>
                `;
                body.appendChild(tr);
            });
        }

        function renderCust() {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            dataCust.forEach((item, index) => {
                const tr = document.createElement('tr');
                let sisa = (parseFloat(item.qty) || 0) - (parseFloat(item.del) || 0);
                if(sisa > 0 && item.nopo) tr.classList.add('carry-over');

                tr.innerHTML = `
                    <td class="text-center">
                        <span class="btn-action" onclick="addCust(${index})">+</span>
                        <span class="btn-action" onclick="remCust(${index})">-</span>
                    </td>
                    <td class="text-center">${index + 1}</td>
                    <td><input type="text" value="${item.name || ''}" oninput="dataCust[${index}].name=this.value"></td>
                    <td><input type="text" value="${item.tgl || ''}" oninput="dataCust[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo || ''}" oninput="dataCust[${index}].nopo=this.value; calculate();"></td>
                    <td><input type="number" value="${item.qty || 0}" oninput="dataCust[${index}].qty=this.value; calculate();"></td>
                    <td class="bg-orange-50"><input type="text" value="${item.cust_extra || ''}" oninput="dataCust[${index}].cust_extra=this.value"></td>
                    <td><input type="number" value="${item.del || 0}" oninput="dataCust[${index}].del=this.value; calculate();"></td>
                    <td><input type="text" value="${item.supp || ''}" oninput="dataCust[${index}].supp=this.value; calculate();"></td>
                    <td><input type="text" value="${item.tglKirim || ''}" oninput="dataCust[${index}].tglKirim=this.value"></td>
                    <td class="text-center font-bold">${sisa}</td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function calculate() {
            let delPool = {}; 
            dataCust.forEach(c => {
                if(c.supp) {
                    let sName = c.supp.trim().toUpperCase();
                    delPool[sName] = (delPool[sName] || 0) + (parseFloat(c.del) || 0);
                }
            });

            let totalS = 0;
            let tempPool = {...delPool};

            dataSupp.forEach((s, i) => {
                let sTujuan = s.tujuan ? s.tujuan.trim().toUpperCase() : "";
                let qtyOrig = parseFloat(s.qtyOrig) || 0;
                let finalQtyDisplay = qtyOrig;

                if (sTujuan && tempPool[sTujuan] > 0) {
                    if (tempPool[sTujuan] >= qtyOrig) { 
                        finalQtyDisplay = 0; 
                        tempPool[sTujuan] -= qtyOrig; 
                    } else { 
                        finalQtyDisplay = qtyOrig - tempPool[sTujuan]; 
                        tempPool[sTujuan] = 0; 
                    }
                }
                
                totalS += finalQtyDisplay;
                let el = document.getElementById(`qty-supp-input-${i}`);
                if (el && document.activeElement !== el) el.value = finalQtyDisplay;
            });

            let totalC = 0, totalD = 0;
            dataCust.forEach(item => {
                totalC += (parseFloat(item.qty) || 0);
                totalD += (parseFloat(item.del) || 0);
            });

            document.getElementById('total-supp-qty').innerText = totalS;
            document.getElementById('total-cust-qty').innerText = totalC;
            document.getElementById('total-del').innerText = totalD;
            document.getElementById('total-sisa').innerText = totalC - totalD;
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {po:'', tgl:'', nopo:'', tujuan:'', qtyOrig:0}); renderSupp(); calculate(); }
        function remSupp(i) { if(dataSupp.length > 1) { dataSupp.splice(i,1); renderSupp(); calculate(); } }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0, cust_extra: '', del:0, supp:'', tglKirim:''}); renderCust(); }
        function remCust(i) { if(dataCust.length > 1) { dataCust.splice(i,1); renderCust(); calculate(); } }

        async function saveData() {
            localStorage.setItem('monitoring_supp', JSON.stringify(dataSupp));
            localStorage.setItem('monitoring_cust', JSON.stringify(dataCust));
            alert("Data Berhasil disimpan secara Lokal!");
        }

        window.onload = () => { 
            renderSupp(); 
            renderCust(); 
            autoFetchSupabaseData();
            setInterval(autoFetchSupabaseData, 30000); 
        };
    </script>
</body>
</html>
