<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PURCHASE ORDER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8fafc; padding: 10px; color: #1e293b; }
        
        .header-banner { 
            background-color: #0f172a; color: white; padding: 10px; text-align: center; 
            font-weight: bold; font-size: 16px; border-radius: 4px; margin-bottom: 10px; 
            border-bottom: 3px solid #10b981; text-transform: uppercase;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; border: 1px solid #cbd5e1; }
        th { 
            background-color: #064e3b; color: white; border: 1px solid #94a3b8; 
            padding: 6px 2px; font-size: 9px; text-transform: uppercase; font-weight: 800; 
        }
        td { border: 1px solid #cbd5e1; padding: 0; font-size: 10px; height: 28px; vertical-align: middle; }
        
        input { 
            width: 100%; border: none; background: transparent; text-align: center; 
            outline: none; font-size: 10px; height: 100%; color: #000; font-weight: 500; 
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .bg-footer-dark { background-color: #064e3b; color: white; font-weight: bold; text-align: center; }
        .section-label { font-weight: bold; font-size: 11px; margin-bottom: 4px; }
        .text-red-label { color: #dc2626; }
        .text-blue-label { color: #2563eb; }

        .btn-action { cursor: pointer; font-size: 14px; font-weight: bold; color: #10b981; border: none; background: none; width: 100%; height: 100%; }
        .action-container { position: fixed; top: 15px; right: 20px; display: flex; gap: 6px; z-index: 100; }
        .btn-ui { padding: 5px 12px; font-size: 10px; font-weight: 600; cursor: pointer; border-radius: 4px; background: white; border: 1px solid #cbd5e1; }

        @media print { .action-container, .pdf-hide { display: none !important; } }
    </style>
</head>
<body>

    <div class="action-container">
        <button class="btn-ui" onclick="location.reload()">REFRESH</button>
        <button class="btn-ui" style="background:#10b981; color:white; border:none;" onclick="saveData()">SAVE CLOUD</button>
        <button class="btn-ui" onclick="window.print()">PRINT</button>
    </div>

    <div class="header-banner"> MONITORING PURCHASE ORDER </div>
    
    <div class="flex gap-2 items-start">
        
        <!-- KOLOM 1: INBOUND SUPPLIER -->
        <div class="w-[30%]">
            <div class="section-label text-red-label">INBOUND SUPPLIAE</div>
            <table id="table-supp">
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 25px;">±</th>
                        <th style="width: 45px;">PT</th>
                        <th style="width: 85px;">TGL PO</th>
                        <th>NOMOR PO</th>
                        <th style="width: 60px;">INU</th> <!-- Lebar INU ditambah -->
                        <th style="width: 35px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td colspan="5" class="text-right pr-2">JUMLAH</td>
                        <td id="total-supp-qty">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- KOLOM 2: PURCHASE ORDER -->
        <div class="w-[30%]">
            <div class="section-label text-blue-label">PURCHASE ORDER</div>
            <table id="table-cust">
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 25px;">±</th>
                        <th>CUSTOMER</th>
                        <th style="width: 85px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 35px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td colspan="4" class="text-right pr-2">JUMLAH</td>
                        <td id="total-cust-qty">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- KOLOM 3: OUTBOUND -->
        <div class="w-[40%]">
            <div class="section-label text-blue-label flex justify-between">
                <span>OUT BOUND</span>
                <span id="current-period" style="font-size: 9px; font-weight: normal;"></span>
            </div>
            <table id="table-out">
                <thead>
                    <tr>
                        <th style="width: 155px;">TUJUAN (AUTO)</th> <!-- Lebar TUJUAN ditambah -->
                        <th style="width: 35px;">OUT</th>
                        <th>SUPPLIER</th>
                        <th style="width: 75px;">TGLL KIRIM</th>
                    </tr>
                </thead>
                <tbody id="body-out"></tbody>
                <tfoot>
                    <tr class="bg-footer-dark">
                        <td id="total-del">0</td>
                        <td colspan="3"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [{ pt: 'IDE', tgl: '', nopo: '001/PO-IDE/V/2026', inu: 'SSS', qtyOrig: 30 }];
        let dataCust = [{ name: 'NWB', tgl: '', nopo: '003/NWB-PO/V/2026', qty: 10 }];
        let dataOut = [];

        function formatDateInput(e, type, index, field) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 4) {
                let day = val.substring(0, 2);
                let month = val.substring(2, 4);
                let year = val.length >= 8 ? val.substring(4, 8) : new Date().getFullYear();
                let formatted = `${day}/${month}/${year}`;
                e.target.value = formatted;
                if(type === 'supp') dataSupp[index][field] = formatted;
                else dataCust[index][field] = formatted;
            }
        }

        async function fetchOutbound() {
            const now = new Date();
            const firstDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
            const lastDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${new Date(now.getFullYear(), now.getMonth()+1, 0).getDate()}`;
            document.getElementById('current-period').innerText = `periode :${firstDay} s/d ${lastDay}`;

            try {
                const { data } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', firstDay).lte('tanggal', lastDay);
                if (data) {
                    dataOut = data.map(row => ({
                        tujuan: row.delivery_to || '',
                        out: parseFloat(row.jumlah_keluar) || 0,
                        supp: row.supplier || '',
                        tgl: row.tanggal ? row.tanggal.split('-').reverse().join('/') : ''
                    }));
                    renderAll();
                }
            } catch (e) { console.error(e); }
        }

        function renderAll() {
            const maxRows = Math.max(dataOut.length, 12);
            renderSupp(maxRows);
            renderCust(maxRows);
            renderOut(maxRows);
            calculate();
        }

        function renderSupp(max) {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataSupp[i] || { pt: '', tgl: '', nopo: '', inu: '', qtyOrig: '' };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pdf-hide text-center"><button class="btn-action" onclick="addSupp(${i})">±</button></td>
                    <td><input type="text" value="${item.pt}" oninput="updateSupp(${i}, 'pt', this.value)"></td>
                    <td><input type="text" placeholder="dd/mm/yyyy" value="${item.tgl}" onkeyup="formatDateInput(event, 'supp', ${i}, 'tgl')" oninput="updateSupp(${i}, 'tgl', this.value)"></td>
                    <td><input type="text" value="${item.nopo}" oninput="updateSupp(${i}, 'nopo', this.value)"></td>
                    <td><input type="text" value="${item.inu}" oninput="updateSupp(${i}, 'inu', this.value)"></td>
                    <td><input type="number" id="sisa-supp-${i}" value="${item.qtyOrig}" class="font-bold"></td>
                `;
                body.appendChild(tr);
            }
        }

        function renderCust(max) {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataCust[i] || { name: '', tgl: '', nopo: '', qty: '' };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pdf-hide text-center"><button class="btn-action" onclick="addCust(${i})">±</button></td>
                    <td><input type="text" value="${item.name}" oninput="updateCust(${i}, 'name', this.value)"></td>
                    <td><input type="text" placeholder="dd/mm/yyyy" value="${item.tgl}" onkeyup="formatDateInput(event, 'cust', ${i}, 'tgl')" oninput="updateCust(${i}, 'tgl', this.value)"></td>
                    <td><input type="text" value="${item.nopo}" oninput="updateCust(${i}, 'nopo', this.value)"></td>
                    <td><input type="number" value="${item.qty}" oninput="updateCust(${i}, 'qty', this.value)"></td>
                `;
                body.appendChild(tr);
            }
        }

        function renderOut(max) {
            const body = document.getElementById('body-out');
            body.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const item = dataOut[i] || { tujuan: '', out: '', supp: '', tgl: '' };
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${item.tujuan}" readonly style="text-align: left; padding-left: 5px;"></td>
                    <td><input type="text" value="${item.out}" readonly></td>
                    <td><input type="text" value="${item.supp}" readonly></td>
                    <td><input type="text" value="${item.tgl}" readonly style="font-size: 9px;"></td>
                `;
                body.appendChild(tr);
            }
        }

        function updateSupp(i, field, val) { if(!dataSupp[i]) dataSupp[i] = {}; dataSupp[i][field] = val; calculate(); }
        function updateCust(i, field, val) { if(!dataCust[i]) dataCust[i] = {}; dataCust[i][field] = val; calculate(); }

        function calculate() {
            let totalOut = 0;
            let outBySupp = {};
            dataOut.forEach(o => {
                totalOut += (parseFloat(o.out) || 0);
                let key = o.supp.toUpperCase();
                outBySupp[key] = (outBySupp[key] || 0) + (parseFloat(o.out) || 0);
            });
            let totalSuppSisa = 0;
            dataSupp.forEach((s, i) => {
                let key = s.inu ? s.inu.toUpperCase() : "";
                let sisa = (parseFloat(s.qtyOrig) || 0) - (outBySupp[key] || 0);
                const el = document.getElementById(`sisa-supp-${i}`);
                if(el) el.value = sisa < 0 ? 0 : sisa;
                if(sisa > 0) totalSuppSisa += sisa;
            });
            let totalCust = dataCust.reduce((acc, curr) => acc + (parseFloat(curr.qty) || 0), 0);
            document.getElementById('total-supp-qty').innerText = totalSuppSisa;
            document.getElementById('total-cust-qty').innerText = totalCust;
            document.getElementById('total-del').innerText = totalOut;
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {pt:'', tgl:'', nopo:'', inu:'', qtyOrig:0}); renderAll(); }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0}); renderAll(); }

        window.onload = fetchOutbound;
    </script>
</body>
</html>
