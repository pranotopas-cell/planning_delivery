<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring PO Logistics - Fresh Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; padding: 10px; }
        .header-banner { background-color: #1d3557; color: white; padding: 8px; text-align: center; font-weight: bold; font-size: 16px; border: 1px solid #000; margin-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; background-color: white; }
        th { background-color: #92d050; border: 1px solid #000; padding: 4px; font-size: 9px; text-transform: uppercase; }
        td { border: 1px solid #000; padding: 0; font-size: 11px; height: 26px; }
        input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 11px; padding: 0 2px; }
        .bg-orange-light { background-color: #fff2cc; }
        .bg-del-header { background-color: #e69138; color: white; }
        .bg-footer { background-color: #d9e1f2; font-weight: bold; font-size: 11px; height: 35px; }
        .button-group { position: fixed; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 1000; }
        .btn-nav { padding: 5px 12px; border: 1px solid #333; font-size: 10px; font-weight: bold; cursor: pointer; color: white; border-radius: 3px; }
        .btn-save { background-color: #28a745; }
        @media print { .button-group, th:first-child, td:first-child { display: none !important; } }
    </style>
</head>
<body>

    <div class="button-group">
        <button class="btn-nav btn-save" onclick="fetchData()">REFRESH DATA</button>
        <button class="btn-nav btn-save" id="btn-save-data" style="background-color: #1a73e8;">SAVE CHANGES</button>
    </div>

    <div class="header-banner">MONITORING PURCHASE ORDER</div>
    
    <div class="flex gap-0 border border-black overflow-x-auto">
        <!-- PO SUPPLIER -->
        <div class="w-[35%] border-r border-black">
            <div class="bg-gray-100 p-1 font-bold text-[10px] border-b border-black text-center italic">PURCHASE ORDER SUPPLIER</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;">NO</th>
                        <th>PT</th>
                        <th style="width: 75px;">DATE</th>
                        <th>NUMBER</th>
                        <th>INU</th>
                        <th style="width: 60px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
            </table>
        </div>

        <!-- PO CUSTOMER -->
        <div class="w-[65%]">
            <div class="bg-gray-100 p-1 font-bold text-[10px] border-b border-black text-center italic">PURCHASE ORDER CUSTOMER</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30px;">NO</th>
                        <th>CUSTOMER</th>
                        <th style="width: 75px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 55px;">QTY</th>
                        <th class="bg-del-header" style="width: 45px;">KIRIM</th>
                        <th class="bg-del-header">ASAL</th>
                        <th class="bg-del-header">TUJUAN</th>
                        <th class="bg-del-header" style="width: 75px;">TGL</th>
                        <th class="bg-del-header" style="width: 55px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
            </table>
        </div>
    </div>

    <table>
        <tr class="bg-footer text-center">
            <td style="width: 25%;">TOTAL SUPPLIER: <span id="total-supp-qty">0</span></td>
            <td style="width: 25%;">TOTAL CUSTOMER: <span id="total-cust-qty">0</span></td>
            <td style="width: 25%;">TOTAL KIRIM: <span id="total-del">0</span></td>
            <td style="width: 25%;">TOTAL SISA: <span id="total-sisa">0</span></td>
        </tr>
    </table>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [];
        let dataCust = [];

        async function fetchData() {
            try {
                // CLEAR CACHE MEMORY TOTAL
                dataSupp = [];
                dataCust = [];

                // 1. Ambil PO Supplier
                const { data: resSupp } = await _supabase.from('purchase_orders').select('*');
                if (resSupp) dataSupp = resSupp.map(item => ({ po: item.po_code, tgl: item.tgl_po, nopo: item.no_po, tujuan: item.tujuan, qtyOrig: item.qty }));

                // 2. Ambil PO Customer
                const { data: resCust } = await _supabase.from('customer_po').select('*');
                if (resCust) {
                    dataCust = resCust.map(item => ({
                        name: item.delivery_to, tgl: item.po_date, nopo: item.number, qty: item.jumlah,
                        del: 0, supp: '', tujuanCust: '', tglKirim: ''
                    }));
                }

                // 3. Ambil Pengiriman FRESH (Hanya yang ada di tabel data_pengiriman)
                await syncPengiriman();

                renderAll();
            } catch (error) { console.error("Error:", error); }
        }

        async function syncPengiriman() {
            // Reset kolom orange di memori sebelum isi data baru
            dataCust.forEach(c => { c.del = 0; c.supp = ''; c.tujuanCust = ''; c.tglKirim = ''; });

            // Range Mei 2026
            const start = "2026-05-01T00:00:00Z";
            const end = "2026-05-31T23:59:59Z";

            const { data: kirimData } = await _supabase
                .from('data_pengiriman')
                .select('*')
                .gte('created_at', start)
                .lte('created_at', end)
                .order('created_at', { ascending: true });

            if (kirimData) {
                const filtered = kirimData.filter(item => {
                    const qty = parseFloat(item.jumlah_keluar) || 0;
                    const text = `${item.supplier} ${item.delivery_to}`.toLowerCase();
                    // FILTER KERAS: Qty harus > 0 & Bukan "PAN - TRANSPORT"
                    return qty > 0 && !text.includes('pan') && !text.includes('transport');
                });

                filtered.forEach((item, index) => {
                    // Pastikan baris tersedia di tabel Customer
                    if (!dataCust[index]) {
                        dataCust.push({ name: '', tgl: '', nopo: '', qty: 0, del: 0, supp: '', tujuanCust: '', tglKirim: '' });
                    }
                    dataCust[index].del = item.jumlah_keluar;
                    dataCust[index].supp = item.supplier;
                    dataCust[index].tujuanCust = item.delivery_to;
                    
                    const d = new Date(item.created_at);
                    dataCust[index].tglKirim = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
                });
            }
        }

        function renderAll() {
            const bSupp = document.getElementById('body-supp');
            const bCust = document.getElementById('body-cust');
            bSupp.innerHTML = ''; bCust.innerHTML = '';

            dataSupp.forEach((item, i) => {
                bSupp.innerHTML += `<tr><td class="text-center">${i+1}</td>
                <td><input type="text" value="${item.po||''}" oninput="dataSupp[${i}].po=this.value"></td>
                <td><input type="text" value="${item.tgl||''}" oninput="dataSupp[${i}].tgl=this.value"></td>
                <td><input type="text" value="${item.nopo||''}" oninput="dataSupp[${i}].nopo=this.value"></td>
                <td><input type="text" value="${item.tujuan||''}" oninput="dataSupp[${i}].tujuan=this.value"></td>
                <td class="bg-blue-50"><input type="number" value="${item.qtyOrig||0}" oninput="dataSupp[${i}].qtyOrig=this.value;calculate()"></td></tr>`;
            });

            dataCust.forEach((item, i) => {
                bCust.innerHTML += `<tr><td class="text-center">${i+1}</td>
                <td><input type="text" value="${item.name||''}" oninput="dataCust[${i}].name=this.value"></td>
                <td><input type="text" value="${item.tgl||''}" oninput="dataCust[${i}].tgl=this.value"></td>
                <td><input type="text" value="${item.nopo||''}" oninput="dataCust[${i}].nopo=this.value"></td>
                <td><input type="number" value="${item.qty||0}" oninput="dataCust[${i}].qty=this.value;calculate()"></td>
                <td class="bg-orange-light font-bold text-orange-700"><input type="number" value="${item.del||0}" readonly></td>
                <td class="bg-orange-light"><input type="text" value="${item.supp||''}" readonly></td>
                <td class="bg-orange-light"><input type="text" value="${item.tujuanCust||''}" readonly></td>
                <td class="bg-orange-light"><input type="text" value="${item.tglKirim||''}" readonly></td>
                <td class="bg-orange-light text-center font-bold" id="sisa-${i}">0</td></tr>`;
            });
            calculate();
        }

        function calculate() {
            let tS = 0, tC = 0, tD = 0;
            dataSupp.forEach(s => tS += parseFloat(s.qtyOrig)||0);
            dataCust.forEach((c, i) => {
                let q = parseFloat(c.qty)||0; let d = parseFloat(c.del)||0;
                let sisa = q - d;
                tC += q; tD += d;
                const el = document.getElementById(`sisa-${i}`);
                if(el) el.innerText = sisa;
            });
            document.getElementById('total-supp-qty').innerText = tS;
            document.getElementById('total-cust-qty').innerText = tC;
            document.getElementById('total-del').innerText = tD;
            document.getElementById('total-sisa').innerText = tC - tD;
        }

        window.onload = fetchData;
    </script>
</body>
</html>
