<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PO - FIXED SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #0f172a;
            --green: #064e3b;
            --gold: #a16207;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0;
            padding-top: 60px;
            font-size: 10px;
        }

        .fixed-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-banner { 
            background: linear-gradient(to right, var(--navy), var(--green)); 
            color: white; 
            padding: 10px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }

        .title-text {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-buttons { display: flex; gap: 8px; }

        .btn-ui { 
            padding: 5px 12px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; 
            background: white; border: 1px solid #cbd5e1; color: var(--navy); transition: 0.2s;
        }
        .btn-ui:hover { background: #f8fafc; }
        .btn-save { background: #16a34a !important; color: white !important; border: none !important; }

        .main-container { padding: 10px; display: flex; gap: 10px; align-items: start; }
        
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th { 
            background-color: var(--navy); color: #fef3c7; 
            border: 1px solid #334155; padding: 5px 2px; font-size: 9px; 
        }
        td { border: 1px solid #e2e8f0; padding: 0; height: 26px; }
        
        input { 
            width: 100%; border: none; background: transparent; text-align: center; 
            outline: none; font-size: 10px; height: 100%; font-weight: 500;
        }
        input:focus { background-color: #fffbeb; }

        .section-label { 
            font-weight: 800; font-size: 10px; margin-bottom: 6px; 
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
        }
        .dot { height: 10px; width: 10px; border-radius: 2px; }

        .bg-footer { background-color: var(--navy); color: white; font-weight: bold; }

        .btn-action { width: 18px; height: 18px; line-height: 1; font-size: 14px; cursor: pointer; border: none; background: none; }

        @media print { 
            .fixed-header, .nav-buttons, .pdf-hide { display: none !important; } 
            body { padding-top: 0; }
        }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="header-banner">
            <div class="title-text">Monitoring PO Global - Integrated System</div>
            <div class="nav-buttons">
                <button class="btn-ui" onclick="window.location.href='index.html'">HOME</button>
                <button class="btn-ui btn-save" onclick="saveToCloud()">SAVE TO CLOUD</button>
                <button class="btn-ui" onclick="window.print()">PRINT / PDF</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <!-- SEKSI 1: INBOUND -->
        <div class="w-[32%]">
            <div class="section-label text-red-700"><span class="dot bg-red-600"></span> 1. INBOUND SUPPLIER (KSE/IDE)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 35px;">+/-</th>
                        <th style="width: 35px;">UNIT</th>
                        <th style="width: 70px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 55px;">INU</th>
                        <th style="width: 45px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="5" class="text-right pr-2 py-1">TOTAL INBOUND</td>
                        <td id="total-supp-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- SEKSI 2: CUSTOMER -->
        <div class="w-[32%]">
            <div class="section-label text-green-700"><span class="dot bg-green-600"></span> 2. PO CUSTOMER (IN)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 35px;">+/-</th>
                        <th>CUSTOMER NAME</th>
                        <th style="width: 70px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 45px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="4" class="text-right pr-2 py-1">TOTAL PO</td>
                        <td id="total-cust-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- SEKSI 3: REALISASI -->
        <div class="w-[36%]">
            <div class="section-label text-blue-700"><span class="dot bg-blue-600"></span> 3. REALISASI LOGISTIK (MEI 2026)</div>
            <table>
                <thead>
                    <tr>
                        <th>TUJUAN</th>
                        <th style="width: 35px;">OUT</th>
                        <th>SUPPLIER</th>
                        <th style="width: 70px;">TANGGAL</th>
                    </tr>
                </thead>
                <tbody id="body-out"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td class="text-right pr-2 py-1">TOTAL OUT</td>
                        <td id="total-del" class="text-center">0</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [];
        let dataCust = [];
        let dataOut = [];

        // Fungsi pembantu format tanggal dd/mm -> dd/mm/26
        function autoFormatDate(val) {
            if (!val) return "";
            let clean = val.replace(/[^0-9/]/g, "");
            let parts = clean.split("/");
            if (parts.length === 2 && parts[1].length === 2) {
                return parts[0] + "/" + parts[1] + "/26";
            }
            return clean;
        }

        async function loadInitialData() {
            try {
                const start = "2026-05-01";
                const end = "2026-05-31";

                const [resSupp, resCust, resLog] = await Promise.all([
                    _client.from('purchase_orders').select('*').order('id', { ascending: true }),
                    _client.from('customer_po').select('*').order('id', { ascending: true }),
                    _client.from('data_pengiriman')
                           .select('*')
                           .gte('tanggal', start)
                           .lte('tanggal', end)
                           .order('tanggal', { ascending: true })
                ]);

                dataSupp = (resSupp.data || []).map(d => ({ 
                    unit: d.po_code || '', tgl: d.tgl_po || '', nopo: d.no_po || '', inu: d.tujuan || '', qty: parseFloat(d.qty) || 0 
                }));

                dataCust = (resCust.data || []).map(d => ({ 
                    name: d.delivery_to || '', tgl: d.po_date || '', nopo: d.number || '', qty: parseFloat(d.jumlah) || 0 
                }));

                dataOut = (resLog.data || []).filter(d => {
                    const s = (d.supplier || '').toLowerCase();
                    return !s.includes('petro') && !s.includes('pan') && !s.includes('transport');
                }).map(d => ({ 
                    tujuan: d.delivery_to || '', out: parseFloat(d.jumlah_keluar) || 0, supp: d.supplier || '', tgl: d.tanggal || '' 
                }));

                processAutoStockReduction();

                if(dataSupp.length < 15) while(dataSupp.length < 15) dataSupp.push({unit:'', tgl:'', nopo:'', inu:'', qty:0});
                if(dataCust.length < 15) while(dataCust.length < 15) dataCust.push({name:'', tgl:'', nopo:'', qty:0});

                renderTable();
            } catch (err) { console.error("Error:", err); }
        }

        function processAutoStockReduction() {
            const usageMap = {};
            dataOut.forEach(out => {
                const key = (out.supp || '').toLowerCase().trim();
                usageMap[key] = (usageMap[key] || 0) + out.out;
            });
            dataSupp.forEach(item => {
                const inuKey = (item.inu || '').toLowerCase().trim();
                if (usageMap[inuKey] > 0 && item.qty > 0) {
                    const reduction = Math.min(item.qty, usageMap[inuKey]);
                    item.qty -= reduction;
                    usageMap[inuKey] -= reduction;
                }
            });
        }

        function renderTable() {
            const bSupp = document.getElementById('body-supp');
            bSupp.innerHTML = '';
            dataSupp.forEach((item, i) => {
                bSupp.innerHTML += `<tr>
                    <td class="pdf-hide text-center flex justify-center items-center gap-1 h-full">
                        <button class="btn-action text-blue-600 font-bold" onclick="addRow('supp', ${i})">+</button>
                        <button class="btn-action text-red-500 font-bold" onclick="removeRow('supp', ${i})">-</button>
                    </td>
                    <td><input type="text" value="${item.unit}" oninput="dataSupp[${i}].unit=this.value"></td>
                    <td><input type="text" value="${item.tgl}" onblur="this.value=autoFormatDate(this.value); dataSupp[${i}].tgl=this.value" oninput="dataSupp[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${i}].nopo=this.value"></td>
                    <td><input type="text" value="${item.inu}" oninput="dataSupp[${i}].inu=this.value"></td>
                    <td><input type="number" value="${item.qty || ''}" oninput="dataSupp[${i}].qty=this.value; calculateTotal();"></td>
                </tr>`;
            });

            const bCust = document.getElementById('body-cust');
            bCust.innerHTML = '';
            dataCust.forEach((item, i) => {
                bCust.innerHTML += `<tr>
                    <td class="pdf-hide text-center flex justify-center items-center gap-1 h-full">
                        <button class="btn-action text-green-600 font-bold" onclick="addRow('cust', ${i})">+</button>
                        <button class="btn-action text-red-500 font-bold" onclick="removeRow('cust', ${i})">-</button>
                    </td>
                    <td><input type="text" value="${item.name}" oninput="dataCust[${i}].name=this.value"></td>
                    <td><input type="text" value="${item.tgl}" onblur="this.value=autoFormatDate(this.value); dataCust[${i}].tgl=this.value" oninput="dataCust[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataCust[${i}].nopo=this.value"></td>
                    <td><input type="number" value="${item.qty || ''}" oninput="dataCust[${i}].qty=this.value; calculateTotal();"></td>
                </tr>`;
            });

            const bOut = document.getElementById('body-out');
            bOut.innerHTML = '';
            const displayRows = Math.max(dataSupp.length, dataOut.length, dataCust.length);
            for(let i=0; i < displayRows; i++) {
                const item = dataOut[i] || {tujuan:'', out:'', supp:'', tgl:''};
                bOut.innerHTML += `<tr class="${item.out ? 'bg-blue-50' : ''}">
                    <td><input type="text" value="${item.tujuan}" readonly></td>
                    <td><input type="text" value="${item.out || ''}" readonly class="font-bold text-blue-700"></td>
                    <td><input type="text" value="${item.supp}" readonly></td>
                    <td><input type="text" value="${item.tgl}" readonly style="font-size:8px; color: #64748b;"></td>
                </tr>`;
            }
            calculateTotal();
        }

        function calculateTotal() {
            let s=0, c=0, o=0;
            dataSupp.forEach(i => s += parseFloat(i.qty) || 0);
            dataCust.forEach(i => c += parseFloat(i.qty) || 0);
            dataOut.forEach(i => o += parseFloat(i.out) || 0);
            document.getElementById('total-supp-qty').innerText = s.toLocaleString('id-ID');
            document.getElementById('total-cust-qty').innerText = c.toLocaleString('id-ID');
            document.getElementById('total-del').innerText = o.toLocaleString('id-ID');
        }

        function addRow(type, idx) {
            if(type==='supp') dataSupp.splice(idx+1, 0, {unit:'', tgl:'', nopo:'', inu:'', qty:0});
            else dataCust.splice(idx+1, 0, {name:'', tgl:'', nopo:'', qty:0});
            renderTable();
        }

        function removeRow(type, idx) {
            if(type==='supp') {
                if(dataSupp.length > 1) dataSupp.splice(idx, 1);
            } else {
                if(dataCust.length > 1) dataCust.splice(idx, 1);
            }
            renderTable();
        }

        async function saveToCloud() {
            const btn = document.querySelector('.btn-save');
            const originalText = btn.innerText;
            try {
                btn.innerText = "SAVING...";
                btn.disabled = true;

                // Filter data yang benar-benar diisi saja
                const s = dataSupp.filter(x => x.unit || x.nopo || x.qty > 0).map(x => ({ 
                    po_code: x.unit, 
                    tgl_po: x.tgl, 
                    no_po: x.nopo, 
                    tujuan: x.inu, 
                    qty: parseFloat(x.qty) || 0 
                }));

                const c = dataCust.filter(x => x.name || x.nopo || x.qty > 0).map(x => ({ 
                    delivery_to: x.name, 
                    po_date: x.tgl, 
                    number: x.nopo, 
                    jumlah: parseFloat(x.qty) || 0 
                }));

                // Gunakan rpc atau hapus-lalu-tambah dalam satu urutan yang jelas
                await _client.from('purchase_orders').delete().filter('id', 'gt', 0);
                await _client.from('customer_po').delete().filter('id', 'gt', 0);

                if (s.length > 0) {
                    const { error: errS } = await _client.from('purchase_orders').insert(s);
                    if (errS) throw errS;
                }

                if (c.length > 0) {
                    const { error: errC } = await _client.from('customer_po').insert(c);
                    if (errC) throw errC;
                }

                alert("Sinkronisasi Berhasil!");
                location.reload();
            } catch (err) { 
                console.error(err);
                alert("Error Simpan: " + err.message); 
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        window.onload = loadInitialData;
    </script>
</body>
</html>
