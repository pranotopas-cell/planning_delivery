<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring PO Logistics - Fixed Data Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; padding: 10px; }
        .header-banner { background-color: #1d3557; color: white; padding: 8px; text-align: center; font-weight: bold; font-size: 16px; border: 1px solid #000; margin-bottom: 2px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; background-color: white; }
        th { background-color: #92d050; border: 1px solid #000; padding: 4px; font-size: 9px; text-transform: uppercase; }
        td { border: 1px solid #000; padding: 0; font-size: 11px; height: 26px; }
        input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; outline: none; font-size: 11px; padding: 0 2px; }
        input:focus { background-color: #e8f0fe; }
        .action-cell { display: flex; justify-content: center; align-items: center; gap: 2px; height: 100%; background-color: #f9f9f9; }
        .btn-mini { cursor: pointer; display: inline-block; width: 15px; height: 15px; line-height: 13px; text-align: center; border: 1px solid #aaa; background: #fff; font-size: 11px; font-weight: bold; color: #333; border-radius: 2px; }
        .bg-orange-light { background-color: #fff2cc; }
        .bg-del-header { background-color: #e69138; color: white; }
        .bg-footer { background-color: #d9e1f2; font-weight: bold; font-size: 11px; height: 35px; }
        .button-group { position: fixed; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 1000; }
        .btn-nav { padding: 6px 15px; border: 1px solid #333; font-size: 10px; font-weight: bold; cursor: pointer; color: white; border-radius: 3px; }
        .btn-save { background-color: #28a745; }
        .btn-pdf { background-color: #dc3545; }
        @media print { .button-group, .action-cell, th:first-child, td:first-child { display: none !important; } }
    </style>
</head>
<body>

    <div class="button-group">
        <button class="btn-nav btn-pdf" onclick="downloadPDF()">PDF</button>
        <button class="btn-nav btn-save" id="btn-save-data">SAVE TO CLOUD</button>
    </div>

    <div class="header-banner">MONITORING PURCHASE ORDER (FIXED MANUAL MODE)</div>
    
    <div class="flex gap-0 border border-black overflow-x-auto">
        <!-- PO SUPPLIER -->
        <div class="w-[35%] border-r border-black">
            <div class="bg-gray-100 p-1 font-bold text-[10px] border-b border-black text-center italic">PURCHASE ORDER SUPPLIER</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">ACT</th>
                        <th style="width: 30px;">NO</th>
                        <th>PT</th>
                        <th style="width: 75px;">DATE</th>
                        <th>NUMBER</th>
                        <th>INU</th>
                        <th style="width: 60px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
            </table>
        </div>

        <!-- PO CUSTOMER -->
        <div class="w-[65%]">
            <div class="bg-gray-100 p-1 font-bold text-[10px] border-b border-black text-center italic">PURCHASE ORDER CUSTOMER</div>
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;">ACT</th>
                        <th style="width: 30px;">NO</th>
                        <th>CUSTOMER</th>
                        <th style="width: 75px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 55px;">QTY</th>
                        <th class="bg-del-header" style="width: 45px;">KIRIM</th>
                        <th class="bg-del-header">ASAL</th>
                        <th class="bg-del-header">TUJUAN</th>
                        <th class="bg-del-header" style="width: 75px;">TGL</th>
                        <th class="bg-del-header" style="width: 55px;">SISA</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
            </table>
        </div>
    </div>

    <table class="border-t-0">
        <tr class="bg-footer text-center">
            <td style="width: 25%;">TOTAL SUPPLIER: <span id="total-supp-qty">0</span></td>
            <td style="width: 25%;">TOTAL CUSTOMER: <span id="total-cust-qty">0</span></td>
            <td style="width: 25%;">TOTAL KIRIM: <span id="total-del">0</span></td>
            <td style="width: 25%;">TOTAL SISA: <span id="total-sisa">0</span></td>
        </tr>
    </table>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [];
        let dataCust = [];

        // Data dari Gambar (Hanya sebagai fallback jika cloud kosong)
        const staticData = [
            { nopo: '9743', tgl: '2026-05-04', name: 'BORNEO TRENGGINA', tujuanCust: 'BTM SEMANGG', del: 0 },
            { nopo: '9742', tgl: '2026-05-03', name: 'OCEAN', tujuanCust: 'EMPTY', del: 0 },
            { nopo: '9740', tgl: '2026-05-02', name: 'NEW WAHYU BAROK', tujuanCust: 'NWB SEMANGG', del: 10 },
            { nopo: '9739', tgl: '2026-05-02', name: 'BORNEO TRENGGINA', tujuanCust: 'BTM SEMANGG', del: 5 },
            { nopo: '9738', tgl: '2026-05-02', name: 'GERBANG PERKASA', tujuanCust: 'GPP ATAS', del: 5 },
            { nopo: '9737', tgl: '2026-05-02', name: 'GERBANG PERKASA', tujuanCust: 'GPP ATAS', del: 5 },
            { nopo: '9736', tgl: '2026-05-02', name: 'QSD INDONESIA-kse', tujuanCust: 'PANGKUT', del: 5 },
            { nopo: '9735', tgl: '2026-05-02', name: 'HARAPAN SAWIT LE', tujuanCust: 'BAGAN KUSIK', del: 5 },
            { nopo: '9741', tgl: '2026-05-02', name: 'HARAPAN SAWIT LE', tujuanCust: 'KEBANTENG.E', del: 5 }
        ];

        async function fetchData() {
            try {
                // 1. Ambil data dari Cloud (purchase_orders)
                const { data: resSupp } = await _supabase.from('purchase_orders').select('*');
                dataSupp = resSupp && resSupp.length > 0 ? resSupp.map(i => ({ po: i.po_code, tgl: i.tgl_po, nopo: i.no_po, tujuan: i.tujuan, qtyOrig: i.qty })) : [{po:'', tgl:'', nopo:'', tujuan:'', qtyOrig:0}];

                // 2. Ambil data dari Cloud (customer_po)
                const { data: resCust } = await _supabase.from('customer_po').select('*');
                
                if (resCust && resCust.length > 0) {
                    dataCust = resCust.map(i => ({ 
                        name: i.delivery_to, tgl: i.po_date, nopo: i.number, qty: i.jumlah,
                        del: i.kirim_manual || 0, supp: i.asal_manual || '', tujuanCust: i.tujuan_manual || '', tglKirim: i.tgl_kirim_manual || ''
                    }));
                } else {
                    // Jika cloud kosong, gunakan data dari gambar tadi
                    dataCust = staticData.map(i => ({
                        name: i.name, tgl: i.tgl, nopo: i.nopo, qty: 0, del: i.del, supp: '', tujuanCust: i.tujuanCust, tglKirim: ''
                    }));
                }

                renderSupp();
                renderCust();
            } catch (e) { console.error(e); }
        }

        function renderSupp() {
            const body = document.getElementById('body-supp');
            body.innerHTML = '';
            dataSupp.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="action-cell"><span class="btn-mini" onclick="addSupp(${index})">+</span><span class="btn-mini" onclick="remSupp(${index})">-</span></div></td>
                    <td class="text-center bg-gray-50">${index + 1}</td>
                    <td><input type="text" value="${item.po||''}" oninput="dataSupp[${index}].po=this.value"></td>
                    <td><input type="text" value="${item.tgl||''}" oninput="dataSupp[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo||''}" oninput="dataSupp[${index}].nopo=this.value"></td>
                    <td><input type="text" value="${item.tujuan||''}" oninput="dataSupp[${index}].tujuan=this.value"></td>
                    <td class="bg-blue-50 font-bold"><input type="number" value="${item.qtyOrig||0}" oninput="dataSupp[${index}].qtyOrig=this.value;calculate()"></td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function renderCust() {
            const body = document.getElementById('body-cust');
            body.innerHTML = '';
            dataCust.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="action-cell"><span class="btn-mini" onclick="addCust(${index})">+</span><span class="btn-mini" onclick="remCust(${index})">-</span></div></td>
                    <td class="text-center bg-gray-50">${index + 1}</td>
                    <td><input type="text" value="${item.name||''}" oninput="dataCust[${index}].name=this.value"></td>
                    <td><input type="text" value="${item.tgl||''}" oninput="dataCust[${index}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo||''}" oninput="dataCust[${index}].nopo=this.value"></td>
                    <td><input type="number" value="${item.qty||0}" oninput="dataCust[${index}].qty=this.value;calculate()"></td>
                    <td class="bg-orange-light font-bold"><input type="number" value="${item.del||0}" oninput="dataCust[${index}].del=this.value;calculate()"></td>
                    <td class="bg-orange-light"><input type="text" value="${item.supp||''}" oninput="dataCust[${index}].supp=this.value"></td>
                    <td class="bg-orange-light"><input type="text" value="${item.tujuanCust||''}" oninput="dataCust[${index}].tujuanCust=this.value"></td>
                    <td class="bg-orange-light"><input type="text" value="${item.tglKirim||''}" oninput="dataCust[${index}].tglKirim=this.value"></td>
                    <td class="bg-orange-light text-center font-bold" id="sisa-${index}">0</td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function calculate() {
            let tS = 0, tC = 0, tD = 0;
            dataSupp.forEach(s => tS += parseFloat(s.qtyOrig)||0);
            dataCust.forEach((c, i) => {
                let q = parseFloat(c.qty)||0; let d = parseFloat(c.del)||0;
                let sisa = q - d;
                tC += q; tD += d;
                const el = document.getElementById(`sisa-${i}`);
                if(el) el.innerText = sisa;
            });
            document.getElementById('total-supp-qty').innerText = tS;
            document.getElementById('total-cust-qty').innerText = tC;
            document.getElementById('total-del').innerText = tD;
            document.getElementById('total-sisa').innerText = tC - tD;
        }

        async function saveData() {
            const btn = document.getElementById('btn-save-data');
            btn.innerText = "SAVING..."; btn.disabled = true;
            try {
                await _supabase.from('purchase_orders').delete().not('no_po', 'is', null);
                const sSave = dataSupp.filter(s => s.nopo).map(s => ({ po_code: s.po, tgl_po: s.tgl, no_po: s.nopo, tujuan: s.tujuan, qty: parseFloat(s.qtyOrig)||0 }));
                if(sSave.length > 0) await _supabase.from('purchase_orders').insert(sSave);

                await _supabase.from('customer_po').delete().not('number', 'is', null);
                const cSave = dataCust.filter(c => c.nopo).map(c => ({
                    delivery_to: c.name, po_date: c.tgl, number: c.nopo, jumlah: parseFloat(c.qty)||0,
                    kirim_manual: parseFloat(c.del)||0, asal_manual: c.supp, tujuan_manual: c.tujuanCust, tgl_kirim_manual: c.tglKirim
                }));
                if(cSave.length > 0) await _supabase.from('customer_po').insert(cSave);

                alert("Data Berhasil Disimpan!");
            } catch (e) { alert("Gagal Simpan!"); }
            finally { btn.innerText = "SAVE TO CLOUD"; btn.disabled = false; }
        }

        function addSupp(i) { dataSupp.splice(i+1, 0, {po:'', tgl:'', nopo:'', tujuan:'', qtyOrig:0}); renderSupp(); }
        function remSupp(i) { if(dataSupp.length > 1) { dataSupp.splice(i,1); renderSupp(); } }
        function addCust(i) { dataCust.splice(i+1, 0, {name:'', tgl:'', nopo:'', qty:0, del:0, supp:'', tujuanCust:'', tglKirim:''}); renderCust(); }
        function remCust(i) { if(dataCust.length > 1) { dataCust.splice(i,1); renderCust(); } }
        function downloadPDF() { html2pdf().from(document.body).save('Monitoring_Logistics.pdf'); }

        window.onload = fetchData;
        document.getElementById('btn-save-data').addEventListener('click', saveData);
    </script>
</body>
</html>
