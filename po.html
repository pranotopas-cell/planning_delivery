<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PO - DEFICIT DETECTION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #0f172a;
            --green: #064e3b;
            --gold: #a16207;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0;
            padding-top: 60px;
            font-size: 10px;
        }

        .fixed-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-banner { 
            background: linear-gradient(to right, var(--navy), var(--green)); 
            color: white; 
            padding: 10px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--gold);
        }

        .title-text {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-buttons { display: flex; gap: 8px; }

        .btn-ui { 
            padding: 5px 12px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; 
            background: white; border: 1px solid #cbd5e1; color: var(--navy); transition: 0.2s;
        }
        .btn-ui:hover { background: #f8fafc; }
        .btn-save { background: #16a34a !important; color: white !important; border: none !important; }

        .main-container { padding: 10px; display: flex; gap: 10px; align-items: start; }
        
        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        th { 
            background-color: var(--navy); color: #fef3c7; 
            border: 1px solid #334155; padding: 5px 2px; font-size: 9px; 
        }
        td { border: 1px solid #e2e8f0; padding: 0; height: 28px; position: relative; }
        
        input { 
            width: 100%; border: none; background: transparent; text-align: center; 
            outline: none; font-size: 10px; height: 100%; font-weight: 600;
        }
        input:focus { background-color: #fffbeb; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .qty-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            gap: 2px;
        }
        .qty-input-cell { color: #2563eb; width: 45%; text-align: right; }
        .qty-divider { color: #94a3b8; }
        .qty-result-cell { color: #dc2626; width: 45%; text-align: left; font-weight: 800; }

        .section-label { 
            font-weight: 800; font-size: 10px; margin-bottom: 6px; 
            display: flex; align-items: center; gap: 6px; text-transform: uppercase;
        }
        .dot { height: 10px; width: 10px; border-radius: 2px; }

        .bg-footer { background-color: var(--navy); color: white; font-weight: bold; }
        .btn-action { width: 18px; height: 18px; line-height: 1; font-size: 14px; cursor: pointer; border: none; background: none; }

        @media print { 
            .fixed-header, .nav-buttons, .pdf-hide { display: none !important; } 
            body { padding-top: 0; }
        }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="header-banner">
            <div class="title-text">MONITORING PURCHASE ORDER</div>
            <div class="nav-buttons">
                <button class="btn-ui" onclick="window.location.href='index.html'">HOME</button>
                <button class="btn-ui btn-save" onclick="saveToCloud()">SAVE</button>
                <button class="btn-ui" onclick="window.print()">PRINT</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="w-[35%]">
            <div class="section-label text-red-700"><span class="dot bg-red-600"></span> 1. PEMBELIAN ( PO KE SUPPLIER )</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 35px;">+/-</th>
                        <th style="width: 35px;">UNIT</th>
                        <th style="width: 70px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 55px;">INU</th>
                        <th style="width: 75px;">QTY (IN / SISA)</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="5" class="text-right pr-2 py-1">TOTAL SISA</td>
                        <td id="total-supp-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="w-[30%]">
            <div class="section-label text-green-700"><span class="dot bg-green-600"></span> 2. PO DARI CUSTOMER </div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 35px;">+/-</th>
                        <th>CUSTOMER NAME</th>
                        <th style="width: 70px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 45px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="4" class="text-right pr-2 py-1">TOTAL PO</td>
                        <td id="total-cust-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="w-[35%]">
            <div class="section-label text-blue-700"><span class="dot bg-blue-600"></span> 3. REALISASI PENJUALAN </div>
            <table>
                <thead>
                    <tr>
                        <th>TUJUAN PENGIRIMAN</th>
                        <th style="width: 40px;">OUT</th>
                        <th>SUPPLIER</th>
                        <th style="width: 70px;">TANGGAL</th>
                    </tr>
                </thead>
                <tbody id="body-out"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td class="text-right pr-2 py-1">TOTAL OUT</td>
                        <td id="total-del" class="text-center">0</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [];
        let dataCust = [];
        let dataOut = [];

        function autoFormatDate(val) {
            if (!val) return "";
            let clean = val.replace(/[^0-9/]/g, "");
            let parts = clean.split("/");
            if (parts.length === 2 && parts[1].length === 2) return parts[0] + "/" + parts[1] + "/26";
            return clean;
        }

        function convertToISO(dateStr) {
            if (!dateStr || !dateStr.includes('/')) return null;
            const parts = dateStr.split('/');
            if (parts.length === 3) {
                const day = parts[0].padStart(2, '0');
                const month = parts[1].padStart(2, '0');
                const year = parts[2].length === 2 ? "20" + parts[2] : parts[2];
                return `${year}-${month}-${day}`;
            }
            return null;
        }

        function convertToDisplay(isoStr) {
        if (!isoStr) return "";
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = String(d.getFullYear()).slice(-2); // Mengambil 2 angka belakang tahun (misal: 26)
        return `${day}/${month}/${year}`;
    }
        async function loadInitialData() {
    try {
        const sekarang = new Date();
        const tahun = sekarang.getFullYear();
        const bulan = sekarang.getMonth();

        const awalBulanBerjalan = `${tahun}-${String(bulan + 1).padStart(2, '0')}-01`;
        const akhirBulanBerjalan = `${tahun}-${String(bulan + 1).padStart(2, '0')}-${new Date(tahun, bulan + 1, 0).getDate()}`;

        const [resSupp, resCust, resLogLalu, resLogBulanIni] = await Promise.all([
            _client.from('purchase_orders').select('*').order('id', { ascending: true }),
            _client.from('customer_po').select('*').order('id', { ascending: true }),
            _client.from('data_pengiriman').select('*').lt('tanggal', awalBulanBerjalan), 
            _client.from('data_pengiriman').select('*').gte('tanggal', awalBulanBerjalan).lte('tanggal', akhirBulanBerjalan).order('tanggal', { ascending: true })
        ]);

        const usageLalu = {};
        (resLogLalu.data || []).forEach(d => {
            const s = (d.supplier || '').toLowerCase().trim();
            // Proteksi: Pastikan nama supplier masa lalu tidak kosong sebelum direkap
            if (s && !s.includes('petro') && !s.includes('pan') && !s.includes('transport')) {
                usageLalu[s] = (usageLalu[s] || 0) + (parseFloat(d.jumlah_keluar) || 0);
            }
        });

        const rawSupp = (resSupp.data || []).map(d => ({ 
            unit: d.po_code || '', tgl: convertToDisplay(d.tgl_po), nopo: d.no_po || '', inu: d.tujuan || '', 
            qty_in: parseFloat(d.qty) || 0, qty_sisa: 0, isDeficit: false, isAwalStock: false
        }));

        const sisaPerSupplier = {};
        rawSupp.forEach(item => {
            const k = (item.inu || '').toLowerCase().trim();
            if (k) { // Hanya proses jika kode INU/Supplier ada isinya
                let ava = item.qty_in;
                if (usageLalu[k] > 0) {
                    const reduce = Math.min(ava, usageLalu[k]);
                    ava -= reduce;
                    usageLalu[k] -= reduce;
                }
                sisaPerSupplier[k] = (sisaPerSupplier[k] || 0) + ava;
            }
        });

        dataSupp = [];
        Object.keys(sisaPerSupplier).forEach(suppKey => {
            if (sisaPerSupplier[suppKey] > 0) {
                dataSupp.push({
                    unit: 'STOCK AWAL',
                    tgl: '',
                    nopo: 'SALDO LALU',
                    inu: suppKey.toUpperCase(),
                    qty_in: sisaPerSupplier[suppKey], 
                    qty_sisa: sisaPerSupplier[suppKey],
                    isDeficit: false,
                    isAwalStock: true 
                });
            }
        });

        dataCust = (resCust.data || []).map(d => ({ 
            name: d.delivery_to || '', tgl: convertToDisplay(d.po_date), nopo: d.number || '', qty: parseFloat(d.jumlah) || 0 
        }));

        dataOut = (resLogBulanIni.data || []).filter(d => {
            const s = (d.supplier || '').toLowerCase().trim();
            return s && !s.includes('petro') && !s.includes('pan') && !s.includes('transport'); // Proteksi string kosong
        }).map(d => ({ 
            tujuan: d.delivery_to || '', out: parseFloat(d.jumlah_keluar) || 0, supp: d.supplier || '', tgl: convertToDisplay(d.tanggal)
        }));

        // 1. Jalankan logika pemotongan stok pada data yang RIIL dulu
        processLogic();

        // 2. BARU SEJAJARKAN BARIS DI SINI (Setelah kalkulasi selesai agar tidak mengacaukan rumus)
        const targetLength = Math.max(15, dataSupp.length, dataCust.length, dataOut.length);
        while(dataSupp.length < targetLength) {
            dataSupp.push({unit:'', tgl:'', nopo:'', inu:'', qty_in:0, qty_sisa:0, isDeficit: false, isAwalStock: false});
        }
        while(dataCust.length < targetLength) {
            dataCust.push({name:'', tgl:'', nopo:'', qty:0});
        }

        renderTable();
    } catch (err) { console.error(err); }
}

function processLogic() {
    // Bersihkan baris defisit lama
    dataSupp = dataSupp.filter(item => !item.isDeficit);

    const usage = {};
    dataOut.forEach(o => {
        const k = (o.supp || '').toLowerCase().trim();
        if(k) usage[k] = (usage[k] || 0) + (parseFloat(o.out) || 0);
    });

    const remainingUsage = { ...usage };

    // Kurangi Qty In hanya untuk baris yang memiliki kode INU valid (bukan baris kosong tiruan)
    dataSupp.forEach(item => {
        const k = (item.inu || '').toLowerCase().trim();
        let currentIn = parseFloat(item.qty_in) || 0;
        
        // Kunci pengaman: k wajib ada isinya (bukan "")
        if(k && remainingUsage[k] > 0 && currentIn > 0) {
            const reduce = Math.min(currentIn, remainingUsage[k]);
            currentIn -= reduce;
            remainingUsage[k] -= reduce;
        }
        item.qty_sisa = currentIn;
    });

    // Deteksi Defisit/Overflow hanya untuk key supplier yang tidak kosong
    Object.keys(remainingUsage).forEach(key => {
        if (key && remainingUsage[key] > 0) { // Pastikan key tidak kosong ("")
            dataSupp.push({
                unit: 'DEFISIT',
                tgl: '',
                nopo: 'OVERFLOW',
                inu: key.toUpperCase(),
                qty_in: 0,
                qty_sisa: -remainingUsage[key],
                isDeficit: true,
                isAwalStock: false
            });
        }
    });
}

        // Masukkan juga PO baru (jika ada PO yang tanggalnya memang di bulan berjalan ini)
        // Catatan: Jika PO di database Anda tipenya campur, Anda bisa memfilter rawSupp di sini jika diperlukan.

        // 5. Petakan Data Customer PO & Realisasi Pengiriman Bulan Ini
        dataCust = (resCust.data || []).map(d => ({ 
            name: d.delivery_to || '', tgl: convertToDisplay(d.po_date), nopo: d.number || '', qty: parseFloat(d.jumlah) || 0 
        }));

        dataOut = (resLogBulanIni.data || []).filter(d => {
            const s = (d.supplier || '').toLowerCase();
            return !s.includes('petro') && !s.includes('pan') && !s.includes('transport');
        }).map(d => ({ 
            tujuan: d.delivery_to || '', out: parseFloat(d.jumlah_keluar) || 0, supp: d.supplier || '', tgl: convertToDisplay(d.tanggal)
        }));

        // Jalankan logika pemotongan berdasarkan realisasi bulan ini
        processLogic();

        // Menjaga kerapihan baris tampilan (Minimal 15 baris)
        const targetLength = Math.max(15, dataOut.length);
        if(dataSupp.length < targetLength) while(dataSupp.length < targetLength) dataSupp.push({unit:'', tgl:'', nopo:'', inu:'', qty_in:0, qty_sisa:0, isDeficit: false, isAwalStock: false});
        if(dataCust.length < targetLength) while(dataCust.length < targetLength) dataCust.push({name:'', tgl:'', nopo:'', qty:0});

        renderTable();
    } catch (err) { console.error(err); }
}

        function processLogic() {
    // 1. Bersihkan baris defisit lama sebelum kalkulasi ulang
    dataSupp = dataSupp.filter(item => !item.isDeficit);

    const usage = {};
    dataOut.forEach(o => {
        const k = (o.supp || '').toLowerCase().trim();
        if(k) usage[k] = (usage[k] || 0) + (parseFloat(o.out) || 0);
    });

    const remainingUsage = { ...usage };

    // 2. Kurangi Qty In (termasuk baris Stock Awal) dengan Realisasi Pengiriman Bulan Ini
    dataSupp.forEach(item => {
        const k = (item.inu || '').toLowerCase().trim();
        let currentIn = parseFloat(item.qty_in) || 0;
        if(k && remainingUsage[k] > 0 && currentIn > 0) {
            const reduce = Math.min(currentIn, remainingUsage[k]);
            currentIn -= reduce;
            remainingUsage[k] -= reduce;
        }
        item.qty_sisa = currentIn;
    });

    // 3. Deteksi Defisit/Overflow jika pengiriman melebihi Stock Awal + PO baru
    Object.keys(remainingUsage).forEach(key => {
        if (remainingUsage[key] > 0) {
            dataSupp.push({
                unit: 'DEFISIT',
                tgl: '',
                nopo: 'OVERFLOW',
                inu: key.toUpperCase(),
                qty_in: 0,
                qty_sisa: -remainingUsage[key],
                isDeficit: true,
                isAwalStock: false
            });
        }
    });
}

function renderTable() {
    // === SEJARKAN BARIS (LOGIKA RATA BAWAH) ===
    // Cari jumlah data terbanyak di antara ketiga array untuk dijadikan standar panjang tabel
    const barisTerbanyak = Math.max(15, dataSupp.length, dataCust.length, dataOut.length);
    
    // Paksa dataSupp dan dataCust menambah baris kosong jika panjangnya di bawah standar
    while(dataSupp.length < barisTerbanyak) {
        dataSupp.push({unit:'', tgl:'', nopo:'', inu:'', qty_in:0, qty_sisa:0, isDeficit: false, isAwalStock: false});
    }
    while(dataCust.length < barisTerbanyak) {
        dataCust.push({name:'', tgl:'', nopo:'', qty:0});
    }

    // 1. RENDER TABEL SUPPLIER (PO KE SUPPLIER)
    const bSupp = document.getElementById('body-supp');
    bSupp.innerHTML = '';
    dataSupp.forEach((item, i) => {
        const isReadOnly = item.isDeficit || item.isAwalStock;
        
        // Atur warna background & text berdasarkan tipe baris (Defisit = Merah, Stock Awal = Hijau, Biasa = Putih)
        const rowBg = item.isDeficit ? 'style="background-color: #fff1f2;"' : (item.isAwalStock ? 'style="background-color: #f0fdf4;"' : '');
        const textStyle = item.isDeficit ? 'color: #e11d48; font-weight: 800;' : (item.isAwalStock ? 'color: #16a34a; font-weight: 800;' : '');

        bSupp.innerHTML += `<tr ${rowBg}>
            <td class="pdf-hide text-center flex justify-center items-center gap-1">
                ${!item.isDeficit && !item.isAwalStock ? `
                <button class="btn-action text-blue-600 font-bold" onclick="addRow('supp', ${i})">+</button>
                <button class="btn-action text-red-500 font-bold" onclick="removeRow('supp', ${i})">-</button>
                ` : (item.isDeficit ? '<span class="text-red-500">⚠️</span>' : '<span class="text-green-500">📦</span>')}
            </td>
            <td><input type="text" value="${item.unit}" ${isReadOnly?'readonly':''} oninput="dataSupp[${i}].unit=this.value" style="${textStyle}"></td>
            <td><input type="text" value="${item.tgl}" ${isReadOnly?'readonly':''} onblur="this.value=autoFormatDate(this.value); dataSupp[${i}].tgl=this.value"></td>
            <td><input type="text" value="${item.nopo}" ${isReadOnly?'readonly':''} oninput="dataSupp[${i}].nopo=this.value"></td>
            <td><input type="text" value="${item.inu}" ${isReadOnly?'readonly':''} oninput="dataSupp[${i}].inu=this.value" style="${textStyle}"></td>
            <td>
                <div class="qty-container">
                    <input type="number" class="qty-input-cell" value="${item.qty_in || ''}" ${isReadOnly?'readonly':''}
                        oninput="dataSupp[${i}].qty_in=parseFloat(this.value)||0;"
                        onblur="processLogic(); renderTable();"
                        onkeydown="if(event.key==='Enter'){this.blur();}">
                    <span class="qty-divider">/</span>
                    <span id="sisa-${i}" class="qty-result-cell" style="${item.qty_sisa < 0 ? 'color: #dc2626;' : ''}">
                        ${item.qty_sisa !== 0 ? item.qty_sisa : (item.qty_in > 0 ? 0 : '')}
                    </span>
                </div>
            </td>
        </tr>`;
    });

    // 2. RENDER TABEL CUSTOMER (PO DARI CUSTOMER)
    const bCust = document.getElementById('body-cust');
    bCust.innerHTML = '';
    dataCust.forEach((item, i) => {
        bCust.innerHTML += `<tr>
            <td class="pdf-hide text-center flex justify-center items-center gap-1">
                <button class="btn-action text-green-600 font-bold" onclick="addRow('cust', ${i})">+</button>
                <button class="btn-action text-red-500 font-bold" onclick="removeRow('cust', ${i})">-</button>
            </td>
            <td><input type="text" value="${item.name}" oninput="dataCust[${i}].name=this.value"></td>
            <td><input type="text" value="${item.tgl}" onblur="this.value=autoFormatDate(this.value); dataCust[${i}].tgl=this.value"></td>
            <td><input type="text" value="${item.nopo}" oninput="dataCust[${i}].nopo=this.value"></td>
            <td><input type="number" class="text-green-700" value="${item.qty || ''}" oninput="dataCust[${i}].qty=this.value; calculateTotal();"></td>
        </tr>`;
    });

    // 3. RENDER TABEL REALISASI PENJUALAN
    const bOut = document.getElementById('body-out');
    bOut.innerHTML = '';
    const dateColors = { 0: "bg-white", 1: "bg-blue-50", 2: "bg-emerald-50", 3: "bg-amber-50", 4: "bg-purple-50", 5: "bg-rose-50", 6: "bg-slate-100" };
    
    // Loop dirender sepanjang barisTerbanyak agar tinggi tabel realisasi sama rata dengan tabel lainnya
    for(let i=0; i < barisTerbanyak; i++) {
        const o = dataOut[i] || {tujuan:'', out:'', supp:'', tgl:''};
        let rowBg = "bg-white";
        if (o.tgl) {
            const day = parseInt(o.tgl.split('/')[0]) || 0;
            rowBg = dateColors[day % 7];
        }
        bOut.innerHTML += `<tr class="${rowBg}">
            <td><input type="text" value="${o.tujuan}" readonly></td>
            <td><input type="text" value="${o.out || ''}" readonly class="text-blue-700 font-bold"></td>
            <td><input type="text" value="${o.supp}" readonly></td>
            <td><input type="text" value="${o.tgl}" readonly style="font-size:8px; color:#1e293b; font-weight:700;"></td>
        </tr>`;
    }

    calculateTotal();
}

        function calculateTotal() {
            let s=0, c=0, o=0;
            dataSupp.forEach(i => s += i.qty_sisa || 0);
            dataCust.forEach(i => c += parseFloat(i.qty) || 0);
            dataOut.forEach(i => o += i.out || 0);
            document.getElementById('total-supp-qty').innerText = s.toLocaleString('id-ID');
            document.getElementById('total-cust-qty').innerText = c.toLocaleString('id-ID');
            document.getElementById('total-del').innerText = o.toLocaleString('id-ID');
        }

        function addRow(t, idx) {
            if(t==='supp') dataSupp.splice(idx+1,0,{unit:'', tgl:'', nopo:'', inu:'', qty_in:0, qty_sisa:0, isDeficit: false});
            else dataCust.splice(idx+1,0,{name:'', tgl:'', nopo:'', qty:0});
            renderTable();
        }

        function removeRow(t, idx) {
            if(t==='supp' && dataSupp.length > 1) dataSupp.splice(idx,1);
            if(t==='cust' && dataCust.length > 1) dataCust.splice(idx,1);
            renderTable();
        }

        async function saveToCloud() {
            const btn = document.querySelector('.btn-save');
            try {
                btn.innerText = "SAVING...";
                const s = dataSupp.filter(x => !x.isDeficit && (x.unit || x.qty_in > 0)).map(x => ({ 
                    po_code: x.unit, tgl_po: convertToISO(x.tgl), no_po: x.nopo, tujuan: x.inu, qty: x.qty_in 
                }));
                const c = dataCust.filter(x => x.name || x.qty > 0).map(x => ({ 
                    delivery_to: x.name, po_date: convertToISO(x.tgl), number: x.nopo, jumlah: parseFloat(x.qty) || 0 
                }));

                await _client.from('purchase_orders').delete().filter('id', 'gt', 0);
                await _client.from('customer_po').delete().filter('id', 'gt', 0);
                if(s.length) await _client.from('purchase_orders').insert(s);
                if(c.length) await _client.from('customer_po').insert(c);

                alert("Berhasil Tersimpan!");
                location.reload();
            } catch (err) { alert("Gagal: " + err.message); }
            finally { btn.innerText = "SAVE"; }
        }

        window.onload = loadInitialData;
    </script>
</body>
</html>
