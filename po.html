<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONITORING PO - COMPACT VIEW</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy-dark: #0f172a;
            --green-deep: #064e3b;
            --gold-accent: #a16207;
            --bg-body: #f8fafc;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-body); 
            padding: 10px; 
            color: #1e293b;
            font-size: 10px;
        }
        
        .header-banner { 
            background: linear-gradient(to right, var(--navy-dark), var(--green-deep)); 
            color: white; padding: 8px; text-align: center; font-weight: bold; font-size: 14px; 
            border-radius: 4px; margin-bottom: 10px; border-bottom: 3px solid var(--gold-accent); 
            text-transform: uppercase;
        }

        table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        
        th { 
            background-color: var(--navy-dark); color: #fef3c7; 
            border: 1px solid #1e293b; padding: 4px 2px; font-size: 9px; 
        }

        td { border: 1px solid #cbd5e1; padding: 0; height: 24px; overflow: hidden; }
        
        input { 
            width: 100%; border: none; background: transparent; text-align: center; 
            outline: none; font-size: 10px; height: 100%; padding: 0 2px;
        }
        
        input:focus { background-color: #fffbeb; }

        .bg-footer { background-color: #1e293b; color: white; font-weight: bold; font-size: 10px; }
        .section-label { font-weight: bold; font-size: 10px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }

        .btn-ui { 
            padding: 4px 10px; font-size: 9px; font-weight: bold; cursor: pointer; border-radius: 3px; 
            background: white; border: 1px solid #94a3b8; transition: 0.2s;
        }
        .btn-save { background: #166534 !important; color: white !important; border: none !important; }
        
        .floating-actions { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 1000; opacity: 0.9; }
        .floating-actions:hover { opacity: 1; }

        @media print { .floating-actions, .pdf-hide { display: none !important; } body { padding: 0; } }
    </style>
</head>
<body>

    <div class="header-banner"> MONITORING GLOBAL PURCHASE ORDER </div>
    
    <div class="flex gap-2 items-start">
        <!-- SEKSI 1 -->
        <div class="w-[32%]">
            <div class="section-label"><span class="dot bg-red-600"></span> 1. INBOUND SUPPLIER (KSE/IDE)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 20px;">+</th>
                        <th style="width: 35px;">UNIT</th>
                        <th style="width: 65px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 50px;">INU</th>
                        <th style="width: 40px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-supp"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="5" class="text-right pr-2">TOTAL</td>
                        <td id="total-supp-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- SEKSI 2 -->
        <div class="w-[32%]">
            <div class="section-label"><span class="dot bg-green-600"></span> 2. PO CUSTOMER (IN)</div>
            <table>
                <thead>
                    <tr>
                        <th class="pdf-hide" style="width: 20px;">+</th>
                        <th>CUSTOMER</th>
                        <th style="width: 65px;">TGL PO</th>
                        <th>NO PO</th>
                        <th style="width: 40px;">QTY</th>
                    </tr>
                </thead>
                <tbody id="body-cust"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td colspan="4" class="text-right pr-2">TOTAL</td>
                        <td id="total-cust-qty" class="text-center">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <!-- SEKSI 3 -->
        <div class="w-[36%]">
            <div class="section-label"><span class="dot bg-blue-600"></span> 3. REALISASI LOGISTIK (BULAN INI)</div>
            <table>
                <thead>
                    <tr>
                        <th>TUJUAN</th>
                        <th style="width: 35px;">OUT</th>
                        <th>SUPPLIER</th>
                        <th style="width: 60px;">TANGGAL</th>
                    </tr>
                </thead>
                <tbody id="body-out"></tbody>
                <tfoot>
                    <tr class="bg-footer">
                        <td class="text-right pr-2">TOTAL REALISASI</td>
                        <td id="total-del" class="text-center">0</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="floating-actions">
        <button class="btn-ui" onclick="window.location.href='index.html'">HOME</button>
        <button class="btn-ui btn-save" onclick="saveToCloud()">SIMPAN DATA</button>
        <button class="btn-ui" onclick="window.print()">CETAK</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ntaectphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataSupp = [];
        let dataCust = [];
        let dataOut = [];

        async function loadInitialData() {
            try {
                // Perhitungan Rentang Tanggal Bulan Berjalan
                const now = new Date();
                const y = now.getFullYear();
                const m = now.getMonth();
                const firstDay = new Date(y, m, 1).toISOString().split('T')[0];
                const lastDay = new Date(y, m + 1, 0).toISOString().split('T')[0];

                const [resSupp, resCust, resLog] = await Promise.all([
                    _client.from('purchase_orders').select('*').order('id', { ascending: true }),
                    _client.from('customer_po').select('*').order('id', { ascending: true }),
                    _client.from('data_pengiriman')
                           .select('*')
                           .gte('tanggal', firstDay)
                           .lte('tanggal', lastDay)
                           .order('tanggal', { ascending: false })
                ]);

                dataSupp = (resSupp.data || []).map(d => ({ 
                    unit: d.po_code || '', tgl: d.tgl_po || '', nopo: d.no_po || '', inu: d.tujuan || '', qty: parseFloat(d.qty) || 0 
                }));

                dataCust = (resCust.data || []).map(d => ({ 
                    name: d.delivery_to || '', tgl: d.po_date || '', nopo: d.number || '', qty: parseFloat(d.jumlah) || 0 
                }));

                // Filter Supplier: Kecualikan Petro, Pan, Transport
                dataOut = (resLog.data || []).filter(d => {
                    const s = (d.supplier || '').toLowerCase();
                    return !s.includes('petro') && !s.includes('pan') && !s.includes('transport');
                }).map(d => ({ 
                    tujuan: d.delivery_to || '', 
                    out: parseFloat(d.jumlah_keluar) || 0, 
                    supp: d.supplier || '', 
                    tgl: d.tanggal || '' 
                }));

                // Auto Cut Stock
                processAutoStockReduction();

                // Pastikan minimal ada 20 baris agar tabel penuh
                while(dataSupp.length < 20) dataSupp.push({unit:'', tgl:'', nopo:'', inu:'', qty:0});
                while(dataCust.length < 20) dataCust.push({name:'', tgl:'', nopo:'', qty:0});

                renderTable();
            } catch (err) { console.error("Load error:", err); }
        }

        function processAutoStockReduction() {
            const usageMap = {};
            dataOut.forEach(out => {
                const key = (out.supp || '').toLowerCase().trim();
                usageMap[key] = (usageMap[key] || 0) + out.out;
            });

            dataSupp.forEach(item => {
                const inuKey = (item.inu || '').toLowerCase().trim();
                if (usageMap[inuKey] > 0 && item.qty > 0) {
                    const reduction = Math.min(item.qty, usageMap[inuKey]);
                    item.qty -= reduction;
                    usageMap[inuKey] -= reduction;
                }
            });
        }

        function renderTable() {
            const maxRows = Math.max(dataSupp.length, dataCust.length, dataOut.length);
            
            const bSupp = document.getElementById('body-supp');
            bSupp.innerHTML = '';
            for(let i=0; i < dataSupp.length; i++) {
                const item = dataSupp[i];
                bSupp.innerHTML += `<tr>
                    <td class="pdf-hide text-center"><button onclick="addRow('supp', ${i})">+</button></td>
                    <td><input type="text" value="${item.unit}" oninput="dataSupp[${i}].unit=this.value"></td>
                    <td><input type="text" value="${item.tgl}" oninput="dataSupp[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataSupp[${i}].nopo=this.value"></td>
                    <td><input type="text" value="${item.inu}" oninput="dataSupp[${i}].inu=this.value"></td>
                    <td><input type="number" value="${item.qty || ''}" oninput="dataSupp[${i}].qty=this.value; calculateTotal();"></td>
                </tr>`;
            }

            const bCust = document.getElementById('body-cust');
            bCust.innerHTML = '';
            for(let i=0; i < dataCust.length; i++) {
                const item = dataCust[i];
                bCust.innerHTML += `<tr>
                    <td class="pdf-hide text-center"><button onclick="addRow('cust', ${i})">+</button></td>
                    <td><input type="text" value="${item.name}" oninput="dataCust[${i}].name=this.value"></td>
                    <td><input type="text" value="${item.tgl}" oninput="dataCust[${i}].tgl=this.value"></td>
                    <td><input type="text" value="${item.nopo}" oninput="dataCust[${i}].nopo=this.value"></td>
                    <td><input type="number" value="${item.qty || ''}" oninput="dataCust[${i}].qty=this.value; calculateTotal();"></td>
                </tr>`;
            }

            const bOut = document.getElementById('body-out');
            bOut.innerHTML = '';
            for(let i=0; i < maxRows; i++) {
                const item = dataOut[i] || {tujuan:'', out:'', supp:'', tgl:''};
                bOut.innerHTML += `<tr class="${item.out ? 'bg-blue-50' : ''}">
                    <td><input type="text" value="${item.tujuan}" readonly></td>
                    <td><input type="text" value="${item.out || ''}" readonly class="font-bold text-blue-700"></td>
                    <td><input type="text" value="${item.supp}" readonly></td>
                    <td><input type="text" value="${item.tgl}" readonly style="font-size:8px;"></td>
                </tr>`;
            }
            calculateTotal();
        }

        function calculateTotal() {
            let s=0, c=0, o=0;
            dataSupp.forEach(i => s += parseFloat(i.qty) || 0);
            dataCust.forEach(i => c += parseFloat(i.qty) || 0);
            dataOut.forEach(i => o += parseFloat(i.out) || 0);
            document.getElementById('total-supp-qty').innerText = s.toLocaleString();
            document.getElementById('total-cust-qty').innerText = c.toLocaleString();
            document.getElementById('total-del').innerText = o.toLocaleString();
        }

        function addRow(type, idx) {
            if(type==='supp') dataSupp.splice(idx+1, 0, {unit:'', tgl:'', nopo:'', inu:'', qty:0});
            else dataCust.splice(idx+1, 0, {name:'', tgl:'', nopo:'', qty:0});
            renderTable();
        }

        async function saveToCloud() {
            try {
                const btn = document.querySelector('.btn-save');
                btn.innerText = "SAVING...";
                
                const s = dataSupp.filter(x => x.unit || x.nopo).map(x => ({ po_code:x.unit, tgl_po:x.tgl, no_po:x.nopo, tujuan:x.inu, qty:parseFloat(x.qty)||0 }));
                const c = dataCust.filter(x => x.name || x.nopo).map(x => ({ delivery_to:x.name, po_date:x.tgl, number:x.nopo, jumlah:parseFloat(x.qty)||0 }));

                await _client.from('purchase_orders').delete().neq('id', 0);
                await _client.from('customer_po').delete().neq('id', 0);
                await _client.from('purchase_orders').insert(s);
                await _client.from('customer_po').insert(c);

                alert("Data Berhasil Disimpan!");
                location.reload();
            } catch (err) { alert("Simpan Gagal!"); }
        }

        window.onload = loadInitialData;
    </script>
</body>
</html>
